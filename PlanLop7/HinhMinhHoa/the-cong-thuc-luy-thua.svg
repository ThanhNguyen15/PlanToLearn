<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 334" width="900" height="334" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="334" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Sáu công thức lũy thừa cần thuộc</text>
<g transform="translate(0,44)">
<rect x="20" y="10" width="270" height="125" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="155" y="36" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700"><tspan x="155" dy="0">Nhân cùng cơ số</tspan></text><text x="155" y="76" text-anchor="middle" font-size="24" fill="#1f2937" font-weight="700"><tspan x="155" dy="0">xᵐ · xⁿ = xᵐ⁺ⁿ</tspan></text><text x="155" y="120" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="155" dy="0">Cộng số mũ</tspan></text><rect x="310" y="10" width="270" height="125" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="445" y="36" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700"><tspan x="445" dy="0">Chia cùng cơ số</tspan></text><text x="445" y="76" text-anchor="middle" font-size="24" fill="#1f2937" font-weight="700"><tspan x="445" dy="0">xᵐ : xⁿ = xᵐ⁻ⁿ</tspan></text><text x="445" y="120" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="445" dy="0">Trừ số mũ (x ≠ 0, m ≥ n)</tspan></text><rect x="600" y="10" width="270" height="125" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="735" y="36" text-anchor="middle" font-size="15" fill="#059669" font-weight="700"><tspan x="735" dy="0">Lũy thừa của lũy thừa</tspan></text><text x="735" y="76" text-anchor="middle" font-size="24" fill="#1f2937" font-weight="700"><tspan x="735" dy="0">(xᵐ)ⁿ = xᵐ·ⁿ</tspan></text><text x="735" y="120" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="735" dy="0">Nhân số mũ</tspan></text><rect x="20" y="150" width="270" height="125" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="155" y="176" text-anchor="middle" font-size="15" fill="#f59e0b" font-weight="700"><tspan x="155" dy="0">Lũy thừa của tích</tspan></text><text x="155" y="216" text-anchor="middle" font-size="24" fill="#1f2937" font-weight="700"><tspan x="155" dy="0">(x·y)ⁿ = xⁿ·yⁿ</tspan></text><text x="155" y="260" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="155" dy="0"> </tspan></text><rect x="310" y="150" width="270" height="125" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="445" y="176" text-anchor="middle" font-size="15" fill="#f59e0b" font-weight="700"><tspan x="445" dy="0">Lũy thừa của thương</tspan></text><text x="445" y="216" text-anchor="middle" font-size="24" fill="#1f2937" font-weight="700"><tspan x="445" dy="0">(x/y)ⁿ = xⁿ/yⁿ</tspan></text><text x="445" y="260" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="445" dy="0">y ≠ 0</tspan></text><rect x="600" y="150" width="270" height="125" rx="14" fill="#fde2da" stroke="#e4572e" stroke-width="2"/><text x="735" y="176" text-anchor="middle" font-size="15" fill="#e4572e" font-weight="700"><tspan x="735" dy="0">Dấu của lũy thừa</tspan></text><text x="735" y="216" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="700"><tspan x="735" dy="0">(−x)ⁿ: mũ chẵn → dương</tspan><tspan x="735" dy="21.25">mũ lẻ → âm</tspan></text><text x="735" y="260" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="735" dy="0">x⁰ = 1 (x ≠ 0)</tspan></text>
</g>
</svg>
