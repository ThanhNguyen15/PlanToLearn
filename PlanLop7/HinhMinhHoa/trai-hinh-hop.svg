<rect x="0" y="0" width="900" height="474" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Hình khai triển của hình hộp chữ nhật</text>
<g transform="translate(0,44)">
<rect x="40" y="165" width="150" height="100" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="115" y="211.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="115" dy="0">Mặt bên</tspan><tspan x="115" dy="16.25">a × c</tspan></text><rect x="190" y="165" width="90" height="100" rx="0" fill="#d1fae5" stroke="#1f2937" stroke-width="1.5"/><text x="235" y="211.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="235" dy="0">Mặt bên</tspan><tspan x="235" dy="16.25">b × c</tspan></text><rect x="280" y="165" width="150" height="100" rx="0" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/><text x="355" y="211.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="355" dy="0">Mặt bên</tspan><tspan x="355" dy="16.25">a × c</tspan></text><rect x="430" y="165" width="90" height="100" rx="0" fill="#d1fae5" stroke="#1f2937" stroke-width="1.5"/><text x="475" y="211.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="475" dy="0">Mặt bên</tspan><tspan x="475" dy="16.25">b × c</tspan></text><rect x="190" y="15" width="90" height="150" rx="0" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/><text x="235" y="86.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="235" dy="0">Đáy trên</tspan><tspan x="235" dy="16.25">a × b</tspan></text><rect x="190" y="265" width="90" height="150" rx="0" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/><text x="235" y="336.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="235" dy="0">Đáy dưới</tspan><tspan x="235" dy="16.25">a × b</tspan></text><text x="235" y="435" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="235" dy="0"> </tspan></text><rect x="600" y="60" width="285" height="300" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="616" y="153.7" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="616" dy="0">Ghép 4 mặt bên thành</tspan><tspan x="616" dy="17.5">một hình chữ nhật:</tspan><tspan x="616" dy="17.5">dài = chu vi đáy 2(a + b)</tspan><tspan x="616" dy="17.5">rộng = chiều cao c</tspan><tspan x="616" dy="17.5"> </tspan><tspan x="616" dy="17.5">⇒ S_xq = 2(a + b) · c</tspan><tspan x="616" dy="17.5"> </tspan><tspan x="616" dy="17.5">S_tp = S_xq + 2 · a · b</tspan></text><text x="445" y="287" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="445" dy="0"> </tspan></text>
</g>
</svg>
