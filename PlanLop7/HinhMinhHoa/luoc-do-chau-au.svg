<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 399" width="900" height="399" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="399" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Sơ đồ tự nhiên châu Âu (theo hướng Bắc – Nam, Tây – Đông)</text>
<g transform="translate(0,44)">
<rect x="150" y="20" width="600" height="300" rx="20" fill="none" stroke="#1f2937" stroke-width="2"/><rect x="150" y="20" width="600" height="70" rx="20" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="450" y="50" text-anchor="middle" font-size="14" fill="#0d9488" font-weight="700"><tspan x="450" dy="0">BẮC: cực, cận cực · núi già Xcan-đi-na-vi</tspan></text><text x="450" y="72" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="450" dy="0">đài nguyên, rừng lá kim</tspan></text><rect x="150" y="95" width="230" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="265" y="140" text-anchor="middle" font-size="13.5" fill="#2563eb" font-weight="700"><tspan x="265" dy="0">TÂY: ôn đới HẢI DƯƠNG</tspan></text><text x="265" y="165" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="265" dy="0">mát, ẩm, mưa quanh năm</tspan><tspan x="265" dy="15">(dòng biển nóng Bắc</tspan><tspan x="265" dy="15">Đại Tây Dương, gió Tây)</tspan></text><rect x="385" y="95" width="130" height="150" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="450" y="140" text-anchor="middle" font-size="13.5" fill="#059669" font-weight="700"><tspan x="450" dy="0">ĐỒNG BẰNG</tspan></text><text x="450" y="165" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="450" dy="0">chiếm phần lớn</tspan><tspan x="450" dy="15">diện tích</tspan><tspan x="450" dy="15">(Đông Âu, Bắc Pháp)</tspan></text><rect x="520" y="95" width="230" height="150" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="635" y="140" text-anchor="middle" font-size="13.5" fill="#f59e0b" font-weight="700"><tspan x="635" dy="0">ĐÔNG: ôn đới LỤC ĐỊA</tspan></text><text x="635" y="165" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="635" dy="0">đông lạnh, khô;</tspan><tspan x="635" dy="15">hè nóng, ít mưa</tspan><tspan x="635" dy="15">sông Von-ga</tspan></text><rect x="150" y="250" width="600" height="70" rx="20" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="450" y="278" text-anchor="middle" font-size="14" fill="#e4572e" font-weight="700"><tspan x="450" dy="0">NAM: cận nhiệt ĐỊA TRUNG HẢI · núi trẻ An-pơ, Các-pát</tspan></text><text x="450" y="300" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="450" dy="0">hè nóng khô, đông ấm có mưa</tspan></text><text x="80" y="175" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="700"><tspan x="80" dy="0">Đại</tspan><tspan x="80" dy="17.5">Tây</tspan><tspan x="80" dy="17.5">Dương</tspan></text><text x="820" y="165" text-anchor="middle" font-size="13" fill="#92400e" font-weight="700"><tspan x="820" dy="0">dãy</tspan><tspan x="820" dy="16.25">U-ran</tspan><tspan x="820" dy="16.25">(giáp</tspan><tspan x="820" dy="16.25">châu Á)</tspan></text><text x="450" y="345" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="450" dy="0">Bắc Băng Dương ở phía bắc · Địa Trung Hải ở phía nam</tspan></text>
</g>
</svg>
