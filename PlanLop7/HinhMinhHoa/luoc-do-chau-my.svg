<rect x="0" y="0" width="900" height="494" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Lát cắt địa hình châu Mỹ (sơ đồ, không theo tỉ lệ)</text>
<g transform="translate(0,44)">
<text x="30" y="30" text-anchor="start" font-size="15" fill="#059669" font-weight="700"><tspan x="30" dy="0">Bắc Mỹ – lát cắt Tây → Đông</tspan></text><path d="M40,180 L80,120 L120,85 L160,110 L200,80 L240,120 L280,160 L600,170 L660,135 L700,125 L740,140 L800,170 L860,180 Z" fill="#fde68a" stroke="#92400e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="170" y="70" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="170" dy="0">Coóc-đi-e (núi cao, đồ sộ)</tspan></text><text x="440" y="155" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="440" dy="0">Đồng bằng trung tâm</tspan></text><text x="700" y="115" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="700" dy="0">A-pa-lát (núi già)</tspan></text><text x="40" y="198" text-anchor="start" font-size="12" fill="#2563eb"><tspan x="40" dy="0">TÂY (Thái Bình Dương)</tspan></text><text x="860" y="198" text-anchor="end" font-size="12" fill="#2563eb"><tspan x="860" dy="0">ĐÔNG (Đại Tây Dương)</tspan></text><text x="30" y="250" text-anchor="start" font-size="15" fill="#f59e0b" font-weight="700"><tspan x="30" dy="0">Nam Mỹ – lát cắt Tây → Đông</tspan></text><path d="M40,400 L70,320 L110,290 L150,315 L190,380 L520,392 L600,365 L700,350 L800,370 L860,400 Z" fill="#fde68a" stroke="#92400e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="110" y="280" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="110" dy="0">An-đét (cao, đồ sộ)</tspan></text><text x="360" y="378" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="360" dy="0">Đồng bằng A-ma-dôn (rộng nhất TG)</tspan></text><text x="700" y="340" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="700" dy="0">Sơn nguyên</tspan></text><text x="40" y="418" text-anchor="start" font-size="12" fill="#2563eb"><tspan x="40" dy="0">TÂY (Thái Bình Dương)</tspan></text><text x="860" y="418" text-anchor="end" font-size="12" fill="#2563eb"><tspan x="860" dy="0">ĐÔNG (Đại Tây Dương)</tspan></text><text x="450" y="440" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="450" dy="0">Rừng A-ma-dôn: rừng nhiệt đới lớn nhất – "lá phổi xanh" của Trái Đất · Kênh đào Pa-na-ma nối hai đại dương</tspan></text>
