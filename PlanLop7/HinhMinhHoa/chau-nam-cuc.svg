<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" width="900" height="404" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="404" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Châu Nam Cực – lục địa băng giá (sơ đồ)</text>
<g transform="translate(0,44)">
<circle cx="230" cy="190" r="170" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="230" y="40" text-anchor="middle" font-size="12.5" fill="#2563eb"><tspan x="230" dy="0">Đại dương bao quanh</tspan></text><path d="M120,120 C170,60 300,60 350,120 C390,170 360,260 300,290 C230,320 140,300 110,240 C90,200 95,150 120,120 Z" fill="#f8fafc" stroke="#6b7280" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="230" cy="190" r="150" fill="none" stroke="#e4572e" stroke-width="2" stroke-dasharray="8 6"/><text x="230" y="352" text-anchor="middle" font-size="12.5" fill="#e4572e" font-weight="700"><tspan x="230" dy="0">vòng cực Nam (66°33′ vĩ độ Nam)</tspan></text><circle cx="230" cy="190" r="6" fill="#e4572e"/><text x="230" y="215" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="230" dy="0">Cực Nam</tspan></text><text x="230" y="150" text-anchor="middle" font-size="14" fill="#0d9488" font-weight="700"><tspan x="230" dy="0">BĂNG dày ~2 km</tspan></text><rect x="450" y="20" width="435" height="330" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="466" y="96.9" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="466" dy="0">Châu Nam Cực:</tspan><tspan x="466" dy="16.875">• ~14 triệu km², phát hiện muộn nhất (~1820)</tspan><tspan x="466" dy="16.875">• lạnh nhất thế giới (từng đo &lt; −89°C)</tspan><tspan x="466" dy="16.875">• gần như phủ kín băng; gió bão nhiều</tspan><tspan x="466" dy="16.875">• chim cánh cụt, hải cẩu, cá voi</tspan><tspan x="466" dy="16.875">• không có dân cư thường xuyên,</tspan><tspan x="466" dy="16.875">  chỉ có trạm nghiên cứu khoa học</tspan><tspan x="466" dy="16.875">• Hiệp ước Nam Cực (1959): chỉ dùng</tspan><tspan x="466" dy="16.875">  cho hòa bình, nghiên cứu khoa học</tspan><tspan x="466" dy="16.875"> </tspan><tspan x="466" dy="16.875">⚠ Băng tan → nước biển dâng →</tspan><tspan x="466" dy="16.875">   đe dọa đồng bằng sông Cửu Long</tspan></text>
</g>
</svg>
