<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 374" width="900" height="374" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="374" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Nhân giống cây: giâm, chiết, ghép</text>
<g transform="translate(0,44)">
<rect x="8" y="0" width="289" height="300" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="152" y="26" text-anchor="middle" font-size="16" fill="#1f2937" font-weight="700"><tspan x="152" dy="0">Giâm cành</tspan></text><text x="152" y="270" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="152" dy="0">cắm đoạn cành vào đất ẩm</tspan><tspan x="152" dy="15.625">→ cành ra rễ thành cây mới</tspan></text><rect x="40" y="180" width="225" height="60" rx="3" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><line x1="150" y1="230" x2="160" y2="70" stroke="#92400e" stroke-width="7" stroke-linecap="round"/><path d="M157,110 q30,-20 50,0 q-25,18 -50,0 Z" fill="#d1fae5" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M159,90 q-30,-20 -50,0 q25,18 50,0 Z" fill="#d1fae5" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M150,230 q-20,10 -35,5 M150,230 q15,12 30,8 M150,232 l-2,10" fill="none" stroke="#92400e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="305" y="0" width="289" height="300" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="449" y="26" text-anchor="middle" font-size="16" fill="#1f2937" font-weight="700"><tspan x="449" dy="0">Chiết cành</tspan></text><text x="449" y="270" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="449" dy="0">bóc vỏ, bó bầu đất trên cành</tspan><tspan x="449" dy="15.625">→ ra rễ rồi cắt khỏi cây mẹ</tspan></text><line x1="380" y1="250" x2="380" y2="60" stroke="#92400e" stroke-width="10" stroke-linecap="round"/><line x1="380" y1="150" x2="520" y2="80" stroke="#92400e" stroke-width="6" stroke-linecap="round"/><ellipse cx="450" cy="115" rx="30" ry="22" fill="#fde68a" stroke="#92400e" stroke-width="2"/><text x="450" y="160" text-anchor="middle" font-size="12" fill="#92400e" font-weight="700"><tspan x="450" dy="0">bầu đất</tspan></text><path d="M520,80 q20,-25 40,-10 q-20,20 -40,10 Z" fill="#d1fae5" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="602" y="0" width="289" height="300" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="746" y="26" text-anchor="middle" font-size="16" fill="#1f2937" font-weight="700"><tspan x="746" dy="0">Ghép</tspan></text><text x="746" y="270" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="746" dy="0">gắn cành/mắt ghép lên gốc ghép</tspan><tspan x="746" dy="15.625">→ cây mới mang đặc tính tốt</tspan></text><rect x="660" y="180" width="200" height="60" rx="3" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><line x1="760" y1="230" x2="760" y2="130" stroke="#92400e" stroke-width="10" stroke-linecap="round"/><line x1="760" y1="130" x2="765" y2="60" stroke="#65a30d" stroke-width="7" stroke-linecap="round"/><rect x="750" y="120" width="22" height="22" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="800" y="136" text-anchor="start" font-size="12" fill="#2563eb"><tspan x="800" dy="0">băng buộc</tspan></text><text x="800" y="85" text-anchor="start" font-size="12" fill="#059669"><tspan x="800" dy="0">cành ghép</tspan></text><text x="800" y="175" text-anchor="start" font-size="12" fill="#92400e"><tspan x="800" dy="0">gốc ghép</tspan></text><text x="450" y="318" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">Đều là SINH SẢN VÔ TÍNH (sinh sản sinh dưỡng): giữ nguyên đặc tính của cây mẹ, nhanh cho thu hoạch</tspan></text>
</g>
</svg>
