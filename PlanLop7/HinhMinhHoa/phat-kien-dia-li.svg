<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" width="900" height="404" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="404" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Các cuộc đại phát kiến địa lí (cuối thế kỉ XV – đầu XVI)</text>
<g transform="translate(0,44)">
<line x1="20" y1="50" x2="885" y2="50" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)" stroke-linecap="round"/><circle cx="120" cy="50" r="10" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="120" y="30" text-anchor="middle" font-size="16" fill="#2563eb" font-weight="700"><tspan x="120" dy="0">1487</tspan></text><rect x="20" y="75" width="200" height="150" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="120" y="102" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700"><tspan x="120" dy="0">B. Đi-a-xơ</tspan></text><text x="120" y="124" text-anchor="middle" font-size="12.5" fill="#6b7280"><tspan x="120" dy="0">(Bồ Đào Nha)</tspan></text><text x="120" y="160" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="120" dy="0">Mũi Hảo Vọng</tspan><tspan x="120" dy="16.875">(cực Nam châu Phi)</tspan></text><circle cx="338" cy="50" r="10" fill="#e4572e" stroke="#e4572e" stroke-width="2"/><text x="338" y="30" text-anchor="middle" font-size="16" fill="#e4572e" font-weight="700"><tspan x="338" dy="0">1492</tspan></text><rect x="238" y="75" width="200" height="150" rx="12" fill="#fde2da" stroke="#e4572e" stroke-width="2"/><text x="338" y="102" text-anchor="middle" font-size="15" fill="#e4572e" font-weight="700"><tspan x="338" dy="0">C. Cô-lôm-bô</tspan></text><text x="338" y="124" text-anchor="middle" font-size="12.5" fill="#6b7280"><tspan x="338" dy="0">(Tây Ban Nha)</tspan></text><text x="338" y="160" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="338" dy="0">Đến châu Mỹ</tspan><tspan x="338" dy="16.875">("Tân thế giới")</tspan></text><circle cx="556" cy="50" r="10" fill="#059669" stroke="#059669" stroke-width="2"/><text x="556" y="30" text-anchor="middle" font-size="16" fill="#059669" font-weight="700"><tspan x="556" dy="0">1497–1498</tspan></text><rect x="456" y="75" width="200" height="150" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="556" y="102" text-anchor="middle" font-size="15" fill="#059669" font-weight="700"><tspan x="556" dy="0">Va-xcô đơ Ga-ma</tspan></text><text x="556" y="124" text-anchor="middle" font-size="12.5" fill="#6b7280"><tspan x="556" dy="0">(Bồ Đào Nha)</tspan></text><text x="556" y="160" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="556" dy="0">Vòng qua châu Phi</tspan><tspan x="556" dy="16.875">đến Ấn Độ</tspan></text><circle cx="774" cy="50" r="10" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="774" y="30" text-anchor="middle" font-size="16" fill="#7c3aed" font-weight="700"><tspan x="774" dy="0">1519–1522</tspan></text><rect x="674" y="75" width="200" height="150" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="774" y="102" text-anchor="middle" font-size="15" fill="#7c3aed" font-weight="700"><tspan x="774" dy="0">Ph. Ma-gien-lăng</tspan></text><text x="774" y="124" text-anchor="middle" font-size="12.5" fill="#6b7280"><tspan x="774" dy="0">(Tây Ban Nha)</tspan></text><text x="774" y="160" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="774" dy="0">Vòng quanh thế giới</tspan><tspan x="774" dy="16.875">→ Trái Đất hình cầu</tspan></text><rect x="20" y="240" width="420" height="110" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="230" y="282.9" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="230" dy="0">Nguyên nhân:</tspan><tspan x="230" dy="16.875">• cần vàng bạc, hương liệu, thị trường</tspan><tspan x="230" dy="16.875">• kĩ thuật hàng hải: la bàn, tàu Ca-ra-ven</tspan></text><rect x="460" y="240" width="425" height="110" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="672.5" y="282.9" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="672.5" dy="0">Hệ quả:</tspan><tspan x="672.5" dy="16.875">+ Trái Đất hình cầu; thương mại thế giới mở rộng</tspan><tspan x="672.5" dy="16.875">− buôn bán nô lệ, cướp bóc thuộc địa</tspan></text>
</g>
</svg>
