<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 514" width="900" height="514" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="514" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Dàn ý bài nghị luận về một vấn đề trong đời sống</text>
<g transform="translate(0,44)">
<rect x="120" y="64" width="660" height="330" rx="8" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="8 5"/><text x="840" y="230" text-anchor="middle" font-size="16" fill="#059669" font-weight="700"><tspan x="840" dy="0">THÂN</tspan><tspan x="840" dy="20">BÀI</tspan></text><rect x="150" y="6" width="600" height="52" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="170" y="28" text-anchor="start" font-size="15.5" fill="#2563eb" font-weight="700"><tspan x="170" dy="0">MỞ BÀI</tspan></text><text x="170" y="48" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="170" dy="0">Nêu vấn đề + ý kiến của em (tán thành)</tspan></text><line x1="450" y1="58" x2="450" y2="70" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="150" y="72" width="600" height="52" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><text x="170" y="94" text-anchor="start" font-size="15.5" fill="#0d9488" font-weight="700"><tspan x="170" dy="0">1. Giải thích</tspan></text><text x="170" y="114" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="170" dy="0">Vấn đề nghĩa là gì?</tspan></text><line x1="450" y1="124" x2="450" y2="136" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="150" y="138" width="600" height="52" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="170" y="160" text-anchor="start" font-size="15.5" fill="#059669" font-weight="700"><tspan x="170" dy="0">2. Lí lẽ 1 + bằng chứng</tspan></text><text x="170" y="180" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="170" dy="0">Vì sao đúng? Số liệu, sự việc, tấm gương</tspan></text><line x1="450" y1="190" x2="450" y2="202" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="150" y="204" width="600" height="52" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="170" y="226" text-anchor="start" font-size="15.5" fill="#059669" font-weight="700"><tspan x="170" dy="0">3. Lí lẽ 2 + bằng chứng</tspan></text><text x="170" y="246" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="170" dy="0">Thêm một lí do khác + ví dụ cụ thể</tspan></text><line x1="450" y1="256" x2="450" y2="268" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="150" y="270" width="600" height="52" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="170" y="292" text-anchor="start" font-size="15.5" fill="#f59e0b" font-weight="700"><tspan x="170" dy="0">4. Ý kiến trái chiều</tspan></text><text x="170" y="312" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="170" dy="0">Có người cho rằng… → phản bác ngắn gọn</tspan></text><line x1="450" y1="322" x2="450" y2="334" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="150" y="336" width="600" height="52" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="170" y="358" text-anchor="start" font-size="15.5" fill="#7c3aed" font-weight="700"><tspan x="170" dy="0">5. Bài học, hành động</tspan></text><text x="170" y="378" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="170" dy="0">Em sẽ làm gì? (cụ thể)</tspan></text><line x1="450" y1="388" x2="450" y2="400" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="150" y="402" width="600" height="52" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="170" y="424" text-anchor="start" font-size="15.5" fill="#2563eb" font-weight="700"><tspan x="170" dy="0">KẾT BÀI</tspan></text><text x="170" y="444" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="170" dy="0">Khẳng định lại ý kiến, lời kêu gọi</tspan></text>
</g>
</svg>
