<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 239" width="900" height="239" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="239" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Bốn bước xử lý tình huống (GDCD)</text>
<g transform="translate(0,44)">
<rect x="20" y="20" width="190" height="130" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="115" y="52" text-anchor="middle" font-size="17" fill="#2563eb" font-weight="700"><tspan x="115" dy="0">1. Xác định</tspan></text><text x="115" y="90" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="115" dy="0">Chuyện gì đang</tspan><tspan x="115" dy="16.875">xảy ra? Ai làm gì?</tspan></text><line x1="212" y1="85" x2="238" y2="85" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="240" y="20" width="190" height="130" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/><text x="335" y="52" text-anchor="middle" font-size="17" fill="#f59e0b" font-weight="700"><tspan x="335" dy="0">2. Đánh giá</tspan></text><text x="335" y="90" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="335" dy="0">Đúng hay sai?</tspan><tspan x="335" dy="16.875">Vì sao (theo bài học)?</tspan></text><line x1="432" y1="85" x2="458" y2="85" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="460" y="20" width="190" height="130" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/><text x="555" y="52" text-anchor="middle" font-size="17" fill="#059669" font-weight="700"><tspan x="555" dy="0">3. Đề xuất</tspan></text><text x="555" y="90" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="555" dy="0">Nếu là em, em làm gì?</tspan><tspan x="555" dy="16.875">(cụ thể, an toàn)</tspan></text><line x1="652" y1="85" x2="678" y2="85" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="680" y="20" width="190" height="130" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="775" y="52" text-anchor="middle" font-size="17" fill="#7c3aed" font-weight="700"><tspan x="775" dy="0">4. Bài học</tspan></text><text x="775" y="90" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="775" dy="0">Em rút ra điều gì</tspan><tspan x="775" dy="16.875">cho bản thân?</tspan></text><text x="450" y="180" text-anchor="middle" font-size="14" fill="#e4572e" font-weight="700"><tspan x="450" dy="0">Gặp bạo lực, bắt nạt (kể cả trên mạng): KHÔNG im lặng – báo ngay thầy cô, bố mẹ</tspan></text>
</g>
</svg>
