<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 239" width="900" height="239" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="239" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Ôn thi 3 vòng trong 2 tuần</text>
<g transform="translate(0,44)">
<rect x="20" y="10" width="195" height="175" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="117" y="40" text-anchor="middle" font-size="15.5" fill="#2563eb" font-weight="700"><tspan x="117" dy="0">Vòng 1: Hệ thống</tspan></text><text x="117" y="62" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="117" dy="0">Ngày 1 – 4</tspan></text><text x="117" y="100" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="117" dy="0">Đề cương → sơ đồ tư duy</tspan><tspan x="117" dy="16.25">mỗi chương → làm lại</tspan><tspan x="117" dy="16.25">bài cơ bản (Nhóm A)</tspan></text><line x1="217" y1="97" x2="238" y2="97" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="240" y="10" width="195" height="175" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/><text x="337" y="40" text-anchor="middle" font-size="15.5" fill="#f59e0b" font-weight="700"><tspan x="337" dy="0">Vòng 2: Luyện đề</tspan></text><text x="337" y="62" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="337" dy="0">Ngày 5 – 10</tspan></text><text x="337" y="100" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="337" dy="0">2 đề bấm giờ / môn chính</tspan><tspan x="337" dy="16.25">chữa ngay → phiếu</tspan><tspan x="337" dy="16.25">phân tích lỗi</tspan></text><line x1="437" y1="97" x2="458" y2="97" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="460" y="10" width="195" height="175" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/><text x="557" y="40" text-anchor="middle" font-size="15.5" fill="#059669" font-weight="700"><tspan x="557" dy="0">Vòng 3: Sửa lỗi</tspan></text><text x="557" y="62" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="557" dy="0">Ngày 11 – 13</tspan></text><text x="557" y="100" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="557" dy="0">Chỉ làm lại câu sai</tspan><tspan x="557" dy="16.25">+ 5 câu "hay sai"</tspan><tspan x="557" dy="16.25">mỗi môn</tspan></text><line x1="657" y1="97" x2="678" y2="97" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="680" y="10" width="195" height="175" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="777" y="40" text-anchor="middle" font-size="15.5" fill="#7c3aed" font-weight="700"><tspan x="777" dy="0">Ngày thi</tspan></text><text x="777" y="62" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="777" dy="0">Tối hôm trước</tspan></text><text x="777" y="100" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="777" dy="0">Xem thẻ 30 – 60 phút</tspan><tspan x="777" dy="16.25">ngủ trước 21:30</tspan><tspan x="777" dy="16.25">chuẩn bị đồ dùng</tspan></text>
</g>
</svg>
