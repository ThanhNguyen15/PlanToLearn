<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="384" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Ba lần kháng chiến chống quân Mông – Nguyên (thế kỉ XIII)</text>
<g transform="translate(0,44)">
<rect x="15" y="10" width="280" height="230" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="155" y="40" text-anchor="middle" font-size="17" fill="#2563eb" font-weight="700"><tspan x="155" dy="0">Lần 1 – 1258</tspan></text><text x="155" y="64" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="155" dy="0">Giặc: Quân Mông Cổ</tspan></text><text x="31" y="100" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="31" dy="0">• Rút khỏi Thăng Long:</tspan><tspan x="31" dy="16.875">  "vườn không nhà trống"</tspan><tspan x="31" dy="16.875">• Phản công ở Đông Bộ Đầu</tspan></text><rect x="310" y="10" width="280" height="230" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/><text x="450" y="40" text-anchor="middle" font-size="17" fill="#f59e0b" font-weight="700"><tspan x="450" dy="0">Lần 2 – 1285</tspan></text><text x="450" y="64" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="450" dy="0">Giặc: Quân Nguyên</tspan></text><text x="326" y="100" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="326" dy="0">• Hội nghị Bình Than, Diên Hồng</tspan><tspan x="326" dy="16.875">• Hịch tướng sĩ (Trần Quốc Tuấn)</tspan><tspan x="326" dy="16.875">• Thắng ở Tây Kết, Hàm Tử,</tspan><tspan x="326" dy="16.875">  Chương Dương, Vạn Kiếp</tspan></text><rect x="605" y="10" width="280" height="230" rx="14" fill="#fde2da" stroke="#e4572e" stroke-width="2.5"/><text x="745" y="40" text-anchor="middle" font-size="17" fill="#e4572e" font-weight="700"><tspan x="745" dy="0">Lần 3 – 1287–1288</tspan></text><text x="745" y="64" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="745" dy="0">Giặc: Quân Nguyên</tspan></text><text x="621" y="100" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="621" dy="0">• Diệt đoàn thuyền lương</tspan><tspan x="621" dy="16.875">  ở Vân Đồn</tspan><tspan x="621" dy="16.875">• Trận Bạch Đằng 1288:</tspan><tspan x="621" dy="16.875">  cọc gỗ + thủy triều</tspan></text><rect x="15" y="255" width="870" height="75" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="450" y="288.8" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="450" dy="0">Nguyên nhân thắng lợi: đoàn kết toàn dân ("vua tôi đồng lòng, anh em hòa mục") · chiến lược "vườn không nhà trống", tránh chỗ mạnh,</tspan><tspan x="450" dy="16.875">đánh chỗ yếu · tài chỉ huy của Trần Quốc Tuấn (Hưng Đạo Vương), Trần Thủ Độ, Trần Quang Khải…</tspan></text>
</g>
</svg>
