<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 259" width="900" height="259" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="259" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Quy trình viết bài văn 4 bước</text>
<g transform="translate(0,44)">
<rect x="20" y="20" width="190" height="150" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="115" y="50" text-anchor="middle" font-size="16" fill="#2563eb" font-weight="700"><tspan x="115" dy="0">1. Tìm hiểu đề</tspan></text><text x="115" y="90" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="115" dy="0">Gạch chân kiểu bài,</tspan><tspan x="115" dy="17.5">đối tượng, yêu cầu</tspan></text><rect x="65" y="132" width="100" height="28" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="115" y="151" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="700"><tspan x="115" dy="0">3 phút</tspan></text><line x1="212" y1="95" x2="238" y2="95" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="240" y="20" width="190" height="150" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/><text x="335" y="50" text-anchor="middle" font-size="16" fill="#059669" font-weight="700"><tspan x="335" dy="0">2. Lập dàn ý</tspan></text><text x="335" y="90" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="335" dy="0">Ghi ý chính ra nháp:</tspan><tspan x="335" dy="17.5">mở – thân – kết</tspan></text><rect x="285" y="132" width="100" height="28" rx="14" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="335" y="151" text-anchor="middle" font-size="13" fill="#059669" font-weight="700"><tspan x="335" dy="0">7 phút</tspan></text><line x1="432" y1="95" x2="458" y2="95" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="460" y="20" width="190" height="150" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/><text x="555" y="50" text-anchor="middle" font-size="16" fill="#f59e0b" font-weight="700"><tspan x="555" dy="0">3. Viết bài</tspan></text><text x="555" y="90" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="555" dy="0">Mỗi ý một đoạn,</tspan><tspan x="555" dy="17.5">có dẫn chứng</tspan></text><rect x="505" y="132" width="100" height="28" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="555" y="151" text-anchor="middle" font-size="13" fill="#f59e0b" font-weight="700"><tspan x="555" dy="0">40 phút</tspan></text><line x1="652" y1="95" x2="678" y2="95" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="680" y="20" width="190" height="150" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="775" y="50" text-anchor="middle" font-size="16" fill="#7c3aed" font-weight="700"><tspan x="775" dy="0">4. Đọc lại, sửa</tspan></text><text x="775" y="90" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="775" dy="0">Chính tả, dấu câu,</tspan><tspan x="775" dy="17.5">lặp từ</tspan></text><rect x="725" y="132" width="100" height="28" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="775" y="151" text-anchor="middle" font-size="13" fill="#7c3aed" font-weight="700"><tspan x="775" dy="0">5 – 10 phút</tspan></text><text x="450" y="200" text-anchor="middle" font-size="14" fill="#6b7280"><tspan x="450" dy="0">Tổng: bài viết 60 phút · Đừng bỏ bước 2 – dàn ý giúp bài không lạc đề, không thiếu ý</tspan></text>
</g>
</svg>
