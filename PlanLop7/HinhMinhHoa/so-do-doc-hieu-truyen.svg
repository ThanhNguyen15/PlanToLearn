<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 514" width="900" height="514" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="514" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Sáu câu hỏi khi đọc hiểu một truyện</text>
<g transform="translate(0,44)">
<line x1="450" y1="235" x2="450" y2="70" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="235" x2="709.8" y2="152.5" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="235" x2="709.8" y2="317.5" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="235" x2="450" y2="400" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="235" x2="190.2" y2="317.5" stroke="#db2777" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="235" x2="190.2" y2="152.5" stroke="#059669" stroke-width="3" stroke-linecap="round"/><circle cx="450" cy="235" r="72" fill="#f1f5f9" stroke="#1f2937" stroke-width="3"/><text x="450" y="232" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">ĐỌC HIỂU</tspan><tspan x="450" dy="21.25">TRUYỆN</tspan></text><rect x="325" y="29" width="250" height="82" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/><text x="450" y="53" text-anchor="middle" font-size="15.5" fill="#2563eb" font-weight="700"><tspan x="450" dy="0">Đề tài</tspan></text><text x="450" y="75" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="450" dy="0">Truyện viết về điều gì?</tspan><tspan x="450" dy="15.625">(tuổi thơ, gia đình, thiên nhiên…)</tspan></text><rect x="584.8" y="111.5" width="250" height="82" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/><text x="709.8" y="135.5" text-anchor="middle" font-size="15.5" fill="#7c3aed" font-weight="700"><tspan x="709.8" dy="0">Ngôi kể</tspan></text><text x="709.8" y="157.5" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="709.8" dy="0">Ai kể? Xưng "tôi" (ngôi 1)</tspan><tspan x="709.8" dy="15.625">hay giấu mình (ngôi 3)? Tác dụng?</tspan></text><rect x="584.8" y="276.5" width="250" height="82" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.2"/><text x="709.8" y="300.5" text-anchor="middle" font-size="15.5" fill="#0d9488" font-weight="700"><tspan x="709.8" dy="0">Cốt truyện</tspan></text><text x="709.8" y="322.5" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="709.8" dy="0">Các sự việc chính</tspan><tspan x="709.8" dy="15.625">theo trình tự nào?</tspan></text><rect x="325" y="359" width="250" height="82" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.2"/><text x="450" y="383" text-anchor="middle" font-size="15.5" fill="#f59e0b" font-weight="700"><tspan x="450" dy="0">Nhân vật</tspan></text><text x="450" y="405" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="450" dy="0">Ngoại hình, hành động, lời nói,</tspan><tspan x="450" dy="15.625">suy nghĩ → tính cách</tspan></text><rect x="65.2" y="276.5" width="250" height="82" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2.2"/><text x="190.2" y="300.5" text-anchor="middle" font-size="15.5" fill="#db2777" font-weight="700"><tspan x="190.2" dy="0">Chi tiết tiêu biểu</tspan></text><text x="190.2" y="322.5" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="190.2" dy="0">Chi tiết nào đặc sắc?</tspan><tspan x="190.2" dy="15.625">Nói lên điều gì?</tspan></text><rect x="65.2" y="111.5" width="250" height="82" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="2.2"/><text x="190.2" y="135.5" text-anchor="middle" font-size="15.5" fill="#059669" font-weight="700"><tspan x="190.2" dy="0">Chủ đề – Thông điệp</tspan></text><text x="190.2" y="157.5" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="190.2" dy="0">Tác giả muốn gửi gắm gì?</tspan><tspan x="190.2" dy="15.625">Em rút ra bài học gì?</tspan></text>
</g>
</svg>
