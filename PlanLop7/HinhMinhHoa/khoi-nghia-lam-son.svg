<rect x="0" y="0" width="900" height="284" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Diễn biến khởi nghĩa Lam Sơn (1418 – 1427)</text>
<g transform="translate(0,44)">
<line x1="20" y1="60" x2="885" y2="60" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)" stroke-linecap="round"/><circle cx="85" cy="60" r="10" fill="#6b7280" stroke="#6b7280" stroke-width="2"/><text x="85" y="38" text-anchor="middle" font-size="15" fill="#6b7280" font-weight="700"><tspan x="85" dy="0">1418</tspan></text><rect x="20" y="85" width="135" height="115" rx="10" fill="#f1f5f9" stroke="#6b7280" stroke-width="2"/><text x="87" y="112" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="87" dy="0">Dựng cờ ở Lam Sơn</tspan><tspan x="87" dy="15">(Thanh Hóa)</tspan><tspan x="87" dy="15">Lê Lợi – Bình Định Vương</tspan></text><circle cx="230" cy="60" r="10" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/><text x="230" y="38" text-anchor="middle" font-size="15" fill="#f59e0b" font-weight="700"><tspan x="230" dy="0">1418–1423</tspan></text><rect x="165" y="85" width="135" height="115" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="232" y="112" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="232" dy="0">Hoạt động ở miền núi</tspan><tspan x="232" dy="15">Thanh Hóa, rất khó khăn</tspan><tspan x="232" dy="15">(Lê Lai cứu chúa)</tspan></text><circle cx="375" cy="60" r="10" fill="#0d9488" stroke="#0d9488" stroke-width="2"/><text x="375" y="38" text-anchor="middle" font-size="15" fill="#0d9488" font-weight="700"><tspan x="375" dy="0">1424–1425</tspan></text><rect x="310" y="85" width="135" height="115" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><text x="377" y="112" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="377" dy="0">Vào Nghệ An; giải phóng</tspan><tspan x="377" dy="15">Nghệ An, Tân Bình,</tspan><tspan x="377" dy="15">Thuận Hóa</tspan></text><circle cx="520" cy="60" r="10" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text x="520" y="38" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700"><tspan x="520" dy="0">1426</tspan></text><rect x="455" y="85" width="135" height="115" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="522" y="112" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="522" dy="0">Tiến ra Bắc</tspan><tspan x="522" dy="15">Trận Tốt Động –</tspan><tspan x="522" dy="15">Chúc Động</tspan></text><circle cx="665" cy="60" r="10" fill="#e4572e" stroke="#e4572e" stroke-width="2"/><text x="665" y="38" text-anchor="middle" font-size="15" fill="#e4572e" font-weight="700"><tspan x="665" dy="0">1427</tspan></text><rect x="600" y="85" width="135" height="115" rx="10" fill="#fde2da" stroke="#e4572e" stroke-width="2"/><text x="667" y="112" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="667" dy="0">Chi Lăng – Xương Giang</tspan><tspan x="667" dy="15">diệt viện binh Liễu Thăng</tspan><tspan x="667" dy="15">quân Minh rút về nước</tspan></text><circle cx="810" cy="60" r="10" fill="#059669" stroke="#059669" stroke-width="2"/><text x="810" y="38" text-anchor="middle" font-size="15" fill="#059669" font-weight="700"><tspan x="810" dy="0">1428</tspan></text><rect x="745" y="85" width="135" height="115" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="812" y="112" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="812" dy="0">Bình Ngô đại cáo</tspan><tspan x="812" dy="15">(Nguyễn Trãi)</tspan><tspan x="812" dy="15">Lập nhà Lê sơ</tspan></text><text x="450" y="228" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">Đường lối: "lấy yếu chống mạnh, lấy ít địch nhiều" · dựa vào dân · "mưu phạt tâm công" (đánh vào lòng người)</tspan></text>
</g>
