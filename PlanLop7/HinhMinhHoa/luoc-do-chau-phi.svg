<rect x="120" y="15" width="420" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="330" y="41" text-anchor="middle" font-size="13.5" fill="#059669" font-weight="700"><tspan x="330" dy="0">Cận nhiệt Địa Trung Hải</tspan></text><rect x="95" y="59" width="470" height="40" rx="8" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><text x="330" y="85" text-anchor="middle" font-size="13.5" fill="#92400e" font-weight="700"><tspan x="330" dy="0">Hoang mạc Xa-ha-ra (lớn nhất thế giới)</tspan></text><rect x="110" y="103" width="440" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="330" y="129" text-anchor="middle" font-size="13.5" fill="#f59e0b" font-weight="700"><tspan x="330" dy="0">Nhiệt đới: xa-van</tspan></text><rect x="140" y="147" width="380" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="330" y="173" text-anchor="middle" font-size="13.5" fill="#059669" font-weight="700"><tspan x="330" dy="0">Xích đạo ẩm: rừng rậm</tspan></text><rect x="170" y="191" width="320" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="330" y="217" text-anchor="middle" font-size="13.5" fill="#f59e0b" font-weight="700"><tspan x="330" dy="0">Nhiệt đới: xa-van</tspan></text><rect x="205" y="235" width="250" height="40" rx="8" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><text x="330" y="261" text-anchor="middle" font-size="13.5" fill="#92400e" font-weight="700"><tspan x="330" dy="0">Hoang mạc Ca-la-ha-ri, Na-mip</tspan></text><rect x="245" y="279" width="170" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="330" y="305" text-anchor="middle" font-size="13.5" fill="#059669" font-weight="700"><tspan x="330" dy="0">Cận nhiệt</tspan></text><line x1="60" y1="167" x2="140" y2="167" stroke="#e4572e" stroke-width="2" stroke-dasharray="8 5" stroke-linecap="round"/><line x1="520" y1="167" x2="545" y2="167" stroke="#e4572e" stroke-width="2" stroke-dasharray="8 5" stroke-linecap="round"/><text x="70" y="161" text-anchor="start" font-size="13" fill="#e4572e" font-weight="700"><tspan x="70" dy="0">Xích đạo</tspan></text><line x1="560" y1="40" x2="560" y2="230" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><text x="570" y="90" text-anchor="start" font-size="13" fill="#2563eb" font-weight="700"><tspan x="570" dy="0">sông Nin</tspan><tspan x="570" dy="16.25">(rất dài)</tspan></text><rect x="640" y="15" width="245" height="300" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="656" y="102.2" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="656" dy="0">Châu Phi:</tspan><tspan x="656" dy="16.875">• ~30 triệu km² (thứ 3)</tspan><tspan x="656" dy="16.875">• nóng và khô bậc nhất</tspan><tspan x="656" dy="16.875">• địa hình: khối sơn</tspan><tspan x="656" dy="16.875">  nguyên lớn</tspan><tspan x="656" dy="16.875">• các môi trường đối xứng</tspan><tspan x="656" dy="16.875">  qua Xích đạo</tspan><tspan x="656" dy="16.875">• dân số tăng nhanh</tspan><tspan x="656" dy="16.875">• kim tự tháp Ai Cập</tspan></text>
