<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 389" width="900" height="389" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="389" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Phản xạ âm và ứng dụng đo độ sâu</text>
<g transform="translate(0,44)">
<rect x="0" y="100" width="600" height="240" rx="0" fill="#dbeafe" stroke="#dbeafe" stroke-width="1.5"/><path d="M0,100 q25,-10 50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="210,70 390,70 370,100 230,100" fill="#475569" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/><rect x="270" y="45" width="60" height="25" rx="3" fill="#e2e8f0" stroke="#1f2937" stroke-width="1.5"/><path d="M0,330 l60,-15 l50,10 l70,-20 l60,15 l80,-10 l70,12 l60,-8 l60,10 l50,-6 l0,30 l-560,0 z" fill="#fde68a" stroke="#92400e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><line x1="285" y1="105" x2="285" y2="312" stroke="#e4572e" stroke-width="3" marker-end="url(#ah-red)" stroke-linecap="round"/><line x1="315" y1="312" x2="315" y2="105" stroke="#059669" stroke-width="3" marker-end="url(#ah-green)" stroke-linecap="round"/><text x="275" y="210" text-anchor="end" font-size="13" fill="#e4572e" font-weight="700"><tspan x="275" dy="0">âm phát đi</tspan></text><text x="325" y="210" text-anchor="start" font-size="13" fill="#059669" font-weight="700"><tspan x="325" dy="0">âm phản xạ</tspan></text><line x1="470" y1="100" x2="470" y2="318" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ah-ink)" marker-start="url(#ah-ink)" stroke-linecap="round"/><text x="480" y="215" text-anchor="start" font-size="18" fill="#1f2937" font-weight="700" font-style="italic"><tspan x="480" dy="0">h</tspan></text><rect x="620" y="30" width="265" height="300" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="636" y="106.2" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="636" dy="0">Đo độ sâu đáy biển</tspan><tspan x="636" dy="17.5">(máy sonar, siêu âm)</tspan><tspan x="636" dy="17.5"> </tspan><tspan x="636" dy="17.5">Âm đi xuống rồi dội lên:</tspan><tspan x="636" dy="17.5">quãng đường = 2h</tspan><tspan x="636" dy="17.5"> </tspan><tspan x="636" dy="17.5">h = v · t / 2</tspan><tspan x="636" dy="17.5"> </tspan><tspan x="636" dy="17.5">Ví dụ: v = 1500 m/s,</tspan><tspan x="636" dy="17.5">t = 1,2 s ⇒ h = 900 m</tspan></text>
</g>
</svg>
