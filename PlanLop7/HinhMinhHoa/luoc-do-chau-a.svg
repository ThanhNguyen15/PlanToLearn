<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 419" width="900" height="419" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="419" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Sơ đồ tự nhiên châu Á: núi ở trung tâm, khí hậu phân hóa từ biển vào</text>
<g transform="translate(0,44)">
<rect x="30" y="20" width="840" height="320" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="450" y="44" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="700"><tspan x="450" dy="0">Ven biển phía Đông, Đông Nam, Nam: khí hậu GIÓ MÙA (mưa nhiều mùa hạ)</tspan></text><rect x="110" y="60" width="680" height="250" rx="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="450" y="84" text-anchor="middle" font-size="14" fill="#f59e0b" font-weight="700"><tspan x="450" dy="0">Nội địa, Tây Nam Á: khí hậu LỤC ĐỊA (khô hạn) · dầu mỏ</tspan></text><polygon points="280,280 450,110 620,280" fill="#fde68a" stroke="#92400e" stroke-width="2.5" stroke-linejoin="round"/><text x="450" y="200" text-anchor="middle" font-size="14" fill="#92400e" font-weight="700"><tspan x="450" dy="0">NÚI &amp; SƠN NGUYÊN</tspan><tspan x="450" dy="17.5">CAO ĐỒ SỘ</tspan></text><text x="450" y="250" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="450" dy="0">Hi-ma-lay-a, Tây Tạng</tspan><tspan x="450" dy="15.625">Ê-vơ-rét ~8 849 m</tspan></text><line x1="390" y1="170" x2="220" y2="140" stroke="#0d9488" stroke-width="2" marker-end="url(#ah-teal)" stroke-linecap="round"/><line x1="510" y1="170" x2="690" y2="140" stroke="#0d9488" stroke-width="2" marker-end="url(#ah-teal)" stroke-linecap="round"/><text x="185" y="125" text-anchor="middle" font-size="12" fill="#0d9488" font-weight="700"><tspan x="185" dy="0">Ô-bi, I-ê-nít-xây</tspan><tspan x="185" dy="15">(chảy lên Bắc Á)</tspan></text><text x="730" y="125" text-anchor="middle" font-size="12" fill="#0d9488" font-weight="700"><tspan x="730" dy="0">Hoàng Hà,</tspan><tspan x="730" dy="15">Trường Giang</tspan></text><text x="190" y="240" text-anchor="middle" font-size="12" fill="#0d9488" font-weight="700"><tspan x="190" dy="0">Ấn, Hằng</tspan><tspan x="190" dy="15">(Nam Á)</tspan></text><text x="715" y="240" text-anchor="middle" font-size="12" fill="#0d9488" font-weight="700"><tspan x="715" dy="0">Mê Công</tspan><tspan x="715" dy="15">(Đông Nam Á –</tspan><tspan x="715" dy="15">có Việt Nam)</tspan></text><text x="450" y="365" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="450" dy="0">Sông lớn bắt nguồn từ vùng núi trung tâm, chảy ra mọi hướng · Châu Á rộng nhất (~44,4 triệu km²), đông dân nhất</tspan></text>
</g>
</svg>
