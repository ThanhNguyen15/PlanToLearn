<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 304" width="900" height="304" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="304" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Mở rộng thành phần chính của câu bằng cụm từ</text>
<g transform="translate(0,44)">
<text x="30" y="48" text-anchor="start" font-size="14" fill="#6b7280" font-weight="700"><tspan x="30" dy="0">Câu gốc</tspan></text><rect x="150" y="18" width="90" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="195" y="47" text-anchor="middle" font-size="18" fill="#1f2937" font-weight="700"><tspan x="195" dy="0">Hoa</tspan></text><rect x="250" y="18" width="90" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="295" y="47" text-anchor="middle" font-size="18" fill="#1f2937" font-weight="700"><tspan x="295" dy="0">nở.</tspan></text><text x="195" y="82" text-anchor="middle" font-size="13" fill="#2563eb"><tspan x="195" dy="0">Chủ ngữ</tspan></text><text x="295" y="82" text-anchor="middle" font-size="13" fill="#f59e0b"><tspan x="295" dy="0">Vị ngữ</tspan></text><line x1="300" y1="92" x2="300" y2="128" stroke="#059669" stroke-width="3" marker-end="url(#ah-green)" stroke-linecap="round"/><text x="320" y="115" text-anchor="start" font-size="14" fill="#059669" font-weight="700"><tspan x="320" dy="0">mở rộng bằng cụm từ</tspan></text><text x="30" y="178" text-anchor="start" font-size="14" fill="#6b7280" font-weight="700"><tspan x="30" dy="0">Câu mở rộng</tspan></text><rect x="150" y="148" width="330" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="315" y="177" text-anchor="middle" font-size="18" fill="#1f2937" font-weight="700"><tspan x="315" dy="0">Những bông hoa sen trong đầm</tspan></text><rect x="490" y="148" width="180" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="580" y="177" text-anchor="middle" font-size="18" fill="#1f2937" font-weight="700"><tspan x="580" dy="0">đang nở rộ.</tspan></text><text x="315" y="212" text-anchor="middle" font-size="13" fill="#2563eb"><tspan x="315" dy="0">Chủ ngữ</tspan></text><text x="580" y="212" text-anchor="middle" font-size="13" fill="#f59e0b"><tspan x="580" dy="0">Vị ngữ</tspan></text><text x="305" y="245" text-anchor="middle" font-size="13" fill="#2563eb" font-style="italic"><tspan x="305" dy="0">cụm danh từ</tspan></text><text x="585" y="245" text-anchor="middle" font-size="13" fill="#f59e0b" font-style="italic"><tspan x="585" dy="0">cụm động từ</tspan></text><rect x="700" y="20" width="185" height="200" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="716" y="98.7" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="716" dy="0">Mở rộng giúp câu:</tspan><tspan x="716" dy="17.5">• cụ thể hơn</tspan><tspan x="716" dy="17.5">• giàu hình ảnh hơn</tspan><tspan x="716" dy="17.5">• rõ ý hơn</tspan></text>
</g>
