<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" width="900" height="404" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="404" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Vòng học từ vựng 5 bước</text>
<g transform="translate(0,44)">
<circle cx="230" cy="185" r="122" fill="none" stroke="#e5e7eb" stroke-width="10"/><circle cx="230" cy="63" r="56" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="230" y="68" text-anchor="middle" font-size="11.5" fill="#2563eb" font-weight="700"><tspan x="230" dy="0">1. Nghe – đọc to</tspan></text><circle cx="346" cy="147.3" r="56" fill="#ffffff" stroke="#059669" stroke-width="3"/><text x="346" y="145.3" text-anchor="middle" font-size="11.5" fill="#059669" font-weight="700"><tspan x="346" dy="0">2. Viết từ, nghĩa,</tspan><tspan x="346" dy="14.375">từ loại</tspan></text><circle cx="301.7" cy="283.7" r="56" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/><text x="301.7" y="281.7" text-anchor="middle" font-size="11.5" fill="#f59e0b" font-weight="700"><tspan x="301.7" dy="0">3. Đặt 1 câu</tspan><tspan x="301.7" dy="14.375">về bản thân</tspan></text><circle cx="158.3" cy="283.7" r="56" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/><text x="158.3" y="288.7" text-anchor="middle" font-size="11.5" fill="#7c3aed" font-weight="700"><tspan x="158.3" dy="0">4. Làm thẻ ôn</tspan></text><circle cx="114" cy="147.3" r="56" fill="#ffffff" stroke="#e4572e" stroke-width="3"/><text x="114" y="145.3" text-anchor="middle" font-size="11.5" fill="#e4572e" font-weight="700"><tspan x="114" dy="0">5. Ôn lại</tspan><tspan x="114" dy="14.375">đúng lịch</tspan></text><text x="230" y="191" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="230" dy="0">1 – 2 phút</tspan><tspan x="230" dy="18.75">mỗi từ</tspan></text><text x="660" y="40" text-anchor="middle" font-size="16" fill="#1f2937" font-weight="700"><tspan x="660" dy="0">Lịch ôn lại (lặp lại ngắt quãng)</tspan></text><line x1="470" y1="140" x2="880" y2="140" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ah-ink)" stroke-linecap="round"/><circle cx="490" cy="140" r="8" fill="#2563eb"/><text x="490" y="120" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="490" dy="0">Ngày 0</tspan></text><text x="490" y="168" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="490" dy="0">Học mới</tspan></text><circle cx="580" cy="140" r="8" fill="#2563eb"/><text x="580" y="120" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="580" dy="0">+1 ngày</tspan></text><text x="580" y="168" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="580" dy="0">Ôn 1</tspan></text><circle cx="670" cy="140" r="8" fill="#2563eb"/><text x="670" y="120" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="670" dy="0">+3 ngày</tspan></text><text x="670" y="168" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="670" dy="0">Ôn 2</tspan></text><circle cx="760" cy="140" r="8" fill="#2563eb"/><text x="760" y="120" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="760" dy="0">+7 ngày</tspan></text><text x="760" y="168" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="760" dy="0">Ôn 3</tspan></text><circle cx="850" cy="140" r="8" fill="#059669"/><text x="850" y="120" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="850" dy="0">+14 ngày</tspan></text><text x="850" y="168" text-anchor="middle" font-size="13" fill="#059669"><tspan x="850" dy="0">Nhớ lâu</tspan></text><rect x="480" y="200" width="400" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="496" y="237.4" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="496" dy="0">Mỗi tối 15 phút: 5 phút ôn thẻ cũ</tspan><tspan x="496" dy="17.5">+ 10 phút học 5 – 8 từ mới.</tspan><tspan x="496" dy="17.5">Từ nào sai 2 lần → chép vào sổ lỗi sai.</tspan></text>
</g>
