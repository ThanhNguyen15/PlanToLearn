<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 514" width="900" height="514" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="514" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Bản đồ biện pháp tu từ (gọi tên → chỉ từ ngữ → nêu tác dụng)</text>
<g transform="translate(0,44)">
<line x1="450" y1="235" x2="160" y2="73.8" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="235" x2="160" y2="181.3" stroke="#059669" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="235" x2="160" y2="288.8" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="235" x2="160" y2="396.3" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="235" x2="740" y2="73.8" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="235" x2="740" y2="181.3" stroke="#92400e" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="235" x2="740" y2="288.8" stroke="#e4572e" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="235" x2="740" y2="396.3" stroke="#db2777" stroke-width="3" stroke-linecap="round"/><circle cx="450" cy="235" r="75" fill="#f1f5f9" stroke="#1f2937" stroke-width="3"/><text x="450" y="232" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">BIỆN PHÁP</tspan><tspan x="450" dy="21.25">TU TỪ</tspan></text><rect x="20" y="31.8" width="280" height="84" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.2"/><text x="160" y="55.8" text-anchor="middle" font-size="15.5" fill="#2563eb" font-weight="700"><tspan x="160" dy="0">So sánh</tspan></text><text x="160" y="77.8" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="160" dy="0">A như B · "Trẻ em như búp trên cành"</tspan><tspan x="160" dy="15.625">→ cụ thể, sinh động</tspan></text><rect x="20" y="139.3" width="280" height="84" rx="14" fill="#d1fae5" stroke="#059669" stroke-width="2.2"/><text x="160" y="163.3" text-anchor="middle" font-size="15.5" fill="#059669" font-weight="700"><tspan x="160" dy="0">Nhân hóa</tspan></text><text x="160" y="185.3" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="160" dy="0">Vật được tả như người</tspan><tspan x="160" dy="15.625">"Ông trời mặc áo giáp đen"</tspan></text><rect x="20" y="246.8" width="280" height="84" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.2"/><text x="160" y="270.8" text-anchor="middle" font-size="15.5" fill="#7c3aed" font-weight="700"><tspan x="160" dy="0">Ẩn dụ</tspan></text><text x="160" y="292.8" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="160" dy="0">Gọi A bằng tên B (giống nhau)</tspan><tspan x="160" dy="15.625">"Thuyền về có nhớ bến chăng"</tspan></text><rect x="20" y="354.3" width="280" height="84" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.2"/><text x="160" y="378.3" text-anchor="middle" font-size="15.5" fill="#0d9488" font-weight="700"><tspan x="160" dy="0">Hoán dụ</tspan></text><text x="160" y="400.3" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="160" dy="0">Gọi bằng tên gần gũi</tspan><tspan x="160" dy="15.625">"Áo chàm đưa buổi phân li"</tspan></text><rect x="600" y="31.8" width="280" height="84" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.2"/><text x="740" y="55.8" text-anchor="middle" font-size="15.5" fill="#f59e0b" font-weight="700"><tspan x="740" dy="0">Điệp ngữ</tspan></text><text x="740" y="77.8" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="740" dy="0">Lặp từ, cụm từ</tspan><tspan x="740" dy="15.625">→ nhấn mạnh, tạo nhịp</tspan></text><rect x="600" y="139.3" width="280" height="84" rx="14" fill="#fde68a" stroke="#92400e" stroke-width="2.2"/><text x="740" y="163.3" text-anchor="middle" font-size="15.5" fill="#92400e" font-weight="700"><tspan x="740" dy="0">Liệt kê</tspan></text><text x="740" y="185.3" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="740" dy="0">Kể nhiều sự vật liên tiếp</tspan><tspan x="740" dy="15.625">→ đầy đủ, phong phú</tspan></text><rect x="600" y="246.8" width="280" height="84" rx="14" fill="#fde2da" stroke="#e4572e" stroke-width="2.2"/><text x="740" y="270.8" text-anchor="middle" font-size="15.5" fill="#e4572e" font-weight="700"><tspan x="740" dy="0">Nói quá</tspan></text><text x="740" y="292.8" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="740" dy="0">Phóng đại mức độ</tspan><tspan x="740" dy="15.625">"Lỗ mũi mười tám gánh lông"</tspan></text><rect x="600" y="354.3" width="280" height="84" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="2.2"/><text x="740" y="378.3" text-anchor="middle" font-size="15.5" fill="#db2777" font-weight="700"><tspan x="740" dy="0">Nói giảm nói tránh</tspan></text><text x="740" y="400.3" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="740" dy="0">Cách nói tế nhị</tspan><tspan x="740" dy="15.625">"Bác đã đi rồi sao, Bác ơi!"</tspan></text>
</g>
</svg>
