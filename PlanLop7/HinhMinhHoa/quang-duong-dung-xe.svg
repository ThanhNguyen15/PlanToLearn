<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="384" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Tốc độ càng lớn, quãng đường dừng xe càng dài</text>
<g transform="translate(0,44)">
<text x="110" y="66" text-anchor="end" font-size="16" fill="#1f2937" font-weight="700"><tspan x="110" dy="0">30 km/h</tspan></text><rect x="130" y="40" width="88" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><rect x="218" y="40" width="55" height="40" rx="4" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="285" y="66" text-anchor="start" font-size="15" fill="#1f2937" font-weight="700"><tspan x="285" dy="0">≈ 13 m</tspan></text><text x="110" y="136" text-anchor="end" font-size="16" fill="#1f2937" font-weight="700"><tspan x="110" dy="0">50 km/h</tspan></text><rect x="130" y="110" width="154" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><rect x="284" y="110" width="154" height="40" rx="4" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="450" y="136" text-anchor="start" font-size="15" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">≈ 28 m</tspan></text><text x="110" y="206" text-anchor="end" font-size="16" fill="#1f2937" font-weight="700"><tspan x="110" dy="0">70 km/h</tspan></text><rect x="130" y="180" width="209" height="40" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><rect x="339" y="180" width="297" height="40" rx="4" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="648" y="206" text-anchor="start" font-size="15" fill="#1f2937" font-weight="700"><tspan x="648" dy="0">≈ 46 m</tspan></text><rect x="130" y="255" width="20" height="18" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="158" y="269" text-anchor="start" font-size="13" fill="#1f2937"><tspan x="158" dy="0">Quãng đường phản ứng (thấy nguy hiểm → đạp phanh, ~1 giây)</tspan></text><rect x="130" y="282" width="20" height="18" rx="3" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="158" y="296" text-anchor="start" font-size="13" fill="#1f2937"><tspan x="158" dy="0">Quãng đường phanh (đạp phanh → xe dừng hẳn)</tspan></text><text x="450" y="330" text-anchor="middle" font-size="13.5" fill="#e4572e" font-weight="700"><tspan x="450" dy="0">Số liệu minh họa (đường khô). Tốc độ tăng hơn gấp đôi → quãng đường dừng tăng hơn 3 lần!</tspan></text>
</g>
</svg>
