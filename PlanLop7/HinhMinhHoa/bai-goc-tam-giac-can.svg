<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Bài gốc: tam giác cân + kéo dài trung tuyến gấp đôi</text>
<g transform="translate(0,44)">
<polygon points="220,30 110,215 330,215" fill="#dbeafe" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/><line x1="220" y1="30" x2="220" y2="215" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/><line x1="220" y1="215" x2="220" y2="400" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="7 5" stroke-linecap="round"/><line x1="330" y1="215" x2="220" y2="400" stroke="#e4572e" stroke-width="2.5" stroke-linecap="round"/><line x1="220" y1="30" x2="110" y2="215" stroke="#e4572e" stroke-width="2.5" stroke-linecap="round"/><line x1="170.2" y1="125.6" x2="159.8" y2="119.4" stroke="#e4572e" stroke-width="2" stroke-linecap="round"/><line x1="280.2" y1="119.4" x2="269.8" y2="125.6" stroke="#e4572e" stroke-width="2" stroke-linecap="round"/><line x1="162.5" y1="209" x2="162.5" y2="221" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><line x1="167.5" y1="209" x2="167.5" y2="221" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><line x1="272.5" y1="209" x2="272.5" y2="221" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><line x1="277.5" y1="209" x2="277.5" y2="221" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><line x1="226" y1="117.5" x2="214" y2="117.5" stroke="#059669" stroke-width="2" stroke-linecap="round"/><line x1="226" y1="122.5" x2="214" y2="122.5" stroke="#059669" stroke-width="2" stroke-linecap="round"/><line x1="226" y1="127.5" x2="214" y2="127.5" stroke="#059669" stroke-width="2" stroke-linecap="round"/><line x1="226" y1="302.5" x2="214" y2="302.5" stroke="#059669" stroke-width="2" stroke-linecap="round"/><line x1="226" y1="307.5" x2="214" y2="307.5" stroke="#059669" stroke-width="2" stroke-linecap="round"/><line x1="226" y1="312.5" x2="214" y2="312.5" stroke="#059669" stroke-width="2" stroke-linecap="round"/><polyline points="220,202 207,202 207,215" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="220" y="20" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="220" dy="0">A</tspan></text><text x="98" y="221" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="98" dy="0">B</tspan></text><text x="342" y="221" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="342" dy="0">C</tspan></text><text x="234" y="235" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="234" dy="0">M</tspan></text><text x="220" y="420" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="220" dy="0">D</tspan></text><rect x="420" y="20" width="465" height="380" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="436" y="109.9" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="436" dy="0">GT: △ABC cân tại A; MB = MC; MD = MA</tspan><tspan x="436" dy="17.5"> </tspan><tspan x="436" dy="17.5">a) △ABM = △ACM (c.c.c)</tspan><tspan x="436" dy="17.5">   AB = AC, BM = CM, AM chung</tspan><tspan x="436" dy="17.5"> </tspan><tspan x="436" dy="17.5">b) ⇒ AMB = AMC, kề bù ⇒ = 90°</tspan><tspan x="436" dy="17.5">   ⇒ AM ⊥ BC; AM là phân giác góc A</tspan><tspan x="436" dy="17.5"> </tspan><tspan x="436" dy="17.5">c) △AMB = △DMC (c.g.c)</tspan><tspan x="436" dy="17.5">   MA = MD, AMB = DMC (đối đỉnh), MB = MC</tspan><tspan x="436" dy="17.5">   ⇒ BAM = CDM (so le trong) ⇒ AB // CD</tspan><tspan x="436" dy="17.5"> </tspan><tspan x="436" dy="17.5">Cùng màu vạch = đoạn bằng nhau</tspan></text>
</g>
