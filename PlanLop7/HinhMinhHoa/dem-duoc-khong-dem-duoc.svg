<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 369" width="900" height="369" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="369" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Danh từ đếm được và không đếm được (Unit 5)</text>
<g transform="translate(0,44)">
<rect x="8" y="0" width="434" height="290" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><rect x="458" y="0" width="434" height="290" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="225" y="28" text-anchor="middle" font-size="17" fill="#059669" font-weight="700"><tspan x="225" dy="0">Đếm được (countable)</tspan></text><text x="675" y="28" text-anchor="middle" font-size="17" fill="#2563eb" font-weight="700"><tspan x="675" dy="0">Không đếm được (uncountable)</tspan></text><circle cx="120" cy="95" r="32" fill="#e4572e" stroke="#e4572e" stroke-width="2"/><line x1="120" y1="63" x2="126" y2="50" stroke="#92400e" stroke-width="4" stroke-linecap="round"/><text x="120" y="150" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="120" dy="0">an apple</tspan></text><circle cx="215" cy="95" r="32" fill="#e4572e" stroke="#e4572e" stroke-width="2"/><line x1="215" y1="63" x2="221" y2="50" stroke="#92400e" stroke-width="4" stroke-linecap="round"/><text x="215" y="150" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="215" dy="0">two apples</tspan></text><circle cx="310" cy="95" r="32" fill="#e4572e" stroke="#e4572e" stroke-width="2"/><line x1="310" y1="63" x2="316" y2="50" stroke="#92400e" stroke-width="4" stroke-linecap="round"/><text x="310" y="150" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="310" dy="0">three apples</tspan></text><text x="225" y="195" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="700"><tspan x="225" dy="0">How MANY apples?</tspan></text><text x="225" y="225" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="225" dy="0">a / an · many · a few · số đếm</tspan></text><text x="225" y="255" text-anchor="middle" font-size="14" fill="#6b7280"><tspan x="225" dy="0">apple → apples (có số nhiều)</tspan></text><path d="M600,55 L610,145 Q612,150 620,150 L670,150 Q678,150 680,145 L690,55 Z" fill="none" stroke="#1f2937" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M604,85 L610,145 Q612,150 620,150 L670,150 Q678,150 680,145 L686,85 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><text x="645" y="172" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="645" dy="0">a glass of water</tspan></text><rect x="735" y="80" width="90" height="70" rx="30" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><text x="780" y="172" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="780" dy="0">a loaf of bread</tspan></text><text x="675" y="205" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="700"><tspan x="675" dy="0">How MUCH water?</tspan></text><text x="675" y="232" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="675" dy="0">much · a little · a glass/bottle/kilo of…</tspan></text><text x="675" y="258" text-anchor="middle" font-size="14" fill="#6b7280"><tspan x="675" dy="0">water, milk, rice, flour, bread, butter</tspan></text><text x="450" y="315" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">some: câu khẳng định, lời mời  ·  any: câu phủ định, câu hỏi</tspan></text>
</g>
</svg>
