<rect x="0" y="0" width="900" height="389" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Các tập hợp số đã học</text>
<g transform="translate(0,44)">
<rect x="20" y="10" width="860" height="300" rx="22" fill="#f1f5f9" stroke="#1f2937" stroke-width="2"/><text x="50" y="40" text-anchor="start" font-size="18" fill="#1f2937" font-weight="700"><tspan x="50" dy="0">ℝ  số thực</tspan></text><rect x="40" y="55" width="560" height="240" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="60" y="82" text-anchor="start" font-size="16" fill="#2563eb" font-weight="700"><tspan x="60" dy="0">ℚ  số hữu tỉ (a/b)</tspan></text><rect x="60" y="100" width="360" height="180" rx="18" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="80" y="126" text-anchor="start" font-size="16" fill="#059669" font-weight="700"><tspan x="80" dy="0">ℤ  số nguyên</tspan></text><rect x="80" y="145" width="170" height="120" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="100" y="170" text-anchor="start" font-size="15" fill="#f59e0b" font-weight="700"><tspan x="100" dy="0">ℕ  số tự nhiên</tspan></text><text x="165" y="215" text-anchor="middle" font-size="16" fill="#1f2937"><tspan x="165" dy="0">0; 1; 2; 15</tspan></text><text x="335" y="215" text-anchor="middle" font-size="16" fill="#1f2937"><tspan x="335" dy="0">−1; −7; −100</tspan></text><text x="510" y="170" text-anchor="middle" font-size="16" fill="#1f2937"><tspan x="510" dy="0">1/2; −3/4</tspan><tspan x="510" dy="20">0,25; 0,(3)</tspan></text><rect x="620" y="55" width="245" height="240" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/><text x="742" y="82" text-anchor="middle" font-size="16" fill="#7c3aed" font-weight="700"><tspan x="742" dy="0">𝕀  số vô tỉ</tspan></text><text x="742" y="140" text-anchor="middle" font-size="15" fill="#1f2937"><tspan x="742" dy="0">√2; √3; π</tspan><tspan x="742" dy="18.75">1,41421356…</tspan><tspan x="742" dy="18.75">(thập phân vô hạn</tspan><tspan x="742" dy="18.75">không tuần hoàn)</tspan></text><text x="450" y="335" text-anchor="middle" font-size="16" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ      ·      ℝ = ℚ ∪ 𝕀 (số hữu tỉ và số vô tỉ)</tspan></text>
</g>
</svg>
