<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 314" width="900" height="314" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="314" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Xác suất khi gieo một con xúc xắc cân đối</text>
<g transform="translate(0,44)">
<rect x="40" y="20" width="100" height="100" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2"/><circle cx="90" cy="70" r="8" fill="#e4572e"/><text x="90" y="145" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="90" dy="0">1 chấm</tspan></text><rect x="180" y="20" width="100" height="100" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="3"/><circle cx="204" cy="44" r="8" fill="#1f2937"/><circle cx="256" cy="96" r="8" fill="#1f2937"/><text x="230" y="145" text-anchor="middle" font-size="13" fill="#059669" font-weight="700"><tspan x="230" dy="0">2 chấm</tspan></text><rect x="320" y="20" width="100" height="100" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2"/><circle cx="344" cy="44" r="8" fill="#1f2937"/><circle cx="370" cy="70" r="8" fill="#1f2937"/><circle cx="396" cy="96" r="8" fill="#1f2937"/><text x="370" y="145" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="370" dy="0">3 chấm</tspan></text><rect x="460" y="20" width="100" height="100" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="3"/><circle cx="484" cy="44" r="8" fill="#1f2937"/><circle cx="536" cy="44" r="8" fill="#1f2937"/><circle cx="484" cy="96" r="8" fill="#1f2937"/><circle cx="536" cy="96" r="8" fill="#1f2937"/><text x="510" y="145" text-anchor="middle" font-size="13" fill="#059669" font-weight="700"><tspan x="510" dy="0">4 chấm</tspan></text><rect x="600" y="20" width="100" height="100" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2"/><circle cx="624" cy="44" r="8" fill="#1f2937"/><circle cx="676" cy="44" r="8" fill="#1f2937"/><circle cx="650" cy="70" r="8" fill="#1f2937"/><circle cx="624" cy="96" r="8" fill="#1f2937"/><circle cx="676" cy="96" r="8" fill="#1f2937"/><text x="650" y="145" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="650" dy="0">5 chấm</tspan></text><rect x="740" y="20" width="100" height="100" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="3"/><circle cx="764" cy="44" r="8" fill="#1f2937"/><circle cx="816" cy="44" r="8" fill="#1f2937"/><circle cx="764" cy="70" r="8" fill="#1f2937"/><circle cx="816" cy="70" r="8" fill="#1f2937"/><circle cx="764" cy="96" r="8" fill="#1f2937"/><circle cx="816" cy="96" r="8" fill="#1f2937"/><text x="790" y="145" text-anchor="middle" font-size="13" fill="#059669" font-weight="700"><tspan x="790" dy="0">6 chấm</tspan></text><text x="450" y="190" text-anchor="middle" font-size="16" fill="#059669" font-weight="700"><tspan x="450" dy="0">Biến cố A: "Gieo được số chấm chẵn" → kết quả thuận lợi: 2, 4, 6</tspan></text><text x="450" y="225" text-anchor="middle" font-size="18" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">P(A) = số kết quả thuận lợi / tổng số kết quả = 3/6 = 1/2</tspan></text><text x="450" y="258" text-anchor="middle" font-size="14" fill="#6b7280"><tspan x="450" dy="0">Biến cố chắc chắn: P = 1 ("số chấm ≤ 6")   ·   Biến cố không thể: P = 0 ("số chấm là 7")</tspan></text>
</g>
</svg>
