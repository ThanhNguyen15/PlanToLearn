<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 309" width="900" height="309" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="309" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Các thành phần của một đa thức một biến</text>
<g transform="translate(0,44)">
<text x="215" y="130" text-anchor="middle" font-size="40" fill="#1f2937" font-weight="700"><tspan x="215" dy="0">P(x) =</tspan></text><rect x="305" y="82" width="120" height="66" rx="10" fill="#fde2da" stroke="#e4572e" stroke-width="2.5"/><text x="365" y="130" text-anchor="middle" font-size="40" fill="#1f2937" font-weight="700"><tspan x="365" dy="0">−4x³</tspan></text><text x="450" y="130" text-anchor="middle" font-size="40" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">+</tspan></text><rect x="475" y="82" width="100" height="66" rx="10" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4"/><text x="525" y="130" text-anchor="middle" font-size="40" fill="#1f2937" font-weight="700"><tspan x="525" dy="0">2x²</tspan></text><text x="605" y="130" text-anchor="middle" font-size="40" fill="#1f2937" font-weight="700"><tspan x="605" dy="0">−</tspan></text><rect x="625" y="82" width="70" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="660" y="130" text-anchor="middle" font-size="40" fill="#1f2937" font-weight="700"><tspan x="660" dy="0">7</tspan></text><line x1="330" y1="82" x2="250" y2="42" stroke="#e4572e" stroke-width="2" marker-end="url(#ah-red)" stroke-linecap="round"/><text x="170" y="36" text-anchor="middle" font-size="15" fill="#e4572e" font-weight="700"><tspan x="170" dy="0">Hệ số cao nhất: −4</tspan></text><line x1="400" y1="82" x2="450" y2="40" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah-orange)" stroke-linecap="round"/><text x="560" y="34" text-anchor="middle" font-size="15" fill="#f59e0b" font-weight="700"><tspan x="560" dy="0">Bậc của đa thức: 3 (số mũ lớn nhất)</tspan></text><line x1="525" y1="148" x2="500" y2="190" stroke="#059669" stroke-width="2" marker-end="url(#ah-green)" stroke-linecap="round"/><text x="470" y="210" text-anchor="middle" font-size="15" fill="#059669" font-weight="700"><tspan x="470" dy="0">Một hạng tử (đơn thức)</tspan></text><line x1="660" y1="148" x2="720" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)" stroke-linecap="round"/><text x="760" y="210" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700"><tspan x="760" dy="0">Hệ số tự do: −7</tspan></text><text x="450" y="252" text-anchor="middle" font-size="14" fill="#6b7280"><tspan x="450" dy="0">Sắp xếp theo lũy thừa giảm dần của x: x³ → x² → (không có x) → hệ số tự do</tspan></text>
</g>
</svg>
