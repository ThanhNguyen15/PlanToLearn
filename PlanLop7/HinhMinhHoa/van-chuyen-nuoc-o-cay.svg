<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Vận chuyển nước và chất dinh dưỡng ở cây</text>
<g transform="translate(0,44)">
<rect x="0" y="300" width="560" height="90" rx="0" fill="#fde68a" stroke="#fde68a" stroke-width="1.5"/><rect x="265" y="80" width="30" height="225" rx="4" fill="#a16207" stroke="#92400e" stroke-width="1.5"/><path d="M280,300 C260,330 220,345 190,370 M280,300 C300,335 340,350 370,372 M280,300 L282,380" fill="none" stroke="#92400e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M280,130 C240,80 160,90 180,110 C150,140 250,140 280,130 Z" fill="#d1fae5" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M280,140 C320,90 400,100 380,120 C410,150 310,150 280,140 Z" fill="#d1fae5" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M280,210 C240,160 150,170 170,190 C140,220 250,220 280,210 Z" fill="#d1fae5" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M280,220 C320,170 410,180 390,200 C420,230 310,230 280,220 Z" fill="#d1fae5" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="274" y1="290" x2="274" y2="260" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-blue)" stroke-linecap="round"/><line x1="274" y1="245" x2="274" y2="215" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-blue)" stroke-linecap="round"/><line x1="274" y1="200" x2="274" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-blue)" stroke-linecap="round"/><line x1="274" y1="155" x2="274" y2="125" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-blue)" stroke-linecap="round"/><line x1="274" y1="110" x2="274" y2="80" stroke="#2563eb" stroke-width="3" marker-end="url(#ah-blue)" stroke-linecap="round"/><line x1="287" y1="100" x2="287" y2="130" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah-purple)" stroke-linecap="round"/><line x1="287" y1="145" x2="287" y2="175" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah-purple)" stroke-linecap="round"/><line x1="287" y1="190" x2="287" y2="220" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah-purple)" stroke-linecap="round"/><line x1="287" y1="235" x2="287" y2="265" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah-purple)" stroke-linecap="round"/><line x1="287" y1="280" x2="287" y2="310" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah-purple)" stroke-linecap="round"/><path d="M150,70 q-8,-12 0,-24 q8,-12 0,-24" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M420,80 q-8,-12 0,-24 q8,-12 0,-24" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M130,150 q-8,-12 0,-24 q8,-12 0,-24" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="3 4" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="40" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="700"><tspan x="420" dy="0">Thoát hơi nước (khí khổng)</tspan></text><text x="180" y="395" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700"><tspan x="180" dy="0">Lông hút ở rễ hút nước, muối khoáng</tspan></text><rect x="590" y="20" width="295" height="330" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="606" y="93.7" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="606" dy="0">Mạch gỗ (mũi tên xanh dương):</tspan><tspan x="606" dy="17.5">nước + muối khoáng</tspan><tspan x="606" dy="17.5">rễ → thân → lá (đi LÊN)</tspan><tspan x="606" dy="17.5"> </tspan><tspan x="606" dy="17.5">Mạch rây (mũi tên tím):</tspan><tspan x="606" dy="17.5">chất hữu cơ từ lá</tspan><tspan x="606" dy="17.5">→ các bộ phận (đi XUỐNG)</tspan><tspan x="606" dy="17.5"> </tspan><tspan x="606" dy="17.5">Thoát hơi nước:</tspan><tspan x="606" dy="17.5">• tạo lực kéo nước lên</tspan><tspan x="606" dy="17.5">• làm mát lá</tspan><tspan x="606" dy="17.5">• khí khổng mở → lấy CO₂</tspan></text>
</g>
