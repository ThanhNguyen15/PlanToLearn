<rect x="0" y="0" width="900" height="344" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Bất đẳng thức tam giác</text>
<g transform="translate(0,44)">
<rect x="8" y="0" width="434" height="270" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><rect x="458" y="0" width="434" height="270" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="225" y="26" text-anchor="middle" font-size="15" fill="#e4572e" font-weight="700"><tspan x="225" dy="0">Độ dài 3; 4; 8 → KHÔNG thành tam giác</tspan></text><line x1="125" y1="210" x2="325" y2="210" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><text x="225" y="235" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="225" dy="0">8</tspan></text><path d="M200,210 A75,75 0 0 0 110,136.5" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M225,210 A100,100 0 0 1 345,112" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/><line x1="125" y1="210" x2="170" y2="150" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/><line x1="325" y1="210" x2="265" y2="130" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/><text x="150" y="150" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="700"><tspan x="150" dy="0">3</tspan></text><text x="300" y="130" text-anchor="middle" font-size="14" fill="#f59e0b" font-weight="700"><tspan x="300" dy="0">4</tspan></text><text x="225" y="70" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="225" dy="0">3 + 4 = 7 &lt; 8: hai cạnh không "chạm" nhau</tspan></text><text x="675" y="26" text-anchor="middle" font-size="15" fill="#059669" font-weight="700"><tspan x="675" dy="0">Độ dài 5; 6; 10 → thành tam giác</tspan></text><polygon points="550,210 800,210 661.3,153" fill="#ffffff" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/><text x="675" y="235" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="675" dy="0">10</tspan></text><text x="593.6" y="181.5" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="700"><tspan x="593.6" dy="0">5</tspan></text><text x="742.6" y="181.5" text-anchor="middle" font-size="14" fill="#f59e0b" font-weight="700"><tspan x="742.6" dy="0">6</tspan></text><text x="675" y="70" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="675" dy="0">5 + 6 = 11 &gt; 10 ✓</tspan></text><text x="450" y="290" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">Kiểm tra nhanh: tổng hai cạnh nhỏ &gt; cạnh lớn nhất  ⇔  ba đoạn tạo thành tam giác</tspan></text>
</g>
