<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<title>Sơ đồ tư duy: con người và AI</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="480" y="32" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Sơ đồ tư duy: Con người trong thời đại AI</text><line x1="480" y1="280" x2="150" y2="110" stroke="#2563eb" stroke-width="3"/><line x1="480" y1="280" x2="480" y2="95" stroke="#059669" stroke-width="3"/><line x1="480" y1="280" x2="810" y2="110" stroke="#e4572e" stroke-width="3"/><line x1="480" y1="280" x2="150" y2="450" stroke="#7c3aed" stroke-width="3"/><line x1="480" y1="280" x2="480" y2="470" stroke="#f59e0b" stroke-width="3"/><line x1="480" y1="280" x2="810" y2="450" stroke="#0891b2" stroke-width="3"/><ellipse cx="480" cy="280" rx="130" ry="50" fill="#111827"/><text x="480" y="276" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">CON NGƯỜI &amp; AI</text><text x="480" y="300" font-size="13" fill="#cbd5e1" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">vấn đề nghị luận</text><rect x="15" y="60" width="270" height="100" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><rect x="15" y="60" width="270" height="28" rx="14" fill="#2563eb"/><rect x="15" y="74" width="270" height="14" fill="#2563eb"/><text x="150" y="80" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">1. Giải thích</text><text x="150" y="108" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">AI: máy học từ dữ liệu</text><text x="150" y="128" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Là công cụ, không phải</text><text x="150" y="148" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">chủ thể có cảm xúc</text><rect x="345" y="45" width="270" height="100" rx="14" fill="#fff" stroke="#059669" stroke-width="2.5"/><rect x="345" y="45" width="270" height="28" rx="14" fill="#059669"/><rect x="345" y="59" width="270" height="14" fill="#059669"/><text x="480" y="65" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">2. AI giúp gì?</text><text x="480" y="93" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Học nhanh, tra cứu</text><text x="480" y="113" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Y tế, giao thông, dịch thuật</text><text x="480" y="133" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Giải phóng việc lặp lại</text><rect x="675" y="60" width="270" height="100" rx="14" fill="#fff" stroke="#e4572e" stroke-width="2.5"/><rect x="675" y="60" width="270" height="28" rx="14" fill="#e4572e"/><rect x="675" y="74" width="270" height="14" fill="#e4572e"/><text x="810" y="80" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">3. Mặt trái</text><text x="810" y="108" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Lười nghĩ, chép bài</text><text x="810" y="128" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Deepfake, tin giả</text><text x="810" y="148" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Ít kết nối người thật</text><rect x="15" y="400" width="270" height="100" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/><rect x="15" y="400" width="270" height="28" rx="14" fill="#7c3aed"/><rect x="15" y="414" width="270" height="14" fill="#7c3aed"/><text x="150" y="420" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">4. AI không thay được</text><text x="150" y="448" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Thấu cảm, yêu thương</text><text x="150" y="468" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Trách nhiệm đạo đức</text><text x="150" y="488" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Trải nghiệm sống thật</text><rect x="345" y="420" width="270" height="100" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/><rect x="345" y="420" width="270" height="28" rx="14" fill="#f59e0b"/><rect x="345" y="434" width="270" height="14" fill="#f59e0b"/><text x="480" y="440" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">5. Phản biện</text><text x="480" y="468" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">“AI sẽ thay con người”?</text><text x="480" y="488" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">→ thay VIỆC, không thay</text><text x="480" y="508" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">phẩm chất NGƯỜI</text><rect x="675" y="400" width="270" height="100" rx="14" fill="#fff" stroke="#0891b2" stroke-width="2.5"/><rect x="675" y="400" width="270" height="28" rx="14" fill="#0891b2"/><rect x="675" y="414" width="270" height="14" fill="#0891b2"/><text x="810" y="420" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">6. Hành động</text><text x="810" y="448" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Dùng AI để hỏi, không để chép</text><text x="810" y="468" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Kiểm chứng thông tin</text><text x="810" y="488" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Nuôi dưỡng cảm xúc thật</text>
</svg>
