<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="505" viewBox="0 0 1020 505">
<title>Bản đồ phương pháp chứng minh hình học</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="510" y="32" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Bản đồ “muốn chứng minh X → đi qua Y”</text><line x1="270" y1="91" x2="790" y2="91" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 4"/><rect x="20" y="60" width="250" height="62" rx="12" fill="#2563eb"/><text x="145" y="97" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Tứ giác nội tiếp</text><rect x="300" y="68" width="220" height="46" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="410" y="96" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2 góc đối bù</text><rect x="535" y="68" width="220" height="46" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="645" y="96" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Góc ngoài = góc trong đối</text><rect x="770" y="68" width="220" height="46" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="880" y="96" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2 đỉnh kề nhìn 1 cạnh góc bằng nhau</text><line x1="270" y1="173" x2="790" y2="173" stroke="#e4572e" stroke-width="2" stroke-dasharray="4 4"/><rect x="20" y="142" width="250" height="62" rx="12" fill="#e4572e"/><text x="145" y="179" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Đẳng thức tích AB·CD = EF·GH</text><rect x="300" y="150" width="220" height="46" rx="10" fill="#fff" stroke="#e4572e" stroke-width="2"/><text x="410" y="178" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Đổi thành tỉ lệ AB/EF = GH/CD</text><rect x="535" y="150" width="220" height="46" rx="10" fill="#fff" stroke="#e4572e" stroke-width="2"/><text x="645" y="178" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Tìm 2 tam giác đồng dạng</text><rect x="770" y="150" width="220" height="46" rx="10" fill="#fff" stroke="#e4572e" stroke-width="2"/><text x="880" y="178" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Hệ thức lượng · MA² = MC·MD</text><line x1="270" y1="255" x2="790" y2="255" stroke="#059669" stroke-width="2" stroke-dasharray="4 4"/><rect x="20" y="224" width="250" height="62" rx="12" fill="#059669"/><text x="145" y="261" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Hai góc bằng nhau</text><rect x="300" y="232" width="220" height="46" rx="10" fill="#fff" stroke="#059669" stroke-width="2"/><text x="410" y="260" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Cùng chắn 1 cung</text><rect x="535" y="232" width="220" height="46" rx="10" fill="#fff" stroke="#059669" stroke-width="2"/><text x="645" y="260" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Tam giác đồng dạng</text><rect x="770" y="232" width="220" height="46" rx="10" fill="#fff" stroke="#059669" stroke-width="2"/><text x="880" y="260" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Cùng phụ / cùng bù 1 góc</text><line x1="270" y1="337" x2="790" y2="337" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/><rect x="20" y="306" width="250" height="62" rx="12" fill="#f59e0b"/><text x="145" y="343" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Song song</text><rect x="300" y="314" width="220" height="46" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="410" y="342" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Đồng vị / so le trong bằng nhau</text><rect x="535" y="314" width="220" height="46" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="645" y="342" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Cùng ⊥ một đường</text><rect x="770" y="314" width="220" height="46" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="880" y="342" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Đường trung bình</text><line x1="270" y1="419" x2="790" y2="419" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 4"/><rect x="20" y="388" width="250" height="62" rx="12" fill="#7c3aed"/><text x="145" y="425" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Vuông góc</text><rect x="300" y="396" width="220" height="46" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="410" y="424" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Góc nội tiếp chắn nửa đường tròn</text><rect x="535" y="396" width="220" height="46" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="645" y="424" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Tiếp tuyến ⊥ bán kính</text><rect x="770" y="396" width="220" height="46" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="880" y="424" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Đường cao thứ 3 (trực tâm)</text><text x="510" y="485" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Mẹo: đọc ngược từ KẾT LUẬN → hỏi “cần gì để có điều này?” → nối với GIẢ THIẾT hoặc câu trước.</text>
</svg>
