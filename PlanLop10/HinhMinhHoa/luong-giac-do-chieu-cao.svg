<svg xmlns="http://www.w3.org/2000/svg" width="660" height="450" viewBox="0 0 660 450">
<title>Đo chiều cao bằng lượng giác</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="330" y="32" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Đo chiều cao bằng tỉ số lượng giác</text><line x1="30" y1="330" x2="630" y2="330" stroke="#6b7280" stroke-width="2"/><rect x="470" y="70" width="90" height="260" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="2"/><rect x="482" y="88" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="508" y="88" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="534" y="88" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="482" y="126" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="508" y="126" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="534" y="126" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="482" y="164" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="508" y="164" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="534" y="164" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="482" y="202" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="508" y="202" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="534" y="202" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="482" y="240" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="508" y="240" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="534" y="240" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="482" y="278" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="508" y="278" width="14" height="20" fill="rgba(37,99,235,0.35)"/><rect x="534" y="278" width="14" height="20" fill="rgba(37,99,235,0.35)"/><circle cx="112" cy="258" r="10" fill="none" stroke="#1f2937" stroke-width="2"/><line x1="112" y1="268" x2="112" y2="305" stroke="#1f2937" stroke-width="2"/><line x1="112" y1="305" x2="100" y2="330" stroke="#1f2937" stroke-width="2"/><line x1="112" y1="305" x2="124" y2="330" stroke="#1f2937" stroke-width="2"/><line x1="112" y1="280" x2="128" y2="270" stroke="#1f2937" stroke-width="2"/><line x1="120" y1="270" x2="470" y2="70" stroke="#e4572e" stroke-width="2.5"/><line x1="120" y1="270" x2="470" y2="270" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/><polyline points="458,270 458,258 470,258" fill="none" stroke="#1f2937" stroke-width="1.5"/><path d="M 120,270 L 170,270 A 50 50 0 0 0 163.4,245.2 Z" fill="rgba(228,87,46,0.25)" stroke="#e4572e" stroke-width="1.5"/><text x="182" y="262" font-size="18" fill="#e4572e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">α</text><text x="295" y="292" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">d (khoảng cách đến tòa nhà)</text><line x1="455" y1="270" x2="455" y2="70" stroke="#059669" stroke-width="3"/><text x="442" y="170" font-size="18" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">x</text><line x1="150" y1="270" x2="150" y2="330" stroke="#7c3aed" stroke-width="2"/><text x="166" y="306" font-size="16" fill="#7c3aed" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">h₀</text><text x="330" y="375" font-size="17" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">tan α = x / d  ⇒  x = d · tan α</text><text x="330" y="402" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Chiều cao tòa nhà = d · tan α + h₀ (chiều cao tầm mắt)</text><text x="330" y="432" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Nhớ: SIN = Đối/Huyền · COS = Kề/Huyền · TAN = Đối/Kề  (“Sin đi học, Cos không hư, Tan đoàn kết”)</text>
</svg>
