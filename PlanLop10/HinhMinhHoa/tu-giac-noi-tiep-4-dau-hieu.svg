<svg xmlns="http://www.w3.org/2000/svg" width="1275" height="360" viewBox="0 0 1275 360">
<title>Bốn dấu hiệu tứ giác nội tiếp</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="15" y="15" width="300" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="15" y="15" width="300" height="34" rx="14" fill="#2563eb"/><rect x="15" y="35" width="300" height="14" fill="#2563eb"/><text x="165" y="38" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Dấu hiệu 1: Hai góc đối bù nhau</text><circle cx="165" cy="175" r="95" stroke="#334155" stroke-width="2" fill="none"/><polygon points="92.2,113.9 242.8,120.5 212.5,257.3 87.2,229.5" fill="rgba(37,99,235,0.06)" stroke="#1f2937" stroke-width="2"/><path d="M 92.2,113.9 L 91,141.9 A 28 28 0 0 0 120.2,115.2 Z" fill="rgba(37,99,235,0.22)" stroke="#2563eb" stroke-width="1.5"/><path d="M 212.5,257.3 L 218.6,229.9 A 28 28 0 0 0 185.2,251.2 Z" fill="rgba(228,87,46,0.25)" stroke="#e4572e" stroke-width="1.5"/><circle cx="92.2" cy="113.9" r="3.5" fill="#1f2937"/><circle cx="242.8" cy="120.5" r="3.5" fill="#1f2937"/><circle cx="212.5" cy="257.3" r="3.5" fill="#1f2937"/><circle cx="87.2" cy="229.5" r="3.5" fill="#1f2937"/><text x="80" y="109.7" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">A</text><text x="255.9" y="117.3" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">B</text><text x="220.5" y="277.1" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">C</text><text x="74.1" y="244.7" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">D</text><text x="165" y="310" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">∠A + ∠C = 180°</text><text x="165" y="333" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Dấu hiệu dùng nhiều nhất</text><rect x="330" y="15" width="300" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="330" y="15" width="300" height="34" rx="14" fill="#e4572e"/><rect x="330" y="35" width="300" height="14" fill="#e4572e"/><text x="480" y="38" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Dấu hiệu 2: Góc ngoài = góc trong đối</text><circle cx="480" cy="175" r="95" stroke="#334155" stroke-width="2" fill="none"/><polygon points="407.2,113.9 557.8,120.5 527.5,257.3 402.2,229.5" fill="rgba(37,99,235,0.06)" stroke="#1f2937" stroke-width="2"/><line x1="557.8" y1="120.5" x2="595.5" y2="122.2" stroke="#e4572e" stroke-width="2" stroke-dasharray="6 4"/><path d="M 557.8,120.5 L 552.2,145.9 A 26 26 0 0 0 583.8,121.6 Z" fill="rgba(228,87,46,0.25)" stroke="#e4572e" stroke-width="1.5"/><path d="M 402.2,229.5 L 429.5,235.6 A 28 28 0 0 0 403.4,201.5 Z" fill="rgba(228,87,46,0.25)" stroke="#e4572e" stroke-width="1.5"/><text x="599.5" y="116.2" font-size="16" fill="#e4572e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">x</text><circle cx="407.2" cy="113.9" r="3.5" fill="#1f2937"/><circle cx="557.8" cy="120.5" r="3.5" fill="#1f2937"/><circle cx="527.5" cy="257.3" r="3.5" fill="#1f2937"/><circle cx="402.2" cy="229.5" r="3.5" fill="#1f2937"/><text x="395" y="109.7" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">A</text><text x="570.9" y="117.3" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">B</text><text x="535.5" y="277.1" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">C</text><text x="389.1" y="244.7" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">D</text><text x="480" y="310" font-size="15" fill="#e4572e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">∠CBx = ∠ADC</text><text x="480" y="333" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">x nằm trên tia đối của tia BA</text><rect x="645" y="15" width="300" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="645" y="15" width="300" height="34" rx="14" fill="#059669"/><rect x="645" y="35" width="300" height="14" fill="#059669"/><text x="795" y="38" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Dấu hiệu 3: Hai đỉnh nhìn 1 cạnh</text><circle cx="795" cy="175" r="95" stroke="#059669" stroke-width="2" fill="none" stroke-dasharray="7 5"/><line x1="700" y1="175" x2="890" y2="175" stroke="#1f2937" stroke-width="2"/><line x1="700" y1="175" x2="856.1" y2="102.2" stroke="#1f2937" stroke-width="2"/><line x1="890" y1="175" x2="856.1" y2="102.2" stroke="#1f2937" stroke-width="2"/><line x1="700" y1="175" x2="740.5" y2="97.2" stroke="#1f2937" stroke-width="2"/><line x1="890" y1="175" x2="740.5" y2="97.2" stroke="#1f2937" stroke-width="2"/><polyline points="845.2,107.3 850.3,118.2 861.1,113.1" fill="none" stroke="#e4572e" stroke-width="1.5"/><polyline points="735,107.8 745.6,113.4 751.2,102.7" fill="none" stroke="#e4572e" stroke-width="1.5"/><circle cx="795" cy="175" r="3.5" fill="#6b7280"/><circle cx="700" cy="175" r="3.5" fill="#1f2937"/><circle cx="890" cy="175" r="3.5" fill="#1f2937"/><circle cx="856.1" cy="102.2" r="3.5" fill="#1f2937"/><circle cx="740.5" cy="97.2" r="3.5" fill="#1f2937"/><text x="684" y="181" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">B</text><text x="906" y="181" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">C</text><text x="866.3" y="96" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">E</text><text x="731.3" y="90.1" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">F</text><text x="795" y="310" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">∠BEC = ∠BFC = 90°</text><text x="795" y="333" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">⇒ B, C, E, F ∈ đường tròn đường kính BC</text><rect x="960" y="15" width="300" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="960" y="15" width="300" height="34" rx="14" fill="#7c3aed"/><rect x="960" y="35" width="300" height="14" fill="#7c3aed"/><text x="1110" y="38" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Dấu hiệu 4: Bốn đỉnh cách đều 1 điểm</text><circle cx="1110" cy="175" r="95" stroke="#334155" stroke-width="2" fill="none"/><polygon points="1037.2,113.9 1187.8,120.5 1157.5,257.3 1032.2,229.5" fill="rgba(37,99,235,0.06)" stroke="#1f2937" stroke-width="2"/><line x1="1110" y1="175" x2="1037.2" y2="113.9" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/><line x1="1069.8" y1="149.1" x2="1077.5" y2="139.9" stroke="#7c3aed" stroke-width="2"/><line x1="1110" y1="175" x2="1187.8" y2="120.5" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/><line x1="1145.5" y1="142.8" x2="1152.4" y2="152.7" stroke="#7c3aed" stroke-width="2"/><line x1="1110" y1="175" x2="1157.5" y2="257.3" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/><line x1="1138.9" y1="213.1" x2="1128.6" y2="219.1" stroke="#7c3aed" stroke-width="2"/><line x1="1110" y1="175" x2="1032.2" y2="229.5" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/><line x1="1074.5" y1="207.2" x2="1067.6" y2="197.3" stroke="#7c3aed" stroke-width="2"/><circle cx="1110" cy="175" r="3.5" fill="#1f2937"/><text x="1118.5" y="189.5" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">O</text><circle cx="1037.2" cy="113.9" r="3.5" fill="#1f2937"/><circle cx="1187.8" cy="120.5" r="3.5" fill="#1f2937"/><circle cx="1157.5" cy="257.3" r="3.5" fill="#1f2937"/><circle cx="1032.2" cy="229.5" r="3.5" fill="#1f2937"/><text x="1025" y="109.7" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">A</text><text x="1200.9" y="117.3" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">B</text><text x="1165.5" y="277.1" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">C</text><text x="1019.1" y="244.7" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">D</text><text x="1110" y="310" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">OA = OB = OC = OD</text><text x="1110" y="333" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">O chính là tâm đường tròn</text>
</svg>
