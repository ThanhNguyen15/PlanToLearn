<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500" viewBox="0 0 660 500">
<title>Bài gốc 1: hai tiếp tuyến và cát tuyến</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="330" y="32" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Bài gốc 1: Hai tiếp tuyến MA, MB và cát tuyến MCD</text><polygon points="560,230 246.9,108.8 200,230 246.9,351.2" fill="rgba(37,99,235,0.22)" stroke="none"/><polygon points="328.2,251.4 246.9,230 200,230 77.8,274.5" fill="rgba(245,158,11,0.30)" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/><circle cx="200" cy="230" r="130" stroke="#334155" stroke-width="2" fill="none"/><line x1="560" y1="230" x2="246.9" y2="108.8" stroke="#2563eb" stroke-width="2.5"/><line x1="560" y1="230" x2="246.9" y2="351.2" stroke="#2563eb" stroke-width="2.5"/><line x1="560" y1="230" x2="200" y2="230" stroke="#1f2937" stroke-width="2"/><line x1="246.9" y1="108.8" x2="246.9" y2="351.2" stroke="#059669" stroke-width="2.5"/><line x1="560" y1="230" x2="77.8" y2="274.5" stroke="#e4572e" stroke-width="2.5"/><line x1="200" y1="230" x2="246.9" y2="108.8" stroke="#6b7280" stroke-width="1.5"/><line x1="200" y1="230" x2="246.9" y2="351.2" stroke="#6b7280" stroke-width="1.5"/><line x1="246.9" y1="230" x2="328.2" y2="251.4" stroke="#f59e0b" stroke-width="1.5"/><line x1="200" y1="230" x2="77.8" y2="274.5" stroke="#f59e0b" stroke-width="1.5"/><polyline points="243,119 253.2,123 257.2,112.7" fill="none" stroke="#1f2937" stroke-width="1.5"/><polyline points="243,341 253.2,337 257.2,347.3" fill="none" stroke="#1f2937" stroke-width="1.5"/><polyline points="246.9,220 256.9,220 256.9,230" fill="none" stroke="#059669" stroke-width="1.5"/><circle cx="200" cy="230" r="3.5" fill="#1f2937"/><text x="184" y="236" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">O</text><circle cx="560" cy="230" r="3.5" fill="#1f2937"/><text x="576" y="236" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">M</text><circle cx="246.9" cy="108.8" r="3.5" fill="#1f2937"/><text x="252.7" y="99.9" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">A</text><circle cx="246.9" cy="351.2" r="3.5" fill="#1f2937"/><text x="252.7" y="372.1" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">B</text><circle cx="77.8" cy="274.5" r="3.5" fill="#1f2937"/><text x="62.8" y="285.9" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">D</text><circle cx="328.2" cy="251.4" r="3.5" fill="#1f2937"/><text x="330.2" y="277.4" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">C</text><circle cx="246.9" cy="230" r="3.5" fill="#1f2937"/><text x="260.9" y="222" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">H</text><rect x="40" y="392" width="14" height="14" fill="#2563eb" rx="3"/><text x="64" y="404" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">a) MAOB nội tiếp: ∠MAO + ∠MBO = 90° + 90° = 180°</text><rect x="40" y="418" width="14" height="14" fill="#e4572e" rx="3"/><text x="64" y="430" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">b) △MAC ∽ △MDA ⇒ MA² = MC · MD</text><rect x="40" y="444" width="14" height="14" fill="#059669" rx="3"/><text x="64" y="456" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">c) OM ⊥ AB tại H ⇒ MA² = MH · MO (hệ thức lượng)</text><rect x="40" y="470" width="14" height="14" fill="#f59e0b" rx="3"/><text x="64" y="482" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">    ⇒ MH · MO = MC · MD ⇒ CHOD nội tiếp (vùng cam)</text>
</svg>
