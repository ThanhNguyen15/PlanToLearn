<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 308" width="900" height="308" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="308" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Cách dẫn trực tiếp và cách dẫn gián tiếp</text>
<g transform="translate(0,44)">
<rect x="8" y="0" width="438" height="230" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><rect x="454" y="0" width="438" height="230" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="227" y="28" text-anchor="middle" font-size="17" fill="#2563eb" font-weight="700"><tspan x="227" dy="0">DẪN TRỰC TIẾP</tspan></text><text x="673" y="28" text-anchor="middle" font-size="17" fill="#059669" font-weight="700"><tspan x="673" dy="0">DẪN GIÁN TIẾP</tspan></text><text x="227" y="60" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="227" dy="0">Nhắc lại NGUYÊN VĂN lời / ý nghĩ</tspan></text><text x="227" y="84" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="227" dy="0">Đặt sau dấu hai chấm, trong ngoặc kép " "</tspan></text><text x="673" y="60" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="673" dy="0">Thuật lại lời / ý nghĩ CÓ ĐIỀU CHỈNH</tspan></text><text x="673" y="84" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="673" dy="0">KHÔNG dùng ngoặc kép; có thể thêm "rằng", "là"</tspan></text><rect x="24" y="108" width="406" height="108" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="227" y="148.5" text-anchor="middle" font-size="15" fill="#1f2937"><tspan x="227" dy="0">Bác Hồ dạy:</tspan><tspan x="227" dy="18.75">"Không có việc gì khó</tspan><tspan x="227" dy="18.75">Chỉ sợ lòng không bền."</tspan></text><rect x="470" y="108" width="406" height="108" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="673" y="157.9" text-anchor="middle" font-size="15" fill="#1f2937"><tspan x="673" dy="0">Bác Hồ dạy rằng không có việc gì khó,</tspan><tspan x="673" dy="18.75">chỉ sợ lòng mình không bền.</tspan></text><text x="450" y="254" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="450" dy="0">Chuyển trực tiếp → gián tiếp: bỏ ngoặc kép, đổi đại từ nhân xưng (tôi → anh ấy, cô ấy…), từ chỉ thời gian – nơi chốn cho phù hợp</tspan></text>
</g>
</svg>
