middle" font-size="12" fill="#1f2937" font-weight="700"><tspan x="337" dy="0">I = giao 3 đường phân giác</tspan></text><polygon points="300,70 240,245 420,245" fill="#d1fae5" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/><circle cx="316.4" cy="190.4" r="54.6" fill="none" stroke="#059669" stroke-width="2"/><line x1="300" y1="70" x2="316.4" y2="190.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><line x1="240" y1="245" x2="316.4" y2="190.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><line x1="420" y1="245" x2="316.4" y2="190.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/><circle cx="316.4" cy="190.4" r="4" fill="#059669"/><text x="326.4" y="186.4" text-anchor="middle" font-size="14" fill="#059669" font-weight="700"><tspan x="326.4" dy="0">I</tspan></text><text x="337" y="280" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="337" dy="0">I cách đều 3 cạnh (bằng r)</tspan></text><rect x="454" y="0" width="216" height="330" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="562" y="22" text-anchor="middle" font-size="14" fill="#e4572e" font-weight="700"><tspan x="562" dy="0">Tam giác vuông</tspan></text><text x="562" y="300" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700"><tspan x="562" dy="0">O = trung điểm cạnh huyền</tspan></text><circle cx="562" cy="160" r="85" fill="none" stroke="#e4572e" stroke-width="2"/><polygon points="519.5,86.4 477,160 647,160" fill="#fde2da" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/><polyline points="514.5,95 523.2,100 528.2,91.4" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="562" cy="160" r="4" fill="#e4572e"/><text x="562" y="178" text-anchor="middle" font-size="14" fill="#e4572e" font-weight="700"><tspan x="562" dy="0">O</tspan></text><text x="515.5" y="78.4" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="515.5" dy="0">A</tspan></text><text x="467" y="164" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="467" dy="0">B</tspan></text><text x="657" y="164" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="657" dy="0">C</tspan></text><text x="562" y="280" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="562" dy="0">R = BC / 2</tspan></text><rect x="679" y="0" width="216" height="330" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="787" y="22" text-anchor="middle" font-size="14" fill="#7c3aed" font-weight="700"><tspan x="787" dy="0">Tam giác đều cạnh a</tspan></text><text x="787" y="300" text-anchor="middle" font-size="12" fill="#1f2937" font-weight="700"><tspan x="787" dy="0">Tâm ngoại tiếp ≡ tâm nội tiếp</tspan></text><circle cx="787" cy="165" r="84" fill="none" stroke="#7c3aed" stroke-width="2"/><polygon points="787,81 714.3,207 859.7,207" fill="#ede9fe" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/><circle cx="787" cy="165" r="42" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 3"/><circle cx="787" cy="165" r="4" fill="#7c3aed"/><text x="787" y="270" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="787" dy="0">R = a√3 / 3   ·   r = a√3 / 6</tspan></text>
