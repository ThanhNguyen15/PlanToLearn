<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 289" width="900" height="289" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="289" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Các thì trọng tâm lớp 9 trên trục thời gian</text>
<g transform="translate(0,44)">
<line x1="60" y1="150" x2="870" y2="150" stroke="#1f2937" stroke-width="3" marker-end="url(#ah-ink)" stroke-linecap="round"/><text x="866" y="176" text-anchor="middle" font-size="12" fill="#6b7280"><tspan x="866" dy="0">thời gian</tspan></text><line x1="560" y1="88" x2="560" y2="190" stroke="#e4572e" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/><text x="560" y="208" text-anchor="middle" font-size="15" fill="#e4572e" font-weight="700"><tspan x="560" dy="0">NOW</tspan></text><circle cx="180" cy="150" r="8" fill="#7c3aed"/><text x="180" y="132" text-anchor="middle" font-size="13" fill="#7c3aed" font-weight="700"><tspan x="180" dy="0">had + V3</tspan></text><text x="180" y="180" text-anchor="middle" font-size="12" fill="#7c3aed"><tspan x="180" dy="0">Quá khứ hoàn thành</tspan><tspan x="180" dy="15">(xảy ra TRƯỚC một</tspan><tspan x="180" dy="15">việc quá khứ khác)</tspan></text><circle cx="330" cy="150" r="8" fill="#2563eb"/><text x="330" y="132" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="700"><tspan x="330" dy="0">V2 / V-ed</tspan></text><text x="330" y="180" text-anchor="middle" font-size="12" fill="#2563eb"><tspan x="330" dy="0">Quá khứ đơn</tspan><tspan x="330" dy="15">(yesterday, ago,</tspan><tspan x="330" dy="15">last …, in 2020)</tspan></text><path d="M190,110 Q255,80 320,110" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah-purple)" stroke-linejoin="round" stroke-linecap="round"/><text x="255" y="78" text-anchor="middle" font-size="11.5" fill="#7c3aed"><tspan x="255" dy="0">before / by the time</tspan></text><rect x="380" y="138" width="110" height="24" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="435" y="128" text-anchor="middle" font-size="12.5" fill="#f59e0b" font-weight="700"><tspan x="435" dy="0">was/were + V-ing</tspan></text><text x="435" y="180" text-anchor="middle" font-size="12" fill="#f59e0b"><tspan x="435" dy="0">Quá khứ tiếp diễn</tspan><tspan x="435" dy="15">(đang xảy ra tại một</tspan><tspan x="435" dy="15">thời điểm quá khứ)</tspan></text><path d="M400,80 Q480,30 556,90" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#ah-green)" stroke-linejoin="round" stroke-linecap="round"/><text x="470" y="42" text-anchor="middle" font-size="13" fill="#059669" font-weight="700"><tspan x="470" dy="0">have/has + V3</tspan></text><text x="700" y="50" text-anchor="middle" font-size="12" fill="#059669"><tspan x="700" dy="0">Hiện tại hoàn thành: bắt đầu trong quá khứ,</tspan><tspan x="700" dy="15">kéo dài / còn ảnh hưởng đến hiện tại</tspan><tspan x="700" dy="15">(for, since, already, yet, ever, never, just)</tspan></text><circle cx="760" cy="150" r="8" fill="#0d9488"/><text x="760" y="132" text-anchor="middle" font-size="12.5" fill="#0d9488" font-weight="700"><tspan x="760" dy="0">will + V / be going to + V</tspan></text><text x="760" y="180" text-anchor="middle" font-size="12" fill="#0d9488"><tspan x="760" dy="0">Tương lai</tspan><tspan x="760" dy="15">(tomorrow, next …,</tspan><tspan x="760" dy="15">in the future)</tspan></text>
</g>
</svg>
