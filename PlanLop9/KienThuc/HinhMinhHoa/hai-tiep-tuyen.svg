<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Bài gốc lớp 9: hai tiếp tuyến cắt nhau</text>
<g transform="translate(0,44)">
<circle cx="320" cy="175" r="150" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="170" cy="175" r="80" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><line x1="170" y1="175" x2="470" y2="175" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="470" y1="175" x2="191.3" y2="97.9" stroke="#e4572e" stroke-width="2.5" stroke-linecap="round"/><line x1="470" y1="175" x2="191.3" y2="252.1" stroke="#e4572e" stroke-width="2.5" stroke-linecap="round"/><line x1="170" y1="175" x2="191.3" y2="97.9" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="175" x2="191.3" y2="252.1" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/><line x1="191.3" y1="97.9" x2="191.3" y2="252.1" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/><polyline points="188.4,108.5 199,111.4 201.9,100.8" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="201.9,249.2 199,238.6 188.4,241.5" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="201.3,175 201.3,165 191.3,165" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="331.5" y1="142.9" x2="334.7" y2="131.3" stroke="#e4572e" stroke-width="2" stroke-linecap="round"/><line x1="326.7" y1="141.6" x2="329.9" y2="130" stroke="#e4572e" stroke-width="2" stroke-linecap="round"/><line x1="334.7" y1="218.7" x2="331.5" y2="207.1" stroke="#e4572e" stroke-width="2" stroke-linecap="round"/><line x1="329.9" y1="220" x2="326.7" y2="208.4" stroke="#e4572e" stroke-width="2" stroke-linecap="round"/><path d="M421.8,161.7 A50,50 0 0 0 420,175" fill="none" stroke="#f59e0b" stroke-width="2"/><path d="M414,175 A56,56 0 0 0 416,189.9" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="154" y="180" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="154" dy="0">O</tspan></text><text x="484" y="180" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="484" dy="0">A</tspan></text><text x="187.3" y="87.9" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="187.3" dy="0">B</tspan></text><text x="187.3" y="276.1" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="187.3" dy="0">C</tspan></text><text x="205.3" y="195" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="205.3" dy="0">H</tspan></text><text x="305" y="348" text-anchor="middle" font-size="12.5" fill="#059669"><tspan x="305" dy="0">Đường tròn đường kính OA (nét đứt xanh) đi qua B và C</tspan></text><rect x="560" y="30" width="330" height="290" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="576" y="101.2" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="576" dy="0">Từ điểm A ngoài (O), vẽ hai</tspan><tspan x="576" dy="17.5">tiếp tuyến AB, AC (B, C là tiếp điểm):</tspan><tspan x="576" dy="17.5"> </tspan><tspan x="576" dy="17.5">① AB = AC</tspan><tspan x="576" dy="17.5">② AO là tia phân giác góc BAC</tspan><tspan x="576" dy="17.5">③ OA ⊥ BC tại H, HB = HC</tspan><tspan x="576" dy="17.5">④ Tứ giác ABOC nội tiếp</tspan><tspan x="576" dy="17.5">    (vì B̂ + Ĉ = 90° + 90° = 180°)</tspan><tspan x="576" dy="17.5">⑤ OH · OA = OB² = R²</tspan><tspan x="576" dy="17.5">⑥ AH · AO = AB²</tspan></text>
</g>
