<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="396" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Mệnh đề quan hệ (Relative clauses)</text>
<g transform="translate(0,44)">
<rect x="20" y="6" width="140" height="34" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="90" y="28" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="90" dy="0">Đại từ</tspan></text><rect x="160" y="6" width="260" height="34" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="290" y="28" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="290" dy="0">Thay cho</tspan></text><rect x="420" y="6" width="460" height="34" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="650" y="28" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="650" dy="0">Ví dụ</tspan></text><rect x="20" y="40" width="140" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="90" y="62" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="90" dy="0">who</tspan></text><rect x="160" y="40" width="260" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="290" y="62" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="290" dy="0">người (chủ ngữ)</tspan></text><rect x="420" y="40" width="460" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="650" y="62" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="650" dy="0">The girl who sits next to me is Lan.</tspan></text><rect x="20" y="74" width="140" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="90" y="96" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="90" dy="0">whom</tspan></text><rect x="160" y="74" width="260" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="290" y="96" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="290" dy="0">người (tân ngữ)</tspan></text><rect x="420" y="74" width="460" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="650" y="96" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="650" dy="0">The man whom you met is my uncle.</tspan></text><rect x="20" y="108" width="140" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="90" y="130" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="90" dy="0">which</tspan></text><rect x="160" y="108" width="260" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="290" y="130" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="290" dy="0">vật, sự việc</tspan></text><rect x="420" y="108" width="460" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="650" y="130" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="650" dy="0">The book which I bought is useful.</tspan></text><rect x="20" y="142" width="140" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="90" y="164" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="90" dy="0">that</tspan></text><rect x="160" y="142" width="260" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="290" y="164" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="290" dy="0">người / vật (MĐQH xác định)</tspan></text><rect x="420" y="142" width="460" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="650" y="164" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="650" dy="0">This is the best film that I have seen.</tspan></text><rect x="20" y="176" width="140" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="90" y="198" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="90" dy="0">whose</tspan></text><rect x="160" y="176" width="260" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="290" y="198" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="290" dy="0">sở hữu (của ai / cái gì)</tspan></text><rect x="420" y="176" width="460" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="650" y="198" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="650" dy="0">The boy whose bike was stolen is sad.</tspan></text><rect x="20" y="210" width="140" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="90" y="232" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="90" dy="0">where / when</tspan></text><rect x="160" y="210" width="260" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="290" y="232" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="290" dy="0">nơi chốn / thời gian</tspan></text><rect x="420" y="210" width="460" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="650" y="232" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="650" dy="0">Hue is the city where I was born.</tspan></text><rect x="20" y="252" width="425" height="92" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="232.5" y="285.9" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="232.5" dy="0">XÁC ĐỊNH (defining): cần thiết để xác định</tspan><tspan x="232.5" dy="16.875">danh từ · KHÔNG dấu phẩy · dùng được "that"</tspan><tspan x="232.5" dy="16.875">The student who won the prize is in 9A.</tspan></text><rect x="455" y="252" width="425" height="92" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="667.5" y="285.9" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="667.5" dy="0">KHÔNG XÁC ĐỊNH (non-defining): thêm thông tin</tspan><tspan x="667.5" dy="16.875">· CÓ dấu phẩy · KHÔNG dùng "that"</tspan><tspan x="667.5" dy="16.875">Ha Long Bay, which is in Quang Ninh, is famous.</tspan></text>
</g>
</svg>
