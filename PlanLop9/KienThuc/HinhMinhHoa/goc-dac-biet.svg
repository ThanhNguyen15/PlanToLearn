<rect x="0" y="0" width="900" height="264" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Tỉ số lượng giác của các góc đặc biệt</text>
<g transform="translate(0,44)">
<rect x="40" y="10" width="90" height="40" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="85" y="35" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="700"><tspan x="85" dy="0"> </tspan></text><rect x="130" y="10" width="120" height="40" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="190" y="35" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="700"><tspan x="190" dy="0">30°</tspan></text><rect x="250" y="10" width="120" height="40" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="310" y="35" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="700"><tspan x="310" dy="0">45°</tspan></text><rect x="370" y="10" width="120" height="40" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="430" y="35" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="700"><tspan x="430" dy="0">60°</tspan></text><rect x="40" y="50" width="90" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="85" y="75" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="85" dy="0">sin</tspan></text><rect x="130" y="50" width="120" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="190" y="75" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="190" dy="0">1/2</tspan></text><rect x="250" y="50" width="120" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="310" y="75" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="310" dy="0">√2/2</tspan></text><rect x="370" y="50" width="120" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="430" y="75" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="430" dy="0">√3/2</tspan></text><rect x="40" y="90" width="90" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="85" y="115" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="85" dy="0">cos</tspan></text><rect x="130" y="90" width="120" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="190" y="115" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="190" dy="0">√3/2</tspan></text><rect x="250" y="90" width="120" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="310" y="115" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="310" dy="0">√2/2</tspan></text><rect x="370" y="90" width="120" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="430" y="115" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="430" dy="0">1/2</tspan></text><rect x="40" y="130" width="90" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="85" y="155" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="85" dy="0">tan</tspan></text><rect x="130" y="130" width="120" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="190" y="155" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="190" dy="0">√3/3</tspan></text><rect x="250" y="130" width="120" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="310" y="155" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="310" dy="0">1</tspan></text><rect x="370" y="130" width="120" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="430" y="155" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="430" dy="0">√3</tspan></text><rect x="40" y="170" width="90" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="85" y="195" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="85" dy="0">cot</tspan></text><rect x="130" y="170" width="120" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="190" y="195" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="190" dy="0">√3</tspan></text><rect x="250" y="170" width="120" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="310" y="195" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="310" dy="0">1</tspan></text><rect x="370" y="170" width="120" height="40" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="430" y="195" text-anchor="middle" font-size="17" fill="#1f2937"><tspan x="430" dy="0">√3/3</tspan></text><rect x="560" y="10" width="320" height="200" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="576" y="71.2" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="576" dy="0">Mẹo nhớ:</tspan><tspan x="576" dy="17.5">• sin α = cos(90° − α)</tspan><tspan x="576" dy="17.5">• tan α = cot(90° − α)</tspan><tspan x="576" dy="17.5">• sin²α + cos²α = 1</tspan><tspan x="576" dy="17.5">• tan α · cot α = 1</tspan><tspan x="576" dy="17.5">• α tăng → sin, tan tăng; cos, cot giảm</tspan></text>
</g>
