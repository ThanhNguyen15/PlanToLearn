<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 388" width="900" height="388" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="388" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Câu điều kiện và câu ước</text>
<g transform="translate(0,44)">
<rect x="14" y="6" width="280" height="40" rx="8" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/><text x="154" y="31.3" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700"><tspan x="154" dy="0">Loại 0 – sự thật</tspan></text><rect x="14" y="50" width="280" height="120" rx="8" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.5"/><text x="154" y="97.9" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="154" dy="0">If + S + V(s/es), S + V(s/es)</tspan><tspan x="154" dy="16.875"> </tspan><tspan x="154" dy="16.875">If you heat ice, it melts.</tspan></text><rect x="310" y="6" width="280" height="40" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="450" y="31.3" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700"><tspan x="450" dy="0">Loại 1 – có thể xảy ra</tspan></text><rect x="310" y="50" width="280" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="450" y="97.9" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="450" dy="0">If + S + V(s/es), S + will + V</tspan><tspan x="450" dy="16.875"> </tspan><tspan x="450" dy="16.875">If it rains, we will stay home.</tspan></text><rect x="606" y="6" width="280" height="40" rx="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="746" y="31.3" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700"><tspan x="746" dy="0">Loại 2 – trái hiện tại</tspan></text><rect x="606" y="50" width="280" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="746" y="97.9" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="746" dy="0">If + S + V2/ed, S + would + V</tspan><tspan x="746" dy="16.875">(to be: were cho mọi ngôi)</tspan><tspan x="746" dy="16.875">If I were you, I would study more.</tspan></text><rect x="14" y="184" width="430" height="40" rx="8" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/><text x="229" y="209.3" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700"><tspan x="229" dy="0">Câu ước ở hiện tại (wish)</tspan></text><rect x="14" y="228" width="430" height="108" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="229" y="269.9" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="229" dy="0">S + wish(es) + S + V2/ed (were)</tspan><tspan x="229" dy="16.875">I wish I had more free time.</tspan><tspan x="229" dy="16.875">(Thực tế: I don't have much free time.)</tspan></text><rect x="456" y="184" width="430" height="40" rx="8" fill="#059669" stroke="#059669" stroke-width="1.5"/><text x="671" y="209.3" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="700"><tspan x="671" dy="0">Unless = If … not</tspan></text><rect x="456" y="228" width="430" height="108" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="671" y="269.9" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="671" dy="0">Unless you hurry, you will be late.</tspan><tspan x="671" dy="16.875">= If you don't hurry, you will be late.</tspan><tspan x="671" dy="16.875">(Sau unless KHÔNG dùng not)</tspan></text>
</g>
</svg>
