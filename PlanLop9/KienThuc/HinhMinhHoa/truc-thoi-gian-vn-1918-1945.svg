<rect x="0" y="0" width="900" height="334" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Việt Nam 1918 – 1945: từ tìm đường cứu nước đến Cách mạng tháng Tám</text>
<g transform="translate(0,44)">
<line x1="30" y1="145" x2="890" y2="145" stroke="#334155" stroke-width="4" marker-end="url(#ah-line)" stroke-linecap="round"/><circle cx="70" cy="145" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><line x1="70" y1="135" x2="70" y2="107" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/><text x="70" y="99" text-anchor="middle" font-size="13.5" fill="#2563eb" font-weight="700"><tspan x="70" dy="0">6/1919</tspan></text><text x="70" y="63" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="70" dy="0">Gửi Bản yêu sách</tspan><tspan x="70" dy="15">của nhân dân An Nam</tspan></text><circle cx="165" cy="145" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><line x1="165" y1="155" x2="165" y2="183" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/><text x="165" y="201" text-anchor="middle" font-size="13.5" fill="#2563eb" font-weight="700"><tspan x="165" dy="0">7/1920</tspan></text><text x="165" y="221" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="165" dy="0">NAQ đọc Luận cương</tspan><tspan x="165" dy="15">của Lênin</tspan></text><circle cx="260" cy="145" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><line x1="260" y1="135" x2="260" y2="107" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/><text x="260" y="99" text-anchor="middle" font-size="13.5" fill="#2563eb" font-weight="700"><tspan x="260" dy="0">6/1925</tspan></text><text x="260" y="63" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="260" dy="0">Hội VN Cách mạng</tspan><tspan x="260" dy="15">Thanh niên</tspan></text><circle cx="355" cy="145" r="9" fill="#e4572e" stroke="#e4572e" stroke-width="2"/><line x1="355" y1="155" x2="355" y2="183" stroke="#e4572e" stroke-width="1.5" stroke-linecap="round"/><text x="355" y="201" text-anchor="middle" font-size="13.5" fill="#e4572e" font-weight="700"><tspan x="355" dy="0">3/2/1930</tspan></text><text x="355" y="221" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="355" dy="0">Thành lập Đảng</tspan><tspan x="355" dy="15">Cộng sản Việt Nam</tspan></text><circle cx="450" cy="145" r="9" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/><line x1="450" y1="135" x2="450" y2="107" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/><text x="450" y="99" text-anchor="middle" font-size="13.5" fill="#f59e0b" font-weight="700"><tspan x="450" dy="0">1930 – 1931</tspan></text><text x="450" y="63" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="450" dy="0">Phong trào cách mạng,</tspan><tspan x="450" dy="15">Xô viết Nghệ – Tĩnh</tspan></text><circle cx="545" cy="145" r="9" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/><line x1="545" y1="155" x2="545" y2="183" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/><text x="545" y="201" text-anchor="middle" font-size="13.5" fill="#f59e0b" font-weight="700"><tspan x="545" dy="0">1936 – 1939</tspan></text><text x="545" y="221" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="545" dy="0">Phong trào</tspan><tspan x="545" dy="15">dân chủ</tspan></text><circle cx="640" cy="145" r="9" fill="#059669" stroke="#059669" stroke-width="2"/><line x1="640" y1="135" x2="640" y2="107" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/><text x="640" y="99" text-anchor="middle" font-size="13.5" fill="#059669" font-weight="700"><tspan x="640" dy="0">5/1941</tspan></text><text x="640" y="63" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="640" dy="0">Thành lập</tspan><tspan x="640" dy="15">Mặt trận Việt Minh</tspan></text><circle cx="735" cy="145" r="9" fill="#e4572e" stroke="#e4572e" stroke-width="2"/><line x1="735" y1="155" x2="735" y2="183" stroke="#e4572e" stroke-width="1.5" stroke-linecap="round"/><text x="735" y="201" text-anchor="middle" font-size="13.5" fill="#e4572e" font-weight="700"><tspan x="735" dy="0">19/8/1945</tspan></text><text x="735" y="221" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="735" dy="0">Khởi nghĩa giành</tspan><tspan x="735" dy="15">chính quyền ở Hà Nội</tspan></text><circle cx="830" cy="145" r="9" fill="#e4572e" stroke="#e4572e" stroke-width="2"/><line x1="830" y1="135" x2="830" y2="107" stroke="#e4572e" stroke-width="1.5" stroke-linecap="round"/><text x="830" y="99" text-anchor="middle" font-size="13.5" fill="#e4572e" font-weight="700"><tspan x="830" dy="0">2/9/1945</tspan></text><text x="830" y="63" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="830" dy="0">Tuyên ngôn</tspan><tspan x="830" dy="15">Độc lập</tspan></text>
