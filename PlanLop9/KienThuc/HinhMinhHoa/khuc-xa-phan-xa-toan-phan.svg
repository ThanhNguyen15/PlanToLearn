<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 369" width="900" height="369" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="369" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Khúc xạ ánh sáng và phản xạ toàn phần</text>
<g transform="translate(0,44)">
<rect x="6" y="0" width="438" height="320" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="225" y="24" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700"><tspan x="225" dy="0">Khúc xạ: ánh sáng từ không khí vào nước</tspan></text><rect x="14" y="170" width="422" height="140" rx="0" fill="#dbeafe" stroke="none" stroke-width="1.5"/><line x1="14" y1="170" x2="436" y2="170" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><text x="40" y="155" text-anchor="start" font-size="13" fill="#6b7280"><tspan x="40" dy="0">Không khí</tspan></text><text x="40" y="300" text-anchor="start" font-size="13" fill="#2563eb"><tspan x="40" dy="0">Nước</tspan></text><line x1="225" y1="45" x2="225" y2="300" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><text x="234" y="56" text-anchor="start" font-size="12" fill="#6b7280"><tspan x="234" dy="0">N (pháp tuyến)</tspan></text><line x1="126" y1="71" x2="225" y2="170" stroke="#e4572e" stroke-width="2.5" stroke-linecap="round"/><line x1="126" y1="71" x2="175.5" y2="120.5" stroke="#e4572e" stroke-width="2.5" marker-end="url(#ah-red)" stroke-linecap="round"/><line x1="225" y1="170" x2="290.7" y2="293.6" stroke="#e4572e" stroke-width="2.5" marker-end="url(#ah-red)" stroke-linecap="round"/><path d="M225,130 A40,40 0 0 0 196.7,141.7" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="204" y="118.1" text-anchor="middle" font-size="14" fill="#f59e0b" font-weight="700" font-style="italic"><tspan x="204" dy="0">i</tspan></text><path d="M225,216 A46,46 0 0 0 246.6,210.6" fill="none" stroke="#059669" stroke-width="2"/><text x="240.5" y="232.1" text-anchor="middle" font-size="14" fill="#059669" font-weight="700" font-style="italic"><tspan x="240.5" dy="0">r</tspan></text><text x="112" y="66" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="112" dy="0">S</tspan></text><circle cx="225" cy="170" r="3.5" fill="#1f2937"/><text x="211" y="164" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="211" dy="0">I</tspan></text><text x="330" y="230" text-anchor="middle" font-size="13" fill="#059669" font-weight="700"><tspan x="330" dy="0">r &lt; i</tspan><tspan x="330" dy="16.25">Tia khúc xạ lệch</tspan><tspan x="330" dy="16.25">GẦN pháp tuyến</tspan></text><text x="110" y="230" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="110" dy="0">n = c / v</tspan><tspan x="110" dy="16.25">sin i / sin r = n₂ / n₁</tspan></text><rect x="456" y="0" width="438" height="320" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="675" y="24" text-anchor="middle" font-size="15" fill="#7c3aed" font-weight="700"><tspan x="675" dy="0">Phản xạ toàn phần: từ nước ra không khí</tspan></text><rect x="464" y="170" width="422" height="140" rx="0" fill="#dbeafe" stroke="none" stroke-width="1.5"/><line x1="464" y1="170" x2="886" y2="170" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><line x1="675" y1="45" x2="675" y2="300" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="642.5" y1="259.3" x2="675" y2="170" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah-orange)" stroke-linecap="round"/><line x1="675" y1="170" x2="742.7" y2="83.3" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah-orange)" stroke-linecap="round"/><line x1="552.1" y1="256" x2="675" y2="170" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ah-purple)" stroke-linecap="round"/><line x1="675" y1="170" x2="797.9" y2="256" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ah-purple)" stroke-linecap="round"/><text x="560" y="70" text-anchor="middle" font-size="12.5" fill="#f59e0b"><tspan x="560" dy="0">i nhỏ: có tia khúc xạ</tspan><tspan x="560" dy="15.625">(lệch XA pháp tuyến)</tspan></text><text x="815" y="70" text-anchor="middle" font-size="12.5" fill="#7c3aed"><tspan x="815" dy="0">i ≥ i_gh: KHÔNG có</tspan><tspan x="815" dy="15.625">tia khúc xạ, ánh sáng</tspan><tspan x="815" dy="15.625">phản xạ hoàn toàn</tspan></text><text x="675" y="285" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700"><tspan x="675" dy="0">Điều kiện: n₁ &gt; n₂ (đi từ môi trường chiết quang hơn) và i ≥ i_gh</tspan></text><text x="675" y="305" text-anchor="middle" font-size="12.5" fill="#6b7280"><tspan x="675" dy="0">Ứng dụng: cáp quang, kim cương lấp lánh</tspan></text>
</g>
</svg>
