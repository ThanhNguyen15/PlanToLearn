<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 292" width="900" height="292" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="292" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Học thuyết tiến hóa của Darwin: chọn lọc tự nhiên</text>
<g transform="translate(0,44)">
<rect x="14" y="10" width="200" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="114" y="37.3" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="114" dy="0">Biến dị</tspan></text><rect x="14" y="58" width="200" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="114" y="91.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="114" dy="0">Các cá thể trong loài</tspan><tspan x="114" dy="16.25">khác nhau (màu, kích</tspan><tspan x="114" dy="16.25">thước, sức chịu đựng)</tspan></text><line x1="216" y1="32" x2="234" y2="32" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="236" y="10" width="200" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="336" y="37.3" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="336" dy="0">Đấu tranh sinh tồn</tspan></text><rect x="236" y="58" width="200" height="90" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="336" y="91.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="336" dy="0">Thức ăn, nơi ở có hạn;</tspan><tspan x="336" dy="16.25">kẻ thù, điều kiện</tspan><tspan x="336" dy="16.25">môi trường khắc nghiệt</tspan></text><line x1="438" y1="32" x2="456" y2="32" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="458" y="10" width="200" height="44" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="558" y="37.3" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="558" dy="0">Chọn lọc tự nhiên</tspan></text><rect x="458" y="58" width="200" height="90" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.5"/><text x="558" y="91.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="558" dy="0">Cá thể có biến dị CÓ LỢI</tspan><tspan x="558" dy="16.25">sống sót, sinh sản nhiều;</tspan><tspan x="558" dy="16.25">biến dị có hại bị đào thải</tspan></text><line x1="660" y1="32" x2="678" y2="32" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="680" y="10" width="200" height="44" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="780" y="37.3" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="780" dy="0">Hình thành loài mới</tspan></text><rect x="680" y="58" width="200" height="90" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="780" y="91.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="780" dy="0">Đặc điểm có lợi tích lũy</tspan><tspan x="780" dy="16.25">qua nhiều thế hệ →</tspan><tspan x="780" dy="16.25">sinh vật thích nghi</tspan></text><rect x="14" y="166" width="872" height="74" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="30" y="199.3" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="30" dy="0">Ví dụ: bướm sâu đo bạch dương ở Anh – khi thân cây bị muội than làm sẫm màu, bướm màu sẫm khó bị chim phát hiện</tspan><tspan x="30" dy="16.875">→ sống sót nhiều hơn → tỉ lệ bướm sẫm tăng dần. Vi khuẩn kháng thuốc kháng sinh cũng hình thành theo cách tương tự.</tspan></text>
</g>
</svg>
