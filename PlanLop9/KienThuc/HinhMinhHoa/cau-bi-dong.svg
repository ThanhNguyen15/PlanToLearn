<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 439" width="900" height="439" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="439" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Câu bị động (The passive voice)</text>
<g transform="translate(0,44)">
<rect x="20" y="10" width="860" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="450" y="44" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">Chủ động:   People   |   built   |   this bridge   |   in 1990.</tspan></text><line x1="300" y1="68" x2="300" y2="100" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah-orange)" stroke-linecap="round"/><line x1="530" y1="68" x2="530" y2="100" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah-orange)" stroke-linecap="round"/><rect x="20" y="104" width="860" height="56" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="450" y="138" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">Bị động:   This bridge   |   was built   |   (by people)   |   in 1990.</tspan></text><rect x="20" y="176" width="240" height="32" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="140" y="197" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="140" dy="0">Thì</tspan></text><rect x="260" y="176" width="290" height="32" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="405" y="197" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="405" dy="0">Chủ động</tspan></text><rect x="550" y="176" width="330" height="32" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="715" y="197" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="715" dy="0">Bị động  (be + V3/ed)</tspan></text><rect x="20" y="208" width="240" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="140" y="229" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="140" dy="0">Hiện tại đơn</tspan></text><rect x="260" y="208" width="290" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="405" y="229" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="405" dy="0">V / V-s</tspan></text><rect x="550" y="208" width="330" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="715" y="229" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="715" dy="0">am / is / are + V3</tspan></text><rect x="20" y="240" width="240" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="140" y="261" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="140" dy="0">Quá khứ đơn</tspan></text><rect x="260" y="240" width="290" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="405" y="261" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="405" dy="0">V2 / V-ed</tspan></text><rect x="550" y="240" width="330" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="715" y="261" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="715" dy="0">was / were + V3</tspan></text><rect x="20" y="272" width="240" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="140" y="293" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="140" dy="0">Hiện tại hoàn thành</tspan></text><rect x="260" y="272" width="290" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="405" y="293" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="405" dy="0">have / has + V3</tspan></text><rect x="550" y="272" width="330" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="715" y="293" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="715" dy="0">have / has been + V3</tspan></text><rect x="20" y="304" width="240" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="140" y="325" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="140" dy="0">Tương lai đơn</tspan></text><rect x="260" y="304" width="290" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="405" y="325" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="405" dy="0">will + V</tspan></text><rect x="550" y="304" width="330" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="715" y="325" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="715" dy="0">will be + V3</tspan></text><rect x="20" y="336" width="240" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="140" y="357" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="140" dy="0">Động từ khuyết thiếu</tspan></text><rect x="260" y="336" width="290" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="405" y="357" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="405" dy="0">can / must / should + V</tspan></text><rect x="550" y="336" width="330" height="32" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="715" y="357" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="715" dy="0">can / must / should be + V3</tspan></text><text x="450" y="386" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="450" dy="0">Bỏ "by + them / people / someone" · O của câu chủ động → S của câu bị động · động từ "be" chia theo thì của câu gốc</tspan></text>
</g>
</svg>
