<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 336" width="900" height="336" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="336" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Truyện truyền kì: hiện thực đan xen kì ảo</text>
<g transform="translate(0,44)">
<rect x="20" y="10" width="260" height="150" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="36" y="54.9" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="36" dy="0">YẾU TỐ HIỆN THỰC</tspan><tspan x="36" dy="17.5">• bối cảnh lịch sử có thật</tspan><tspan x="36" dy="17.5">• số phận con người</tspan><tspan x="36" dy="17.5">  (người phụ nữ, kẻ sĩ…)</tspan><tspan x="36" dy="17.5">• xã hội bất công</tspan></text><rect x="620" y="10" width="260" height="150" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="636" y="54.9" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="636" dy="0">YẾU TỐ KÌ ẢO</tspan><tspan x="636" dy="17.5">• thế giới thần tiên, cõi âm,</tspan><tspan x="636" dy="17.5">  thủy cung</tspan><tspan x="636" dy="17.5">• nhân vật siêu nhiên</tspan><tspan x="636" dy="17.5">• chi tiết hoang đường</tspan></text><rect x="320" y="40" width="260" height="90" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="450" y="80.9" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">TRUYỆN TRUYỀN KÌ</tspan><tspan x="450" dy="18.75">(văn xuôi chữ Hán thời trung đại)</tspan></text><line x1="282" y1="85" x2="318" y2="85" stroke="#2563eb" stroke-width="2" marker-end="url(#ah-blue)" stroke-linecap="round"/><line x1="618" y1="85" x2="582" y2="85" stroke="#7c3aed" stroke-width="2" marker-end="url(#ah-purple)" stroke-linecap="round"/><line x1="450" y1="132" x2="450" y2="176" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah-orange)" stroke-linecap="round"/><rect x="170" y="178" width="560" height="80" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="450" y="205.4" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="450" dy="0">Ý NGHĨA: phản ánh hiện thực, bày tỏ niềm cảm thông với con người</tspan><tspan x="450" dy="17.5">(nhất là người phụ nữ), thể hiện ước mơ công lí:</tspan><tspan x="450" dy="17.5">"người tốt được đền đáp, kẻ ác bị trừng trị"</tspan></text><text x="450" y="282" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="450" dy="0">Câu hỏi hay gặp: "Chỉ ra một chi tiết kì ảo và nêu tác dụng" → tạo sức hấp dẫn + hoàn chỉnh tính cách nhân vật + thể hiện ước mơ/thái độ của tác giả</tspan></text>
</g>
</svg>
