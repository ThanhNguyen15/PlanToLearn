<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="370" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Kinh tế biển đảo Việt Nam</text>
<g transform="translate(0,44)">
<rect x="300" y="8" width="300" height="70" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="450" y="38.6" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="700"><tspan x="450" dy="0">PHÁT TRIỂN TỔNG HỢP</tspan><tspan x="450" dy="20">KINH TẾ BIỂN</tspan></text><line x1="450" y1="80" x2="117" y2="104" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="14" y="106" width="206" height="54" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="117" y="129.3" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="117" dy="0">Khai thác, nuôi trồng</tspan><tspan x="117" dy="16.875">hải sản</tspan></text><rect x="14" y="164" width="206" height="64" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="117" y="192.6" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="117" dy="0">Ngư trường lớn; nuôi tôm, cá;</tspan><tspan x="117" dy="15.625">đánh bắt xa bờ</tspan></text><line x1="450" y1="80" x2="339" y2="104" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="236" y="106" width="206" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="339" y="137.7" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="339" dy="0">Du lịch biển – đảo</tspan></text><rect x="236" y="164" width="206" height="64" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="339" y="192.6" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="339" dy="0">Hạ Long, Nha Trang, Phú Quốc,</tspan><tspan x="339" dy="15.625">Côn Đảo…</tspan></text><line x1="450" y1="80" x2="561" y2="104" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="458" y="106" width="206" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="561" y="137.7" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="561" dy="0">Giao thông vận tải biển</tspan></text><rect x="458" y="164" width="206" height="64" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="561" y="192.6" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="561" dy="0">Cảng Hải Phòng, Đà Nẵng,</tspan><tspan x="561" dy="15.625">Cái Mép – Thị Vải…</tspan></text><line x1="450" y1="80" x2="783" y2="104" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="680" y="106" width="206" height="54" rx="8" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><text x="783" y="137.7" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="783" dy="0">Khai thác khoáng sản</tspan></text><rect x="680" y="164" width="206" height="64" rx="8" fill="#ffffff" stroke="#92400e" stroke-width="1.5"/><text x="783" y="192.6" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="783" dy="0">Dầu khí (thềm lục địa phía Nam),</tspan><tspan x="783" dy="15.625">muối, cát, titan</tspan></text><rect x="14" y="242" width="872" height="76" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="30" y="276.3" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="30" dy="0">Bờ biển dài hơn 3 260 km, vùng biển rộng khoảng 1 triệu km², hàng nghìn đảo; hai quần đảo Hoàng Sa và Trường Sa.</tspan><tspan x="30" dy="16.875">Bảo vệ chủ quyền biển đảo + bảo vệ tài nguyên, môi trường biển (chống khai thác hủy diệt, rác thải nhựa, sự cố tràn dầu).</tspan></text>
</g>
</svg>
