<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 349" width="900" height="349" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="349" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Cảm ứng điện từ và dòng điện xoay chiều</text>
<g transform="translate(0,44)">
<rect x="8" y="0" width="470" height="300" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><ellipse cx="250" cy="120" rx="9" ry="48" fill="none" stroke="#92400e" stroke-width="3"/><ellipse cx="268" cy="120" rx="9" ry="48" fill="none" stroke="#92400e" stroke-width="3"/><ellipse cx="286" cy="120" rx="9" ry="48" fill="none" stroke="#92400e" stroke-width="3"/><ellipse cx="304" cy="120" rx="9" ry="48" fill="none" stroke="#92400e" stroke-width="3"/><ellipse cx="322" cy="120" rx="9" ry="48" fill="none" stroke="#92400e" stroke-width="3"/><ellipse cx="340" cy="120" rx="9" ry="48" fill="none" stroke="#92400e" stroke-width="3"/><ellipse cx="358" cy="120" rx="9" ry="48" fill="none" stroke="#92400e" stroke-width="3"/><line x1="250" y1="168" x2="250" y2="230" stroke="#92400e" stroke-width="2" stroke-linecap="round"/><line x1="358" y1="168" x2="358" y2="230" stroke="#92400e" stroke-width="2" stroke-linecap="round"/><line x1="250" y1="230" x2="280" y2="230" stroke="#92400e" stroke-width="2" stroke-linecap="round"/><line x1="328" y1="230" x2="358" y2="230" stroke="#92400e" stroke-width="2" stroke-linecap="round"/><circle cx="304" cy="230" r="24" fill="#ffffff" stroke="#1f2937" stroke-width="2"/><text x="304" y="236" text-anchor="middle" font-size="16" fill="#1f2937" font-weight="700"><tspan x="304" dy="0">G</tspan></text><line x1="304" y1="230" x2="316" y2="214" stroke="#e4572e" stroke-width="2" stroke-linecap="round"/><rect x="60" y="104" width="70" height="32" rx="2" fill="#e4572e" stroke="#e4572e" stroke-width="1.5"/><rect x="130" y="104" width="70" height="32" rx="2" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="95" y="126" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="700"><tspan x="95" dy="0">N</tspan></text><text x="165" y="126" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="700"><tspan x="165" dy="0">S</tspan></text><line x1="150" y1="80" x2="220" y2="80" stroke="#059669" stroke-width="3" marker-end="url(#ah-green)" stroke-linecap="round"/><line x1="150" y1="165" x2="80" y2="165" stroke="#7c3aed" stroke-width="3" marker-end="url(#ah-purple)" stroke-linecap="round"/><text x="185" y="70" text-anchor="middle" font-size="12.5" fill="#059669"><tspan x="185" dy="0">đưa vào</tspan></text><text x="115" y="185" text-anchor="middle" font-size="12.5" fill="#7c3aed"><tspan x="115" dy="0">kéo ra</tspan></text><text x="243" y="270" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="243" dy="0">Nam châm chuyển động → kim điện kế G lệch</tspan></text><text x="243" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280"><tspan x="243" dy="0">(đưa vào và kéo ra: kim lệch theo hai chiều ngược nhau)</tspan></text><rect x="492" y="0" width="400" height="300" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="508" y="67.4" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="508" dy="0">Hiện tượng cảm ứng điện từ:</tspan><tspan x="508" dy="17.5">khi SỐ ĐƯỜNG SỨC TỪ xuyên qua tiết</tspan><tspan x="508" dy="17.5">diện cuộn dây kín BIẾN THIÊN → trong</tspan><tspan x="508" dy="17.5">cuộn dây xuất hiện dòng điện cảm ứng.</tspan><tspan x="508" dy="17.5"> </tspan><tspan x="508" dy="17.5">Dòng điện xoay chiều: chiều luân phiên</tspan><tspan x="508" dy="17.5">thay đổi (điện lưới VN: 220 V – 50 Hz).</tspan><tspan x="508" dy="17.5"> </tspan><tspan x="508" dy="17.5">Máy phát điện xoay chiều: nam châm và</tspan><tspan x="508" dy="17.5">cuộn dây, một bộ phận quay.</tspan><tspan x="508" dy="17.5">Tác dụng: nhiệt, phát sáng, từ, sinh lí.</tspan></text>
</g>
</svg>
