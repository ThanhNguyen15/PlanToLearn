<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 322" width="900" height="322" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="322" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Dãy hoạt động hóa học của kim loại</text>
<g transform="translate(0,44)">
<text x="450" y="18" text-anchor="middle" font-size="14" fill="#6b7280" font-style="italic"><tspan x="450" dy="0">"Khi Nào Cần May Áo Záp Sắt Phải Hỏi Cửa Hàng Á Âu"</tspan></text><rect x="30" y="34" width="60" height="54" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="60" y="69" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="60" dy="0">K</tspan></text><rect x="100" y="34" width="60" height="54" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="130" y="69" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="130" dy="0">Na</tspan></text><rect x="170" y="34" width="60" height="54" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="200" y="69" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="200" dy="0">Ca</tspan></text><rect x="240" y="34" width="60" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="270" y="69" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="270" dy="0">Mg</tspan></text><rect x="310" y="34" width="60" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="340" y="69" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="340" dy="0">Al</tspan></text><rect x="380" y="34" width="60" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="410" y="69" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="410" dy="0">Zn</tspan></text><rect x="450" y="34" width="60" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="480" y="69" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="480" dy="0">Fe</tspan></text><rect x="520" y="34" width="60" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="550" y="69" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="550" dy="0">Pb</tspan></text><rect x="590" y="34" width="60" height="54" rx="8" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 3"/><text x="620" y="69" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="620" dy="0">H</tspan></text><rect x="660" y="34" width="60" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="690" y="69" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="690" dy="0">Cu</tspan></text><rect x="730" y="34" width="60" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="760" y="69" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="760" dy="0">Ag</tspan></text><rect x="800" y="34" width="60" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="830" y="69" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="830" dy="0">Au</tspan></text><line x1="840" y1="104" x2="40" y2="104" stroke="#e4572e" stroke-width="3" marker-end="url(#ah-red)" stroke-linecap="round"/><text x="440" y="124" text-anchor="middle" font-size="14" fill="#e4572e" font-weight="700"><tspan x="440" dy="0">Mức độ hoạt động hóa học TĂNG dần (từ phải sang trái)</tspan></text><rect x="20" y="140" width="280" height="128" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="36" y="183.4" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="36" dy="0">K, Na, Ca… (đầu dãy)</tspan><tspan x="36" dy="16.875">Phản ứng với NƯỚC ở nhiệt độ</tspan><tspan x="36" dy="16.875">thường → base + khí H₂</tspan><tspan x="36" dy="16.875">2Na + 2H₂O → 2NaOH + H₂↑</tspan></text><rect x="310" y="140" width="280" height="128" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="326" y="183.4" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="326" dy="0">Kim loại ĐỨNG TRƯỚC H</tspan><tspan x="326" dy="16.875">tác dụng với dung dịch acid</tspan><tspan x="326" dy="16.875">(HCl, H₂SO₄ loãng) → muối + H₂</tspan><tspan x="326" dy="16.875">Fe + 2HCl → FeCl₂ + H₂↑</tspan></text><rect x="600" y="140" width="280" height="128" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="616" y="183.4" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="616" dy="0">Kim loại mạnh hơn (trừ K, Na,</tspan><tspan x="616" dy="16.875">Ca…) đẩy kim loại yếu hơn</tspan><tspan x="616" dy="16.875">ra khỏi dung dịch muối</tspan><tspan x="616" dy="16.875">Fe + CuSO₄ → FeSO₄ + Cu↓</tspan></text>
</g>
</svg>
