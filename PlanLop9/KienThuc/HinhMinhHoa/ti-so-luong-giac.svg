<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 369" width="900" height="369" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="369" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Tỉ số lượng giác và hệ thức trong tam giác vuông</text>
<g transform="translate(0,44)">
<rect x="6" y="0" width="288" height="320" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><rect x="306" y="0" width="288" height="320" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><rect x="606" y="0" width="288" height="320" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="150" y="24" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700"><tspan x="150" dy="0">Tỉ số lượng giác của góc α</tspan></text><polygon points="60,210 250,210 60,70" fill="#dbeafe" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/><polyline points="71,210 71,199 60,199" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M225.8,192.2 A30,30 0 0 0 220,210" fill="none" stroke="#e4572e" stroke-width="2"/><text x="200" y="202" text-anchor="middle" font-size="15" fill="#e4572e" font-weight="700"><tspan x="200" dy="0">α</tspan></text><text x="155" y="230" text-anchor="middle" font-size="13" fill="#059669" font-weight="700"><tspan x="155" dy="0">cạnh kề</tspan></text><text x="34" y="145" text-anchor="middle" font-size="13" fill="#f59e0b" font-weight="700"><tspan x="34" dy="0">cạnh</tspan><tspan x="34" dy="16.25">đối</tspan></text><text x="178" y="128" text-anchor="middle" font-size="13" fill="#7c3aed" font-weight="700"><tspan x="178" dy="0">cạnh huyền</tspan></text><text x="150" y="262" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="150" dy="0">sin α = đối/huyền  ·  cos α = kề/huyền</tspan></text><text x="150" y="284" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="150" dy="0">tan α = đối/kề  ·  cot α = kề/đối</tspan></text><text x="150" y="306" text-anchor="middle" font-size="11.5" fill="#6b7280" font-style="italic"><tspan x="150" dy="0">"Sin đi học, cos không hư, tan đoàn kết…"</tspan></text><text x="450" y="24" text-anchor="middle" font-size="15" fill="#059669" font-weight="700"><tspan x="450" dy="0">Hệ thức giữa cạnh và góc</tspan></text><polygon points="360,220 560,220 360,80" fill="#d1fae5" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/><polyline points="371,220 371,209 360,209" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M538.7,205.1 A26,26 0 0 0 534,220" fill="none" stroke="#e4572e" stroke-width="2"/><path d="M360,102 A22,22 0 0 0 378,92.6" fill="none" stroke="#2563eb" stroke-width="2"/><text x="348" y="236" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="348" dy="0">A</tspan></text><text x="570" y="236" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="570" dy="0">B</tspan></text><text x="350" y="74" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="350" dy="0">C</tspan></text><text x="460" y="240" text-anchor="middle" font-size="15" fill="#6b7280" font-style="italic"><tspan x="460" dy="0">c</tspan></text><text x="346" y="155" text-anchor="middle" font-size="15" fill="#6b7280" font-style="italic"><tspan x="346" dy="0">b</tspan></text><text x="470" y="140" text-anchor="middle" font-size="15" fill="#6b7280" font-style="italic"><tspan x="470" dy="0">a</tspan></text><text x="450" y="270" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">b = a·sin B = a·cos C</tspan></text><text x="450" y="294" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">b = c·tan B = c·cot C</tspan></text><text x="750" y="24" text-anchor="middle" font-size="15" fill="#f59e0b" font-weight="700"><tspan x="750" dy="0">Ứng dụng: đo chiều cao</tspan></text><rect x="835" y="70" width="30" height="190" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><line x1="650" y1="225" x2="850" y2="225" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/><line x1="650" y1="225" x2="850" y2="70" stroke="#e4572e" stroke-width="2" stroke-linecap="round"/><path d="M684,225 A34,34 0 0 0 676.9,204.2" fill="none" stroke="#e4572e" stroke-width="2"/><text x="700" y="216" text-anchor="middle" font-size="14" fill="#e4572e" font-weight="700"><tspan x="700" dy="0">α</tspan></text><text x="750" y="244" text-anchor="middle" font-size="15" fill="#1f2937" font-style="italic"><tspan x="750" dy="0">d</tspan></text><line x1="650" y1="225" x2="650" y2="260" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><text x="632" y="247" text-anchor="middle" font-size="12" fill="#2563eb"><tspan x="632" dy="0">h₀</tspan></text><line x1="620" y1="260" x2="890" y2="260" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/><text x="750" y="286" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="750" dy="0">Chiều cao = d · tan α + h₀</tspan></text><text x="750" y="306" text-anchor="middle" font-size="12" fill="#6b7280"><tspan x="750" dy="0">(h₀: chiều cao tầm mắt / giác kế)</tspan></text>
</g>
</svg>
