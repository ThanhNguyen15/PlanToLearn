h</tspan><tspan x="355" dy="15">thế giới thứ hai</tspan></text><circle cx="450" cy="145" r="9" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><line x1="450" y1="135" x2="450" y2="107" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/><text x="450" y="99" text-anchor="middle" font-size="13.5" fill="#2563eb" font-weight="700"><tspan x="450" dy="0">10/1945</tspan></text><text x="450" y="63" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="450" dy="0">Liên hợp quốc</tspan><tspan x="450" dy="15">ra đời</tspan></text><circle cx="545" cy="145" r="9" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><line x1="545" y1="155" x2="545" y2="183" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round"/><text x="545" y="201" text-anchor="middle" font-size="13.5" fill="#7c3aed" font-weight="700"><tspan x="545" dy="0">1947</tspan></text><text x="545" y="221" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="545" dy="0">Bắt đầu</tspan><tspan x="545" dy="15">Chiến tranh lạnh</tspan></text><circle cx="640" cy="145" r="9" fill="#059669" stroke="#059669" stroke-width="2"/><line x1="640" y1="135" x2="640" y2="107" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/><text x="640" y="99" text-anchor="middle" font-size="13.5" fill="#059669" font-weight="700"><tspan x="640" dy="0">8/1967</tspan></text><text x="640" y="63" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="640" dy="0">ASEAN</tspan><tspan x="640" dy="15">thành lập</tspan></text><circle cx="735" cy="145" r="9" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><line x1="735" y1="155" x2="735" y2="183" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round"/><text x="735" y="201" text-anchor="middle" font-size="13.5" fill="#7c3aed" font-weight="700"><tspan x="735" dy="0">12/1989</tspan></text><text x="735" y="221" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="735" dy="0">Mỹ – Xô tuyên bố</tspan><tspan x="735" dy="15">chấm dứt Chiến tranh lạnh</tspan></text>