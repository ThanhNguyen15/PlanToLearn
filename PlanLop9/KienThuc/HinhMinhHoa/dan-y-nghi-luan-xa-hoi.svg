<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900" height="392" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="392" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Dàn ý bài văn nghị luận về một vấn đề cần giải quyết</text>
<g transform="translate(0,44)">
<rect x="20" y="8" width="860" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="450" y="38.1" text-anchor="middle" font-size="14.5" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">MỞ BÀI: Giới thiệu vấn đề cần giải quyết + nêu ý kiến của em (cần giải quyết vì sao)</tspan></text><text x="450" y="84" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">THÂN BÀI</tspan></text><rect x="20" y="96" width="206" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="123" y="123.3" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="123" dy="0">Thực trạng</tspan></text><rect x="20" y="144" width="206" height="86" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="123" y="183.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="123" dy="0">Vấn đề biểu hiện thế nào?</tspan><tspan x="123" dy="16.25">Số liệu, ví dụ cụ thể</tspan></text><line x1="227" y1="118" x2="237" y2="118" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="238" y="96" width="206" height="44" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="341" y="123.3" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="341" dy="0">Nguyên nhân</tspan></text><rect x="238" y="144" width="206" height="86" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.5"/><text x="341" y="175.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="341" dy="0">Chủ quan (bản thân)</tspan><tspan x="341" dy="16.25">Khách quan (gia đình,</tspan><tspan x="341" dy="16.25">xã hội, công nghệ)</tspan></text><line x1="445" y1="118" x2="455" y2="118" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="456" y="96" width="206" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="559" y="123.3" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="559" dy="0">Hậu quả</tspan></text><rect x="456" y="144" width="206" height="86" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="559" y="183.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="559" dy="0">Với cá nhân,</tspan><tspan x="559" dy="16.25">gia đình, cộng đồng</tspan></text><line x1="663" y1="118" x2="673" y2="118" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="674" y="96" width="206" height="44" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="777" y="123.3" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="777" dy="0">GIẢI PHÁP ⭐</tspan></text><rect x="674" y="144" width="206" height="86" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="777" y="175.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="777" dy="0">Khả thi, cụ thể:</tspan><tspan x="777" dy="16.25">AI làm? Làm GÌ?</tspan><tspan x="777" dy="16.25">Làm THẾ NÀO?</tspan></text><rect x="20" y="240" width="860" height="40" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="450" y="264.7" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="450" dy="0">Ý kiến trái chiều: nêu và phản bác / bổ sung một cách thuyết phục (giúp bài sâu hơn)</tspan></text><rect x="20" y="290" width="860" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="450" y="320.1" text-anchor="middle" font-size="14.5" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">KẾT BÀI: Khẳng định lại sự cần thiết của giải pháp + lời kêu gọi + hành động của bản thân</tspan></text>
</g>
</svg>
