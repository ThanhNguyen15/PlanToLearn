<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 312" width="900" height="312" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="312" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Chiến tranh lạnh (1947 – 1989)</text>
<g transform="translate(0,44)">
<rect x="8" y="0" width="420" height="190" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><rect x="472" y="0" width="420" height="190" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="218" y="30" text-anchor="middle" font-size="16" fill="#2563eb" font-weight="700"><tspan x="218" dy="0">MỸ VÀ CÁC NƯỚC TƯ BẢN</tspan></text><text x="682" y="30" text-anchor="middle" font-size="16" fill="#e4572e" font-weight="700"><tspan x="682" dy="0">LIÊN XÔ VÀ CÁC NƯỚC XHCN</tspan></text><text x="218" y="70" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="218" dy="0">• Học thuyết Tru-man (3/1947)</tspan><tspan x="218" dy="17.5">• Kế hoạch Mác-san (1947)</tspan><tspan x="218" dy="17.5">• Khối quân sự NATO (1949)</tspan><tspan x="218" dy="17.5">• Chạy đua vũ trang, chiến tranh</tspan><tspan x="218" dy="17.5">  cục bộ (Triều Tiên, Việt Nam…)</tspan></text><text x="682" y="70" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="682" dy="0">• Hội đồng tương trợ kinh tế</tspan><tspan x="682" dy="17.5">  SEV (1949)</tspan><tspan x="682" dy="17.5">• Tổ chức Hiệp ước Vác-sa-va</tspan><tspan x="682" dy="17.5">  (1955)</tspan><tspan x="682" dy="17.5">• Ủng hộ phong trào giải phóng dân tộc</tspan></text><text x="450" y="120" text-anchor="middle" font-size="34" fill="#1f2937"><tspan x="450" dy="0">⚔</tspan></text><text x="450" y="156" text-anchor="middle" font-size="12" fill="#6b7280"><tspan x="450" dy="0">đối đầu</tspan></text><rect x="150" y="204" width="600" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="450" y="228.3" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="450" dy="0">Trật tự thế giới HAI CỰC (Ianta) · Kết thúc: 12/1989 (gặp gỡ Man-ta)</tspan><tspan x="450" dy="16.875">→ Liên Xô tan rã (12/1991) → trật tự đơn cực rồi đa cực</tspan></text>
</g>
</svg>
