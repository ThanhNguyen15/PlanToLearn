<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 394" width="900" height="394" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="394" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Sáu vùng kinh tế – xã hội của Việt Nam: thế mạnh nổi bật</text>
<g transform="translate(0,44)">
<rect x="14" y="8" width="280" height="52" rx="8" fill="#059669" stroke="#059669" stroke-width="1.5"/><text x="154" y="39.1" text-anchor="middle" font-size="14.5" fill="#ffffff" font-weight="700"><tspan x="154" dy="0">Trung du và miền núi Bắc Bộ</tspan></text><rect x="14" y="64" width="280" height="100" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="154" y="102.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="154" dy="0">Khoáng sản (than, apatit), thủy điện</tspan><tspan x="154" dy="16.25">(sông Đà), chè, dược liệu, trâu bò,</tspan><tspan x="154" dy="16.25">du lịch (Sa Pa, Hạ Long)</tspan></text><rect x="310" y="8" width="280" height="52" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="450" y="39.1" text-anchor="middle" font-size="14.5" fill="#ffffff" font-weight="700"><tspan x="450" dy="0">Đồng bằng sông Hồng</tspan></text><rect x="310" y="64" width="280" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="450" y="102.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="450" dy="0">Dân số đông, mật độ cao nhất;</tspan><tspan x="450" dy="16.25">lúa, vụ đông; công nghiệp – dịch vụ</tspan><tspan x="450" dy="16.25">phát triển; Hà Nội, Hải Phòng</tspan></text><rect x="606" y="8" width="280" height="52" rx="8" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/><text x="746" y="30" text-anchor="middle" font-size="14.5" fill="#ffffff" font-weight="700"><tspan x="746" dy="0">Bắc Trung Bộ và Duyên hải</tspan><tspan x="746" dy="18.125">miền Trung</tspan></text><rect x="606" y="64" width="280" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="746" y="102.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="746" dy="0">Kinh tế biển: thủy sản, cảng, du lịch</tspan><tspan x="746" dy="16.25">(Huế, Hội An, Phong Nha – Kẻ Bàng);</tspan><tspan x="746" dy="16.25">nhiều thiên tai: bão, lũ, hạn hán</tspan></text><rect x="14" y="178" width="280" height="52" rx="8" fill="#92400e" stroke="#92400e" stroke-width="1.5"/><text x="154" y="209.1" text-anchor="middle" font-size="14.5" fill="#ffffff" font-weight="700"><tspan x="154" dy="0">Tây Nguyên</tspan></text><rect x="14" y="234" width="280" height="100" rx="8" fill="#fde68a" stroke="#92400e" stroke-width="1.5"/><text x="154" y="272.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="154" dy="0">Đất badan: cà phê (lớn nhất), cao su,</tspan><tspan x="154" dy="16.25">hồ tiêu; thủy điện; bauxite; rừng;</tspan><tspan x="154" dy="16.25">Không gian văn hóa Cồng chiêng</tspan></text><rect x="310" y="178" width="280" height="52" rx="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="450" y="209.1" text-anchor="middle" font-size="14.5" fill="#ffffff" font-weight="700"><tspan x="450" dy="0">Đông Nam Bộ</tspan></text><rect x="310" y="234" width="280" height="100" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="450" y="272.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="450" dy="0">Kinh tế phát triển nhất cả nước;</tspan><tspan x="450" dy="16.25">TP Hồ Chí Minh; dầu khí, công nghiệp,</tspan><tspan x="450" dy="16.25">dịch vụ, xuất khẩu; cao su</tspan></text><rect x="606" y="178" width="280" height="52" rx="8" fill="#0d9488" stroke="#0d9488" stroke-width="1.5"/><text x="746" y="209.1" text-anchor="middle" font-size="14.5" fill="#ffffff" font-weight="700"><tspan x="746" dy="0">Đồng bằng sông Cửu Long</tspan></text><rect x="606" y="234" width="280" height="100" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="746" y="272.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="746" dy="0">Vựa lúa lớn nhất (&gt; 50% sản lượng);</tspan><tspan x="746" dy="16.25">thủy sản (cá tra, tôm), trái cây;</tspan><tspan x="746" dy="16.25">thách thức: xâm nhập mặn, BĐKH</tspan></text>
</g>
</svg>
