n></text><rect x="572" y="216" width="304" height="70" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="724" y="247.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="724" dy="0">Ví dụ quen thuộc: "Quê hương"</tspan><tspan x="724" dy="16.25">(Tế Hanh), "Nhớ rừng" (Thế Lữ)</tspan></text>
