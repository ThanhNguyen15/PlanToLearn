<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 394" width="900" height="394" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="394" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Công thức nghiệm của phương trình bậc hai</text>
<g transform="translate(0,44)">
<rect x="300" y="6" width="300" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="450" y="33.6" text-anchor="middle" font-size="16" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">ax² + bx + c = 0  (a ≠ 0)</tspan></text><line x1="450" y1="50" x2="450" y2="74" stroke="#1f2937" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/><rect x="300" y="76" width="300" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="450" y="104" text-anchor="middle" font-size="17" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">Δ = b² − 4ac</tspan></text><line x1="450" y1="120" x2="150" y2="150" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="20" y="152" width="260" height="34" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="150" y="174.6" text-anchor="middle" font-size="16" fill="#1f2937" font-weight="700"><tspan x="150" dy="0">Δ &gt; 0</tspan></text><rect x="20" y="192" width="260" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="150" y="219.2" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="150" dy="0">Hai nghiệm phân biệt</tspan><tspan x="150" dy="17.5">x₁,₂ = (−b ± √Δ) / 2a</tspan></text><line x1="450" y1="120" x2="450" y2="150" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="320" y="152" width="260" height="34" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="450" y="174.6" text-anchor="middle" font-size="16" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">Δ = 0</tspan></text><rect x="320" y="192" width="260" height="62" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="450" y="219.2" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="450" dy="0">Nghiệm kép</tspan><tspan x="450" dy="17.5">x₁ = x₂ = −b / 2a</tspan></text><line x1="450" y1="120" x2="750" y2="150" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="620" y="152" width="260" height="34" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="750" y="174.6" text-anchor="middle" font-size="16" fill="#1f2937" font-weight="700"><tspan x="750" dy="0">Δ &lt; 0</tspan></text><rect x="620" y="192" width="260" height="62" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.5"/><text x="750" y="219.2" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="750" dy="0">Phương trình</tspan><tspan x="750" dy="17.5">vô nghiệm</tspan></text><rect x="20" y="268" width="860" height="74" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="450" y="292.9" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="450" dy="0">Khi b = 2b' (b chẵn) dùng Δ' = b'² − ac :  Δ' &gt; 0 → x₁,₂ = (−b' ± √Δ') / a ;  Δ' = 0 → x = −b'/a</tspan><tspan x="450" dy="16.875">Mẹo: a và c TRÁI DẤU (ac &lt; 0) ⇒ chắc chắn có 2 nghiệm phân biệt trái dấu.</tspan><tspan x="450" dy="16.875">Phương trình khuyết: ax² + bx = 0 → đặt x làm nhân tử chung ; ax² + c = 0 → x² = −c/a</tspan></text>
</g>
</svg>
