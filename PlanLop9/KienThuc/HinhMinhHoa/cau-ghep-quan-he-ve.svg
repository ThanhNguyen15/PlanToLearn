<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 344" width="900" height="344" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="344" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Câu ghép và các kiểu quan hệ giữa các vế</text>
<g transform="translate(0,44)">
<rect x="20" y="6" width="190" height="38" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="115" y="30" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="115" dy="0">Quan hệ</tspan></text><rect x="210" y="6" width="330" height="38" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="375" y="30" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="375" dy="0">Cặp kết từ / quan hệ từ</tspan></text><rect x="540" y="6" width="340" height="38" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="710" y="30" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="710" dy="0">Ví dụ</tspan></text><rect x="20" y="44" width="190" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="115" y="68" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="115" dy="0">Nguyên nhân – kết quả</tspan></text><rect x="210" y="44" width="330" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="375" y="68" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="375" dy="0">Vì … nên …; Do … nên …; Nhờ … mà …</tspan></text><rect x="540" y="44" width="340" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="710" y="68" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="710" dy="0">Vì trời mưa to nên trận đấu bị hoãn.</tspan></text><rect x="20" y="82" width="190" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="115" y="106" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="115" dy="0">Điều kiện – kết quả</tspan></text><rect x="210" y="82" width="330" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="375" y="106" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="375" dy="0">Nếu … thì …; Hễ … thì …</tspan></text><rect x="540" y="82" width="340" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="710" y="106" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="710" dy="0">Nếu em chăm chỉ thì em sẽ tiến bộ.</tspan></text><rect x="20" y="120" width="190" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="115" y="144" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="115" dy="0">Tương phản</tspan></text><rect x="210" y="120" width="330" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="375" y="144" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="375" dy="0">Tuy … nhưng …; Mặc dù … nhưng …</tspan></text><rect x="540" y="120" width="340" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="710" y="144" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="710" dy="0">Tuy nhà xa nhưng Lan chưa đi muộn.</tspan></text><rect x="20" y="158" width="190" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="115" y="182" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="115" dy="0">Tăng tiến</tspan></text><rect x="210" y="158" width="330" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="375" y="182" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="375" dy="0">Không những … mà còn …; Càng … càng …</tspan></text><rect x="540" y="158" width="340" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="710" y="182" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="710" dy="0">Trời càng về khuya, gió càng lạnh.</tspan></text><rect x="20" y="196" width="190" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="115" y="220" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="115" dy="0">Lựa chọn</tspan></text><rect x="210" y="196" width="330" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="375" y="220" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="375" dy="0">… hay …; hoặc … hoặc …</tspan></text><rect x="540" y="196" width="340" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="710" y="220" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="710" dy="0">Em đi hay anh đi?</tspan></text><rect x="20" y="234" width="190" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="115" y="258" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="115" dy="0">Bổ sung, nối tiếp</tspan></text><rect x="210" y="234" width="330" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="375" y="258" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="375" dy="0">và, rồi, còn; cặp từ hô ứng: vừa … đã …</tspan></text><rect x="540" y="234" width="340" height="38" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="710" y="258" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="710" dy="0">Mưa vừa tạnh, mặt trời đã ló ra.</tspan></text><text x="450" y="290" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="450" dy="0">Câu ghép = từ hai cụm chủ – vị (C – V) trở lên, không bao chứa nhau · Nối các vế bằng kết từ, cặp kết từ, cặp từ hô ứng hoặc dấu câu</tspan></text>
</g>
</svg>
