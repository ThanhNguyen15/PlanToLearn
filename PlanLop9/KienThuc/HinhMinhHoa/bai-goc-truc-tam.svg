<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="384" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Bài gốc lớp 9: hai đường cao và tứ giác nội tiếp</text>
<g transform="translate(0,44)">
<path d="M380,300 A160,160 0 0 0 60,300" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/><text x="220" y="300" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="220" dy="0"> </tspan></text><circle cx="200" cy="121.5" r="81.5" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/><polygon points="200,40 60,300 380,300" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/><line x1="60" y1="300" x2="276.3" y2="150.2" stroke="#e4572e" stroke-width="2" stroke-linecap="round"/><line x1="380" y1="300" x2="131.9" y2="166.4" stroke="#e4572e" stroke-width="2" stroke-linecap="round"/><line x1="200" y1="40" x2="200" y2="300" stroke="#e4572e" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><polyline points="268.1,155.9 273.8,164.2 282,158.5" fill="none" stroke="#e4572e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="127.2,175.2 136,180 140.7,171.2" fill="none" stroke="#e4572e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="209,300 209,291 200,291" fill="none" stroke="#e4572e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="32" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="200" dy="0">A</tspan></text><text x="46" y="308" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="46" dy="0">B</tspan></text><text x="394" y="308" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="394" dy="0">C</tspan></text><text x="290.3" y="148.2" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="290.3" dy="0">E</tspan></text><text x="117.9" y="164.4" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="117.9" dy="0">F</tspan></text><text x="214" y="207.1" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="214" dy="0">H</tspan></text><text x="200" y="320" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="200" dy="0">D</tspan></text><rect x="470" y="10" width="420" height="320" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="486" y="87.4" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="486" dy="0">Cho △ABC nhọn, hai đường cao BE, CF cắt nhau tại H.</tspan><tspan x="486" dy="17.5"> </tspan><tspan x="486" dy="17.5">① BCEF nội tiếp: E, F cùng nhìn BC dưới góc 90°</tspan><tspan x="486" dy="17.5">    → tâm là trung điểm BC (vòng xanh dương)</tspan><tspan x="486" dy="17.5">② AEHF nội tiếp: Ê + F̂ = 90° + 90° = 180°</tspan><tspan x="486" dy="17.5">    → đường tròn đường kính AH (vòng xanh lá)</tspan><tspan x="486" dy="17.5">③ △ABE ∽ △ACF (g.g) ⇒ AE · AC = AF · AB</tspan><tspan x="486" dy="17.5">④ AH ⊥ BC (H là trực tâm, AD là đường cao thứ ba)</tspan><tspan x="486" dy="17.5"> </tspan><tspan x="486" dy="17.5">Mẹo: thấy 2 góc vuông → nghĩ ngay</tspan><tspan x="486" dy="17.5">"tứ giác nội tiếp"!</tspan></text>
</g>
</svg>
