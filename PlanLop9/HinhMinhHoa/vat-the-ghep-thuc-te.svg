<svg xmlns="http://www.w3.org/2000/svg" width="925" height="430" viewBox="0 0 925 430">
<title>Vật thể ghép trong đề thực tế</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="15" y="15" width="440" height="400" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="15" y="15" width="440" height="34" rx="14" fill="#2563eb"/><rect x="15" y="35" width="440" height="14" fill="#2563eb"/><text x="235" y="38" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Bình = trụ + nắp nửa hình cầu</text><path d="M 105 155 A 60 60 0 0 1 225 155" fill="rgba(245,158,11,0.35)" stroke="#1f2937" stroke-width="2"/><path d="M 105 155 L 105 315 A 60 16 0 0 0 225 315 L 225 155" fill="rgba(37,99,235,0.22)" stroke="#1f2937" stroke-width="2"/><ellipse cx="165" cy="155" rx="60" ry="16" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="165" y1="155" x2="225" y2="155" stroke="#e4572e" stroke-width="2"/><text x="195" y="147" font-size="16" fill="#e4572e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">r</text><line x1="243" y1="155" x2="243" y2="315" stroke="#f59e0b" stroke-width="2"/><text x="257" y="235" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">h</text><text x="265" y="135" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">V = V_trụ + V_nửa cầu</text><text x="265" y="160" font-size="15" fill="#2563eb" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">  = πr²h + ⅔πr³</text><text x="265" y="205" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Sơn mặt ngoài:</text><text x="265" y="229" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">S = 2πrh (thân)</text><text x="265" y="251" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">  + πr² (đáy)</text><text x="265" y="273" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">  + 2πr² (nửa cầu)</text><text x="265" y="315" font-size="13" fill="#e4572e" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">⚠ Mặt tiếp giáp trụ–nắp</text><text x="265" y="333" font-size="13" fill="#e4572e" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">KHÔNG tính vào mặt ngoài</text><text x="235" y="390" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Đổi đơn vị: 1 m² = 10 000 cm²</text><rect x="470" y="15" width="440" height="400" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="470" y="15" width="440" height="34" rx="14" fill="#059669"/><rect x="470" y="35" width="440" height="14" fill="#059669"/><text x="690" y="38" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Hộp trụ chứa vừa khít 4 quả bóng</text><path d="M 544 75 L 544 347 A 36 10 0 0 0 616 347 L 616 75" fill="rgba(5,150,105,0.10)" stroke="#1f2937" stroke-width="2"/><ellipse cx="580" cy="75" rx="36" ry="10" fill="rgba(5,150,105,0.25)" stroke="#1f2937" stroke-width="2"/><circle cx="580" cy="109" r="34" fill="#d9f99d" stroke="#65a30d" stroke-width="2"/><path d="M 552 97 Q 580 117 608 97" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="580" cy="177" r="34" fill="#d9f99d" stroke="#65a30d" stroke-width="2"/><path d="M 552 165 Q 580 185 608 165" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="580" cy="245" r="34" fill="#d9f99d" stroke="#65a30d" stroke-width="2"/><path d="M 552 233 Q 580 253 608 233" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="580" cy="313" r="34" fill="#d9f99d" stroke="#65a30d" stroke-width="2"/><path d="M 552 301 Q 580 321 608 301" fill="none" stroke="#fff" stroke-width="2.5"/><line x1="528" y1="75" x2="528" y2="347" stroke="#f59e0b" stroke-width="2"/><text x="522" y="211" font-size="16" fill="#f59e0b" text-anchor="end" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">h = 8r</text><text x="670" y="135" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">V_hộp = πr² · 8r = 8πr³</text><text x="670" y="165" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">V_bóng = 4 · ⁴⁄₃πr³ = ¹⁶⁄₃πr³</text><text x="670" y="210" font-size="16" fill="#059669" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">V_bóng : V_hộp = 2 : 3</text><text x="670" y="237" font-size="15" fill="#059669" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">⇒ phần trống = ⅓ hộp</text><text x="670" y="290" font-size="14" fill="#e4572e" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Mấu chốt: "vừa khít"</text><text x="670" y="313" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">⇒ r_đáy = r_bóng</text><text x="670" y="335" font-size="14" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">⇒ h = số bóng × 2r</text>
</svg>
