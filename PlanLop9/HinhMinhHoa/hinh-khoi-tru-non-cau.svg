<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410">
<title>Hình trụ, hình nón, hình cầu</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="15" y="15" width="300" height="380" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="15" y="15" width="300" height="34" rx="14" fill="#2563eb"/><rect x="15" y="35" width="300" height="14" fill="#2563eb"/><text x="165" y="38" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Hình trụ</text><path d="M 95 95 L 95 245 A 70 20 0 0 0 235 245 L 235 95" fill="rgba(37,99,235,0.22)" stroke="#1f2937" stroke-width="2"/><ellipse cx="165" cy="95" rx="70" ry="20" fill="rgba(37,99,235,0.35)" stroke="#1f2937" stroke-width="2"/><path d="M 95 245 A 70 20 0 0 1 235 245" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="165" y1="245" x2="235" y2="245" stroke="#e4572e" stroke-width="2"/><text x="200" y="239" font-size="16" fill="#e4572e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">r</text><line x1="165" y1="95" x2="165" y2="245" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/><text x="153" y="170" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">h</text><circle cx="165" cy="245" r="3.5" fill="#1f2937"/><circle cx="165" cy="95" r="3.5" fill="#1f2937"/><text x="165" y="305" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">S_xq = 2πrh</text><text x="165" y="331" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">S_tp = 2πrh + 2πr²</text><text x="165" y="363" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">V = πr²h</text><rect x="330" y="15" width="300" height="380" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="330" y="15" width="300" height="34" rx="14" fill="#e4572e"/><rect x="330" y="35" width="300" height="14" fill="#e4572e"/><text x="480" y="38" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Hình nón</text><path d="M 400 245 L 480 80 L 560 245 A 80 22 0 0 1 400 245" fill="rgba(228,87,46,0.25)" stroke="#1f2937" stroke-width="2"/><path d="M 400 245 A 80 22 0 0 1 560 245" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="480" y1="245" x2="560" y2="245" stroke="#2563eb" stroke-width="2"/><text x="520" y="239" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">r</text><line x1="480" y1="80" x2="480" y2="245" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/><text x="468" y="172.5" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">h</text><polyline points="480,235 490,235 490,245" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="536" y="162.5" font-size="18" fill="#7c3aed" text-anchor="middle" font-weight="bold" font-style="italic" font-family="Segoe UI, Arial, sans-serif">l</text><text x="480" y="305" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">S_xq = πrl  ( l² = r² + h² )</text><text x="480" y="331" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">S_tp = πrl + πr²</text><text x="480" y="363" font-size="18" fill="#e4572e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">V = ⅓πr²h</text><rect x="645" y="15" width="300" height="380" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="645" y="15" width="300" height="34" rx="14" fill="#059669"/><rect x="645" y="35" width="300" height="14" fill="#059669"/><text x="795" y="38" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Hình cầu</text><circle cx="795" cy="165" r="85" fill="rgba(5,150,105,0.22)" stroke="#1f2937" stroke-width="2"/><path d="M 710 165 A 85 24 0 0 0 880 165" fill="none" stroke="#1f2937" stroke-width="1.5"/><path d="M 710 165 A 85 24 0 0 1 880 165" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="795" y1="165" x2="880" y2="165" stroke="#e4572e" stroke-width="2"/><circle cx="795" cy="165" r="3.5" fill="#1f2937"/><text x="837.5" y="157" font-size="16" fill="#e4572e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">R</text><text x="795" y="305" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">S = 4πR²</text><text x="795" y="331" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">(= 4 lần diện tích hình tròn lớn)</text><text x="795" y="363" font-size="18" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">V = ⁴⁄₃πR³</text>
</svg>
