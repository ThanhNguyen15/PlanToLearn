ns-serif">c) BH ∥ KC, CH ∥ KB ⇒ BHCK là hình bình hành</text><rect x="40" y="486" width="14" height="14" fill="#f59e0b" rx="3"/><text x="64" y="498" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">d) M là trung điểm HK, O trung điểm AK ⇒ AH = 2·OM</text>
