<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 208" width="900" height="208" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="208" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Bốn bước xử lí tình huống môn Giáo dục công dân</text>
<g transform="translate(0,44)">
<rect x="14" y="10" width="200" height="44" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="114" y="37.6" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="700"><tspan x="114" dy="0">1. Đọc kĩ</tspan></text><rect x="14" y="58" width="200" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="114" y="89.3" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="114" dy="0">Ai? Làm gì?</tspan><tspan x="114" dy="16.875">Hành vi đúng hay sai?</tspan></text><line x1="216" y1="32" x2="234" y2="32" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="236" y="10" width="200" height="44" rx="8" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/><text x="336" y="37.6" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="700"><tspan x="336" dy="0">2. Nhận xét</tspan></text><rect x="236" y="58" width="200" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="336" y="89.3" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="336" dy="0">Hành vi thể hiện / vi</tspan><tspan x="336" dy="16.875">phạm phẩm chất, luật gì?</tspan></text><line x1="438" y1="32" x2="456" y2="32" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="458" y="10" width="200" height="44" rx="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/><text x="558" y="37.6" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="700"><tspan x="558" dy="0">3. Giải thích</tspan></text><rect x="458" y="58" width="200" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="558" y="89.3" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="558" dy="0">Vì sao? Hậu quả</tspan><tspan x="558" dy="16.875">với bản thân, người khác</tspan></text><line x1="660" y1="32" x2="678" y2="32" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="680" y="10" width="200" height="44" rx="8" fill="#059669" stroke="#059669" stroke-width="1.5"/><text x="780" y="37.6" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="700"><tspan x="780" dy="0">4. Đề xuất</tspan></text><rect x="680" y="58" width="200" height="70" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="780" y="89.3" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="780" dy="0">Nếu là bạn đó / là em,</tspan><tspan x="780" dy="16.875">em sẽ làm gì? (cụ thể)</tspan></text><text x="450" y="152" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="450" dy="0">Mẫu câu: "Em đồng tình / không đồng tình với việc làm của bạn … vì … Nếu là …, em sẽ …"</tspan></text>
</g>
</svg>
