<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 364" width="900" height="364" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="364" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Đo cung, hình quạt tròn và hình vành khuyên</text>
<g transform="translate(0,44)">
<rect x="6" y="0" width="288" height="290" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="150" y="24" text-anchor="middle" font-size="15" fill="#e4572e" font-weight="700"><tspan x="150" dy="0">Độ dài cung n°</tspan></text><text x="150" y="270" text-anchor="middle" font-size="15" fill="#e4572e" font-weight="700"><tspan x="150" dy="0">ℓ = πRn / 180</tspan></text><circle cx="150" cy="145" r="85" fill="none" stroke="#6b7280" stroke-width="1.5"/><path d="M229.9,115.9 A85,85 0 0 0 107.5,71.4" fill="none" stroke="#e4572e" stroke-width="6"/><line x1="150" y1="145" x2="229.9" y2="115.9" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/><line x1="150" y1="145" x2="107.5" y2="71.4" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/><path d="M170.7,137.5 A22,22 0 0 0 139,125.9" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="156" y="115" text-anchor="middle" font-size="13" fill="#f59e0b" font-weight="700"><tspan x="156" dy="0">n°</tspan></text><text x="120" y="180" text-anchor="middle" font-size="14" fill="#1f2937" font-style="italic"><tspan x="120" dy="0">R</tspan></text><circle cx="150" cy="145" r="3.5" fill="#1f2937"/><rect x="306" y="0" width="288" height="290" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="450" y="24" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700"><tspan x="450" dy="0">Diện tích hình quạt</tspan></text><text x="450" y="270" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700"><tspan x="450" dy="0">S = πR²n / 360 = ℓR / 2</tspan></text><circle cx="450" cy="145" r="85" fill="none" stroke="#6b7280" stroke-width="1.5"/><path d="M450,145 L529.9,115.9 A85,85 0 0 0 407.5,71.4 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="454" y="105" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="700"><tspan x="454" dy="0">n°</tspan></text><circle cx="450" cy="145" r="3.5" fill="#1f2937"/><rect x="606" y="0" width="288" height="290" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="750" y="24" text-anchor="middle" font-size="15" fill="#059669" font-weight="700"><tspan x="750" dy="0">Hình vành khuyên</tspan></text><text x="750" y="270" text-anchor="middle" font-size="15" fill="#059669" font-weight="700"><tspan x="750" dy="0">S = π(R² − r²)</tspan></text><circle cx="750" cy="145" r="90" fill="#d1fae5" stroke="#059669" stroke-width="2"/><circle cx="750" cy="145" r="50" fill="#ffffff" stroke="#059669" stroke-width="2"/><circle cx="750" cy="145" r="3.5" fill="#1f2937"/><line x1="750" y1="145" x2="827.9" y2="100" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/><text x="803.5" y="96.8" text-anchor="middle" font-size="14" fill="#1f2937" font-style="italic"><tspan x="803.5" dy="0">R</tspan></text><line x1="750" y1="145" x2="703" y2="162.1" stroke="#e4572e" stroke-width="1.5" stroke-linecap="round"/><text x="720.1" y="147.6" text-anchor="middle" font-size="14" fill="#e4572e" font-style="italic"><tspan x="720.1" dy="0">r</tspan></text><text x="450" y="310" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="450" dy="0">Chu vi đường tròn C = 2πR · Diện tích hình tròn S = πR²  ·  π ≈ 3,14</tspan></text>
</g>
</svg>
