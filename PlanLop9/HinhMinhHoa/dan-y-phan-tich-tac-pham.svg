<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 389" width="900" height="389" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="389" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Dàn ý bài văn nghị luận phân tích tác phẩm văn học</text>
<g transform="translate(0,44)">
<rect x="8" y="0" width="438" height="340" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><rect x="454" y="0" width="438" height="340" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="227" y="26" text-anchor="middle" font-size="16" fill="#2563eb" font-weight="700"><tspan x="227" dy="0">Phân tích một tác phẩm TRUYỆN</tspan></text><text x="673" y="26" text-anchor="middle" font-size="16" fill="#f59e0b" font-weight="700"><tspan x="673" dy="0">Phân tích một bài / đoạn THƠ</tspan></text><rect x="24" y="42" width="406" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="227" y="65.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="227" dy="0">MB: tác giả, tác phẩm, vấn đề nghị luận</tspan><tspan x="227" dy="16.25">(chủ đề / nhân vật cần phân tích)</tspan></text><rect x="24" y="104" width="406" height="160" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="40" y="139.8" text-anchor="start" font-size="13" fill="#1f2937"><tspan x="40" dy="0">TB:</tspan><tspan x="40" dy="16.25">① Tóm tắt ngắn, nêu tình huống truyện</tspan><tspan x="40" dy="16.25">② Phân tích chủ đề qua nhân vật, sự việc</tspan><tspan x="40" dy="16.25">    (luận điểm → dẫn chứng → phân tích)</tspan><tspan x="40" dy="16.25">③ Phân tích nghệ thuật: cốt truyện, ngôi kể,</tspan><tspan x="40" dy="16.25">    chi tiết tiêu biểu, yếu tố kì ảo…</tspan><tspan x="40" dy="16.25">④ Đánh giá: giá trị nội dung, giá trị nghệ thuật</tspan></text><rect x="24" y="272" width="406" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="227" y="296.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="227" dy="0">KB: khẳng định giá trị, ý nghĩa</tspan><tspan x="227" dy="16.25">tác phẩm với bản thân / cuộc sống</tspan></text><rect x="470" y="42" width="406" height="54" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="673" y="65.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="673" dy="0">MB: tác giả, bài thơ (hoàn cảnh sáng tác),</tspan><tspan x="673" dy="16.25">ấn tượng chung</tspan></text><rect x="470" y="104" width="406" height="160" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="486" y="147.9" text-anchor="start" font-size="13" fill="#1f2937"><tspan x="486" dy="0">TB: phân tích theo KHỔ / theo MẠCH CẢM XÚC</tspan><tspan x="486" dy="16.25">• Trích thơ → chỉ từ ngữ, hình ảnh đặc sắc</tspan><tspan x="486" dy="16.25">• Gọi tên biện pháp tu từ + tác dụng</tspan><tspan x="486" dy="16.25">• Vần, nhịp, thể thơ góp phần thể hiện cảm xúc</tspan><tspan x="486" dy="16.25">• Cảm xúc, tình cảm của nhân vật trữ tình</tspan><tspan x="486" dy="16.25">Đánh giá: nội dung + nghệ thuật</tspan></text><rect x="470" y="272" width="406" height="56" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="673" y="296.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="673" dy="0">KB: khái quát giá trị, cảm nghĩ</tspan><tspan x="673" dy="16.25">của em về bài thơ</tspan></text>
</g>
</svg>
