<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 379" width="900" height="379" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="379" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Năng lượng cơ học: con lắc đơn dao động</text>
<g transform="translate(0,44)">
<rect x="8" y="0" width="470" height="330" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><line x1="150" y1="30" x2="336" y2="30" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/><circle cx="243" cy="30" r="4" fill="#1f2937"/><line x1="243" y1="30" x2="101.6" y2="198.5" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><circle cx="101.6" cy="198.5" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="101.6" y="203.5" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="700"><tspan x="101.6" dy="0">A</tspan></text><line x1="243" y1="30" x2="243" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/><circle cx="243" cy="250" r="16" fill="#fde2da" stroke="#e4572e" stroke-width="2"/><text x="243" y="255" text-anchor="middle" font-size="14" fill="#e4572e" font-weight="700"><tspan x="243" dy="0">B</tspan></text><line x1="243" y1="30" x2="384.4" y2="198.5" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><circle cx="384.4" cy="198.5" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="384.4" y="203.5" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="700"><tspan x="384.4" dy="0">C</tspan></text><path d="M101.6,198.5 A220,220 0 0 0 243,250" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 4" stroke-linejoin="round" stroke-linecap="round"/><line x1="50" y1="198.5" x2="100" y2="198.5" stroke="#6b7280" stroke-width="1" stroke-linecap="round"/><line x1="50" y1="250" x2="200" y2="250" stroke="#6b7280" stroke-width="1" stroke-linecap="round"/><line x1="70" y1="250" x2="70" y2="198.5" stroke="#059669" stroke-width="1.8" marker-end="url(#ah-green)" stroke-linecap="round"/><text x="56" y="228.3" text-anchor="middle" font-size="14" fill="#059669" font-weight="700" font-style="italic"><tspan x="56" dy="0">h</tspan></text><text x="80" y="90" text-anchor="middle" font-size="12.5" fill="#2563eb"><tspan x="80" dy="0">A, C: cao nhất</tspan><tspan x="80" dy="15.625">Wt lớn nhất</tspan><tspan x="80" dy="15.625">Wđ = 0 (v = 0)</tspan></text><text x="243" y="290" text-anchor="middle" font-size="12.5" fill="#e4572e" font-weight="700"><tspan x="243" dy="0">B: thấp nhất → Wt nhỏ nhất, Wđ lớn nhất (v lớn nhất)</tspan></text><text x="243" y="312" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="243" dy="0">A → B: Wt chuyển hóa thành Wđ · B → C: Wđ chuyển hóa thành Wt</tspan></text><rect x="492" y="0" width="400" height="330" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="508" y="70.4" text-anchor="start" font-size="14.5" fill="#1f2937"><tspan x="508" dy="0">Động năng:  Wđ = ½·m·v²</tspan><tspan x="508" dy="18.125">   (m: kg; v: m/s; Wđ: J)</tspan><tspan x="508" dy="18.125"> </tspan><tspan x="508" dy="18.125">Thế năng trọng trường:  Wt = P·h = 10·m·h</tspan><tspan x="508" dy="18.125">   (h: độ cao so với mốc, m)</tspan><tspan x="508" dy="18.125"> </tspan><tspan x="508" dy="18.125">Cơ năng:  W = Wđ + Wt</tspan><tspan x="508" dy="18.125">   Bỏ qua ma sát, lực cản → W KHÔNG ĐỔI</tspan><tspan x="508" dy="18.125"> </tspan><tspan x="508" dy="18.125">Công:  A = F·s  (J)</tspan><tspan x="508" dy="18.125">Công suất:  P = A / t  (W)</tspan><tspan x="508" dy="18.125">   1 kW = 1000 W ; 1 HP ≈ 746 W</tspan></text>
</g>
</svg>
