<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900" height="356" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="356" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Lai một cặp tính trạng và khung Punnett</text>
<g transform="translate(0,44)">
<text x="220" y="18" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="220" dy="0">Mendel: lai một cặp tính trạng (đậu Hà Lan)</tspan></text><rect x="20" y="34" width="400" height="40" rx="8" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.5"/><text x="220" y="58.9" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="220" dy="0">P (thuần chủng): Hoa đỏ AA  ×  Hoa trắng aa</tspan></text><line x1="220" y1="76" x2="220" y2="96" stroke="#1f2937" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/><rect x="20" y="98" width="400" height="40" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="220" y="122.9" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="220" dy="0">F₁: 100% Aa (hoa đỏ) – đỏ là TRỘI</tspan></text><line x1="220" y1="140" x2="220" y2="160" stroke="#1f2937" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/><rect x="20" y="162" width="400" height="40" rx="8" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.5"/><text x="220" y="186.9" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="220" dy="0">F₁ × F₁:  Aa × Aa</tspan></text><rect x="20" y="214" width="400" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="220" y="245.9" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="220" dy="0">F₂: kiểu gene 1 AA : 2 Aa : 1 aa</tspan><tspan x="220" dy="18.75">kiểu hình 3 đỏ : 1 trắng</tspan></text><text x="610" y="40" text-anchor="middle" font-size="13" fill="#2563eb" font-weight="700"><tspan x="610" dy="0">Giao tử F₁ (♂)</tspan></text><text x="470" y="165" text-anchor="middle" font-size="16" fill="#e4572e" font-weight="700"><tspan x="470" dy="0">♀</tspan></text><text x="565" y="62" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="700"><tspan x="565" dy="0">A</tspan></text><text x="502" y="121" text-anchor="middle" font-size="18" fill="#e4572e" font-weight="700"><tspan x="502" dy="0">A</tspan></text><text x="655" y="62" text-anchor="middle" font-size="18" fill="#2563eb" font-weight="700"><tspan x="655" dy="0">a</tspan></text><text x="502" y="211" text-anchor="middle" font-size="18" fill="#e4572e" font-weight="700"><tspan x="502" dy="0">a</tspan></text><rect x="520" y="70" width="90" height="90" rx="0" fill="#fde2da" stroke="#334155" stroke-width="1.5"/><text x="565" y="117" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="565" dy="0">AA</tspan></text><text x="565" y="139" text-anchor="middle" font-size="12" fill="#e4572e"><tspan x="565" dy="0">đỏ</tspan></text><rect x="610" y="70" width="90" height="90" rx="0" fill="#fde2da" stroke="#334155" stroke-width="1.5"/><text x="655" y="117" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="655" dy="0">Aa</tspan></text><text x="655" y="139" text-anchor="middle" font-size="12" fill="#e4572e"><tspan x="655" dy="0">đỏ</tspan></text><rect x="520" y="160" width="90" height="90" rx="0" fill="#fde2da" stroke="#334155" stroke-width="1.5"/><text x="565" y="207" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="565" dy="0">Aa</tspan></text><text x="565" y="229" text-anchor="middle" font-size="12" fill="#e4572e"><tspan x="565" dy="0">đỏ</tspan></text><rect x="610" y="160" width="90" height="90" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1.5"/><text x="655" y="207" text-anchor="middle" font-size="20" fill="#1f2937" font-weight="700"><tspan x="655" dy="0">aa</tspan></text><text x="655" y="229" text-anchor="middle" font-size="12" fill="#6b7280"><tspan x="655" dy="0">trắng</tspan></text><text x="610" y="280" text-anchor="middle" font-size="13" fill="#6b7280"><tspan x="610" dy="0">Khung Punnett</tspan></text><text x="450" y="302" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="450" dy="0">Quy luật phân li: mỗi tính trạng do một cặp nhân tố di truyền (cặp allele) quy định; khi tạo giao tử, mỗi allele phân li về một giao tử</tspan></text>
</g>
</svg>
