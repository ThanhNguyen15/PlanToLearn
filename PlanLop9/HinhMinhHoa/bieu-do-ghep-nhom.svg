<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<title>Biểu đồ tần số ghép nhóm</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="380" y="30" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Mẫu số liệu ghép nhóm: chiều cao 40 học sinh (cm) – số liệu minh họa</text><line x1="80" y1="320" x2="600" y2="320" stroke="#1f2937" stroke-width="2"/><line x1="80" y1="320" x2="80" y2="70" stroke="#1f2937" stroke-width="2"/><line x1="75" y1="320" x2="580" y2="320" stroke="#e5e7eb" stroke-width="1"/><text x="64" y="325" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">0</text><line x1="75" y1="288" x2="580" y2="288" stroke="#e5e7eb" stroke-width="1"/><text x="64" y="293" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2</text><line x1="75" y1="256" x2="580" y2="256" stroke="#e5e7eb" stroke-width="1"/><text x="64" y="261" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">4</text><line x1="75" y1="224" x2="580" y2="224" stroke="#e5e7eb" stroke-width="1"/><text x="64" y="229" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">6</text><line x1="75" y1="192" x2="580" y2="192" stroke="#e5e7eb" stroke-width="1"/><text x="64" y="197" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">8</text><line x1="75" y1="160" x2="580" y2="160" stroke="#e5e7eb" stroke-width="1"/><text x="64" y="165" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">10</text><line x1="75" y1="128" x2="580" y2="128" stroke="#e5e7eb" stroke-width="1"/><text x="64" y="133" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">12</text><line x1="75" y1="96" x2="580" y2="96" stroke="#e5e7eb" stroke-width="1"/><text x="64" y="101" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">14</text><rect x="80" y="240" width="100" height="80" fill="rgba(37,99,235,0.41666666666666663)" stroke="#fff" stroke-width="2"/><text x="130" y="234" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">5</text><text x="130" y="340" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">[150;155)</text><text x="130" y="285" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">12,5%</text><rect x="180" y="176" width="100" height="144" fill="rgba(37,99,235,0.55)" stroke="#fff" stroke-width="2"/><text x="230" y="170" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">9</text><text x="230" y="340" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">[155;160)</text><text x="230" y="253" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">22,5%</text><rect x="280" y="96" width="100" height="224" fill="rgba(37,99,235,0.7166666666666667)" stroke="#fff" stroke-width="2"/><text x="330" y="90" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">14</text><text x="330" y="340" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">[160;165)</text><text x="330" y="213" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">35%</text><rect x="380" y="192" width="100" height="128" fill="rgba(37,99,235,0.5166666666666666)" stroke="#fff" stroke-width="2"/><text x="430" y="186" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">8</text><text x="430" y="340" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">[165;170)</text><text x="430" y="261" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">20%</text><rect x="480" y="256" width="100" height="64" fill="rgba(37,99,235,0.3833333333333333)" stroke="#fff" stroke-width="2"/><text x="530" y="250" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">4</text><text x="530" y="340" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">[170;175)</text><text x="530" y="293" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">10%</text><text x="330" y="366" font-size="14" fill="#e4572e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Các cột SÁT NHAU (khác biểu đồ cột thường)</text><text x="620" y="90" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Nhóm [a; b): gồm a, KHÔNG gồm b</text><text x="620" y="114" font-size="14" fill="#2563eb" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Độ dài nhóm = b − a = 5</text><text x="620" y="138" font-size="14" fill="#2563eb" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Giá trị đại diện = (a + b)/2</text><text x="620" y="162" font-size="14" fill="#2563eb" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif"></text><text x="620" y="186" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Tần số tương đối nhóm</text><text x="620" y="210" font-size="14" fill="#2563eb" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">= tần số / tổng số × 100%</text><text x="620" y="234" font-size="14" fill="#2563eb" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Ví dụ [160;165): 14/40 = 35%</text><text x="620" y="258" font-size="14" fill="#2563eb" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif"></text><text x="620" y="282" font-size="14" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">P(“cao từ 160 cm trở lên”)</text><text x="620" y="306" font-size="14" fill="#2563eb" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">= (14 + 8 + 4)/40 = 0,65</text>
</svg>
