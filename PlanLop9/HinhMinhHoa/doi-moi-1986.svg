<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 378" width="900" height="378" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="378" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Công cuộc Đổi mới ở Việt Nam từ năm 1986</text>
<g transform="translate(0,44)">
<rect x="300" y="8" width="300" height="56" rx="8" fill="#e4572e" stroke="#e4572e" stroke-width="1.5"/><text x="450" y="42" text-anchor="middle" font-size="17" fill="#ffffff" font-weight="700"><tspan x="450" dy="0">ĐỔI MỚI (Đại hội VI – 12/1986)</tspan></text><line x1="450" y1="66" x2="154" y2="86" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="14" y="88" width="280" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="154" y="113.3" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="154" dy="0">Kinh tế (trọng tâm)</tspan></text><rect x="14" y="132" width="280" height="120" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="30" y="164.1" text-anchor="start" font-size="13" fill="#1f2937"><tspan x="30" dy="0">• Xóa cơ chế tập trung,</tspan><tspan x="30" dy="16.25">  quan liêu, bao cấp</tspan><tspan x="30" dy="16.25">• Kinh tế thị trường định hướng</tspan><tspan x="30" dy="16.25">  XHCN, nhiều thành phần</tspan><tspan x="30" dy="16.25">• Công nghiệp hóa, hiện đại hóa</tspan></text><line x1="450" y1="66" x2="450" y2="86" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="310" y="88" width="280" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="450" y="113.3" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">Chính trị</tspan></text><rect x="310" y="132" width="280" height="120" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="326" y="172.2" text-anchor="start" font-size="13" fill="#1f2937"><tspan x="326" dy="0">• Xây dựng Nhà nước pháp quyền</tspan><tspan x="326" dy="16.25">  XHCN của dân, do dân, vì dân</tspan><tspan x="326" dy="16.25">• Phát huy dân chủ</tspan><tspan x="326" dy="16.25">• Đại đoàn kết dân tộc</tspan></text><line x1="450" y1="66" x2="746" y2="86" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="606" y="88" width="280" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="746" y="113.3" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="746" dy="0">Đối ngoại</tspan></text><rect x="606" y="132" width="280" height="120" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="622" y="164.1" text-anchor="start" font-size="13" fill="#1f2937"><tspan x="622" dy="0">• Hòa bình, hữu nghị, đa phương</tspan><tspan x="622" dy="16.25">  hóa, đa dạng hóa</tspan><tspan x="622" dy="16.25">• Gia nhập ASEAN (1995), APEC</tspan><tspan x="622" dy="16.25">  (1998), WTO (2007)</tspan><tspan x="622" dy="16.25">• Bình thường hóa quan hệ với Mỹ (1995)</tspan></text><rect x="14" y="266" width="872" height="60" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="30" y="292.4" text-anchor="start" font-size="13" fill="#1f2937"><tspan x="30" dy="0">Thành tựu: từ nước thiếu lương thực → xuất khẩu gạo hàng đầu thế giới; thoát khỏi nhóm nước thu nhập thấp (2008);</tspan><tspan x="30" dy="16.25">tỉ lệ hộ nghèo giảm mạnh; vị thế quốc tế nâng cao. Hạn chế: chênh lệch giàu nghèo, ô nhiễm môi trường, tham nhũng…</tspan></text>
</g>
</svg>
