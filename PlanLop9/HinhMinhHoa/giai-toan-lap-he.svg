<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="384" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Giải bài toán bằng cách lập hệ phương trình (4 bước)</text>
<g transform="translate(0,44)">
<rect x="14" y="10" width="200" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="114" y="40" text-anchor="middle" font-size="17" fill="#2563eb" font-weight="700"><tspan x="114" dy="0">1. Chọn ẩn</tspan></text><text x="114" y="74" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="114" dy="0">Gọi x, y là …</tspan><tspan x="114" dy="16.875">(đơn vị, điều kiện)</tspan></text><line x1="216" y1="70" x2="234" y2="70" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="236" y="10" width="200" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="336" y="40" text-anchor="middle" font-size="17" fill="#f59e0b" font-weight="700"><tspan x="336" dy="0">2. Lập hệ</tspan></text><text x="336" y="74" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="336" dy="0">Biểu diễn các đại lượng</tspan><tspan x="336" dy="16.875">qua ẩn → 2 phương trình</tspan></text><line x1="438" y1="70" x2="456" y2="70" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="458" y="10" width="200" height="120" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="558" y="40" text-anchor="middle" font-size="17" fill="#059669" font-weight="700"><tspan x="558" dy="0">3. Giải hệ</tspan></text><text x="558" y="74" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="558" dy="0">Thế hoặc cộng đại số</tspan><tspan x="558" dy="16.875">(kiểm tra bằng máy tính)</tspan></text><line x1="660" y1="70" x2="678" y2="70" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="680" y="10" width="200" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="780" y="40" text-anchor="middle" font-size="17" fill="#7c3aed" font-weight="700"><tspan x="780" dy="0">4. Trả lời</tspan></text><text x="780" y="74" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="780" dy="0">Đối chiếu điều kiện,</tspan><tspan x="780" dy="16.875">ghi rõ đơn vị</tspan></text><rect x="60" y="150" width="230" height="30" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="175" y="170" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="175" dy="0">Dạng bài</tspan></text><rect x="290" y="150" width="550" height="30" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="565" y="170" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="565" dy="0">Công thức chìa khóa</tspan></text><rect x="60" y="180" width="230" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="175" y="200" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="175" dy="0">Chuyển động</tspan></text><rect x="290" y="180" width="550" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="565" y="200" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="565" dy="0">s = v · t ; xuôi dòng v + v_nước, ngược dòng v − v_nước</tspan></text><rect x="60" y="210" width="230" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="175" y="230" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="175" dy="0">Làm chung công việc</tspan></text><rect x="290" y="210" width="550" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="565" y="230" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="565" dy="0">1 giờ làm được 1/x công việc; cả hai: 1/x + 1/y</tspan></text><rect x="60" y="240" width="230" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="175" y="260" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="175" dy="0">Phần trăm, tăng giảm</tspan></text><rect x="290" y="240" width="550" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="565" y="260" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="565" dy="0">tăng a% → nhân (1 + a%) ; giảm a% → nhân (1 − a%)</tspan></text><rect x="60" y="270" width="230" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="175" y="290" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="175" dy="0">Số có hai chữ số</tspan></text><rect x="290" y="270" width="550" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="565" y="290" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="565" dy="0">số ab (hai chữ số a, b) = 10a + b (1 ≤ a ≤ 9; 0 ≤ b ≤ 9)</tspan></text><rect x="60" y="300" width="230" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="175" y="320" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="175" dy="0">Hình học</tspan></text><rect x="290" y="300" width="550" height="30" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="565" y="320" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="565" dy="0">chu vi, diện tích, định lí Pythagore</tspan></text>
</g>
</svg>
