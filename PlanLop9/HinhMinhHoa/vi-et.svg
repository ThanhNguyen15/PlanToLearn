<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 328" width="900" height="328" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="328" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Định lí Viète và ứng dụng</text>
<g transform="translate(0,44)">
<rect x="14" y="8" width="420" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="30" y="54.5" text-anchor="start" font-size="15" fill="#1f2937"><tspan x="30" dy="0">Nếu x₁, x₂ là hai nghiệm của ax² + bx + c = 0 thì:</tspan><tspan x="30" dy="18.75"> </tspan><tspan x="30" dy="18.75">S = x₁ + x₂ = −b/a   ·   P = x₁ · x₂ = c/a</tspan></text><rect x="466" y="8" width="420" height="120" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="482" y="46.7" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="482" dy="0">Nhẩm nghiệm:</tspan><tspan x="482" dy="17.5">• a + b + c = 0 → x₁ = 1 ; x₂ = c/a</tspan><tspan x="482" dy="17.5">• a − b + c = 0 → x₁ = −1 ; x₂ = −c/a</tspan><tspan x="482" dy="17.5">• Hai số có tổng S, tích P là nghiệm của X² − SX + P = 0</tspan></text><rect x="14" y="144" width="420" height="130" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="30" y="178.9" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="30" dy="0">Biểu thức đối xứng thường gặp:</tspan><tspan x="30" dy="17.5">• x₁² + x₂² = S² − 2P</tspan><tspan x="30" dy="17.5">• 1/x₁ + 1/x₂ = S / P</tspan><tspan x="30" dy="17.5">• (x₁ − x₂)² = S² − 4P</tspan><tspan x="30" dy="17.5">• x₁³ + x₂³ = S³ − 3SP</tspan></text><rect x="466" y="144" width="420" height="130" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="482" y="178.9" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="482" dy="0">Điều kiện về dấu nghiệm:</tspan><tspan x="482" dy="17.5">• Hai nghiệm trái dấu ⇔ ac &lt; 0</tspan><tspan x="482" dy="17.5">• Hai nghiệm dương ⇔ Δ ≥ 0, S &gt; 0, P &gt; 0</tspan><tspan x="482" dy="17.5">• Hai nghiệm âm ⇔ Δ ≥ 0, S &lt; 0, P &gt; 0</tspan><tspan x="482" dy="17.5">⚠ Luôn kiểm tra Δ ≥ 0 TRƯỚC khi dùng Viète</tspan></text>
</g>
</svg>
