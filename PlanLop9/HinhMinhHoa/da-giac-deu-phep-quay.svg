<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
<title>Đa giác đều và phép quay</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="330" y="32" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Đa giác đều và phép quay (GDPT 2018 – lớp 9)</text><circle cx="190" cy="220" r="130" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="5 5"/><polygon points="190,90 77.4,155 77.4,285 190,350 302.6,285 302.6,155" fill="rgba(37,99,235,0.22)" stroke="#2563eb" stroke-width="2.5"/><line x1="190" y1="220" x2="190" y2="90" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 4"/><line x1="190" y1="220" x2="77.4" y2="155" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 4"/><line x1="190" y1="220" x2="77.4" y2="285" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 4"/><line x1="190" y1="220" x2="190" y2="350" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 4"/><line x1="190" y1="220" x2="302.6" y2="285" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 4"/><line x1="190" y1="220" x2="302.6" y2="155" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 4"/><circle cx="190" cy="90" r="3.5" fill="#1f2937"/><text x="190" y="78" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">A</text><circle cx="77.4" cy="155" r="3.5" fill="#1f2937"/><text x="61.8" y="152" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">B</text><circle cx="77.4" cy="285" r="3.5" fill="#1f2937"/><text x="61.8" y="300" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">C</text><circle cx="190" cy="350" r="3.5" fill="#1f2937"/><text x="190" y="374" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">D</text><circle cx="302.6" cy="285" r="3.5" fill="#1f2937"/><text x="318.2" y="300" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">E</text><circle cx="302.6" cy="155" r="3.5" fill="#1f2937"/><text x="318.2" y="152" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">F</text><circle cx="190" cy="220" r="3.5" fill="#1f2937"/><text x="204" y="226" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">O</text><defs><marker id="ar" markerWidth="5" markerHeight="5" refX="3" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#e4572e"/></marker></defs><path d="M 184.8,160.2 A 60 60 0 0 0 140.9,185.6" fill="none" stroke="#e4572e" stroke-width="3" marker-end="url(#ar)"/><text x="158" y="162" font-size="16" fill="#e4572e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">60°</text><text x="360" y="100" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Phép quay tâm O góc 60° (ngược chiều kim đồng hồ):</text><text x="360" y="126" font-size="15" fill="#e4572e" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">A → B, B → C, …, F → A</text><text x="360" y="152" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">⇒ lục giác đều “trùng lại chính nó”</text><text x="360" y="178" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif"></text><text x="360" y="204" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">n-giác đều: các phép quay giữ nguyên hình</text><text x="360" y="230" font-size="15" fill="#2563eb" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">có góc  α = k · 360°/n  (k = 1, 2, …, n)</text><text x="360" y="256" font-size="15" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif"></text><text x="360" y="282" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Mỗi góc trong:  (n − 2) · 180° / n</text><text x="360" y="308" font-size="15" fill="#059669" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Lục giác đều cạnh a:  R = a,  S = 6 · (a²√3 / 4)</text><text x="360" y="334" font-size="15" fill="#059669" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Tam giác đều cạnh a:  R = a√3 / 3,  r = a√3 / 6</text><text x="360" y="360" font-size="15" fill="#059669" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Hình vuông cạnh a:  R = a√2 / 2,  r = a / 2</text>
</svg>
