<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 346" width="900" height="346" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="346" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Chiến dịch Điện Biên Phủ (1954): ba đợt tấn công</text>
<g transform="translate(0,44)">
<rect x="20" y="10" width="270" height="44" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="155" y="38" text-anchor="middle" font-size="17" fill="#ffffff" font-weight="700"><tspan x="155" dy="0">Đợt 1</tspan></text><rect x="20" y="58" width="270" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="155" y="79.9" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="155" dy="0">13/3 – 17/3/1954</tspan></text><rect x="20" y="96" width="270" height="92" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="155" y="130.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="155" dy="0">Tiêu diệt cứ điểm Him Lam</tspan><tspan x="155" dy="16.25">và phân khu Bắc (Độc Lập,</tspan><tspan x="155" dy="16.25">bức hàng Bản Kéo)</tspan></text><line x1="292" y1="32" x2="310" y2="32" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="312" y="10" width="270" height="44" rx="8" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/><text x="447" y="38" text-anchor="middle" font-size="17" fill="#ffffff" font-weight="700"><tspan x="447" dy="0">Đợt 2</tspan></text><rect x="312" y="58" width="270" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="447" y="79.9" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="447" dy="0">30/3 – 26/4/1954</tspan></text><rect x="312" y="96" width="270" height="92" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="447" y="130.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="447" dy="0">Đánh chiếm các cao điểm</tspan><tspan x="447" dy="16.25">phía đông phân khu trung tâm</tspan><tspan x="447" dy="16.25">(E1, D1, C1, A1 – giằng co ác liệt)</tspan></text><line x1="584" y1="32" x2="602" y2="32" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="604" y="10" width="270" height="44" rx="8" fill="#e4572e" stroke="#e4572e" stroke-width="1.5"/><text x="739" y="38" text-anchor="middle" font-size="17" fill="#ffffff" font-weight="700"><tspan x="739" dy="0">Đợt 3</tspan></text><rect x="604" y="58" width="270" height="34" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="739" y="79.9" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="739" dy="0">1/5 – 7/5/1954</tspan></text><rect x="604" y="96" width="270" height="92" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.5"/><text x="739" y="130.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="739" dy="0">Tổng công kích; 17 giờ 30</tspan><tspan x="739" dy="16.25">ngày 7/5 bắt sống tướng</tspan><tspan x="739" dy="16.25">Đờ Ca-xtơ-ri cùng Bộ chỉ huy</tspan></text><rect x="20" y="202" width="856" height="92" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="36" y="235.9" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="36" dy="0">Ý nghĩa: đập tan kế hoạch Na-va, giáng đòn quyết định vào ý chí xâm lược của thực dân Pháp; buộc Pháp kí</tspan><tspan x="36" dy="16.875">Hiệp định Giơ-ne-vơ (21/7/1954), chấm dứt chiến tranh, lập lại hòa bình ở Đông Dương; cổ vũ phong trào giải</tspan><tspan x="36" dy="16.875">phóng dân tộc thế giới. "Lừng lẫy năm châu, chấn động địa cầu" – 56 ngày đêm.</tspan></text>
</g>
</svg>
