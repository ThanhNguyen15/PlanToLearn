<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 389" width="900" height="389" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="389" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Thấu kính phân kì và cách nhận biết thấu kính</text>
<g transform="translate(0,44)">
<rect x="6" y="0" width="438" height="340" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="225" y="24" text-anchor="middle" font-size="14.5" fill="#7c3aed" font-weight="700"><tspan x="225" dy="0">Thấu kính phân kì</tspan></text><line x1="16" y1="200" x2="434" y2="200" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/><line x1="260" y1="70" x2="260" y2="288" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><line x1="252" y1="62" x2="260" y2="72" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><line x1="268" y1="62" x2="260" y2="72" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><line x1="252" y1="296" x2="260" y2="286" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><line x1="268" y1="296" x2="260" y2="286" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><circle cx="170" cy="200" r="4" fill="#1f2937"/><text x="170" y="218" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="170" dy="0">F</tspan></text><circle cx="350" cy="200" r="4" fill="#1f2937"/><text x="350" y="218" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="350" dy="0">F'</tspan></text><text x="270" y="218" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700"><tspan x="270" dy="0">O</tspan></text><line x1="110" y1="200" x2="110" y2="120" stroke="#059669" stroke-width="3" marker-end="url(#ah-green)" stroke-linecap="round"/><text x="100" y="114" text-anchor="middle" font-size="14" fill="#059669" font-weight="700"><tspan x="100" dy="0">B</tspan></text><text x="110" y="218" text-anchor="middle" font-size="14" fill="#059669" font-weight="700"><tspan x="110" dy="0">A</tspan></text><line x1="110" y1="120" x2="260" y2="120" stroke="#e4572e" stroke-width="1.8" stroke-linecap="round"/><line x1="260" y1="120" x2="344.4" y2="45" stroke="#e4572e" stroke-width="1.8" marker-end="url(#ah-red)" stroke-linecap="round"/><line x1="110" y1="120" x2="395" y2="272" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah-purple)" stroke-linecap="round"/><line x1="260" y1="120" x2="203.8" y2="170" stroke="#e4572e" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="110" y1="120" x2="203.8" y2="170" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="203.8" y1="200" x2="203.8" y2="170" stroke="#f59e0b" stroke-width="3" stroke-dasharray="7 4" stroke-linecap="round"/><text x="189.8" y="164" text-anchor="middle" font-size="14" fill="#f59e0b" font-weight="700"><tspan x="189.8" dy="0">B'</tspan></text><text x="197.8" y="218" text-anchor="middle" font-size="13" fill="#f59e0b" font-weight="700"><tspan x="197.8" dy="0">A'</tspan></text><text x="225" y="312" text-anchor="middle" font-size="13.5" fill="#f59e0b" font-weight="700"><tspan x="225" dy="0">Luôn cho ẢNH ẢO, CÙNG CHIỀU, NHỎ HƠN vật</tspan></text><text x="225" y="332" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="225" dy="0">(ảnh nằm trong khoảng tiêu cự)</tspan></text><rect x="460" y="10" width="430" height="330" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="476" y="74.9" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="476" dy="0">Nhận biết thấu kính:</tspan><tspan x="476" dy="17.5">• Hội tụ: rìa MỎNG hơn phần giữa;</tspan><tspan x="476" dy="17.5">  chùm tới song song → chùm ló HỘI TỤ</tspan><tspan x="476" dy="17.5">• Phân kì: rìa DÀY hơn phần giữa;</tspan><tspan x="476" dy="17.5">  chùm tới song song → chùm ló LOE RỘNG</tspan><tspan x="476" dy="17.5"> </tspan><tspan x="476" dy="17.5">Tính toán (dùng tam giác đồng dạng):</tspan><tspan x="476" dy="17.5">  h'/h = d'/d</tspan><tspan x="476" dy="17.5">• Hội tụ, ảnh thật: 1/f = 1/d + 1/d'</tspan><tspan x="476" dy="17.5"> </tspan><tspan x="476" dy="17.5">Kính lúp: thấu kính hội tụ tiêu cự ngắn</tspan><tspan x="476" dy="17.5">  số bội giác G = 25 / f (f tính bằng cm)</tspan><tspan x="476" dy="17.5">  vật đặt trong khoảng tiêu cự</tspan></text>
</g>
</svg>
