<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376" width="900" height="376" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="376" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Dân cư Việt Nam: những con số cần nhớ</text>
<g transform="translate(0,44)">
<rect x="14" y="8" width="206" height="130" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="117" y="56" text-anchor="middle" font-size="30" fill="#2563eb" font-weight="700"><tspan x="117" dy="0">≈ 100 triệu</tspan></text><text x="117" y="88" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="117" dy="0">người (2023)</tspan><tspan x="117" dy="16.875">đông thứ 3 Đông Nam Á</tspan></text><rect x="236" y="8" width="206" height="130" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="339" y="56" text-anchor="middle" font-size="30" fill="#059669" font-weight="700"><tspan x="339" dy="0">54</tspan></text><text x="339" y="88" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="339" dy="0">dân tộc</tspan><tspan x="339" dy="16.875">Kinh chiếm ≈ 85%</tspan></text><rect x="458" y="8" width="206" height="130" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="561" y="56" text-anchor="middle" font-size="30" fill="#f59e0b" font-weight="700"><tspan x="561" dy="0">≈ 300</tspan></text><text x="561" y="88" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="561" dy="0">người/km²</tspan><tspan x="561" dy="16.875">mật độ dân số cao</tspan></text><rect x="680" y="8" width="206" height="130" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="783" y="56" text-anchor="middle" font-size="30" fill="#7c3aed" font-weight="700"><tspan x="783" dy="0">≈ 38%</tspan></text><text x="783" y="88" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="783" dy="0">dân số sống ở</tspan><tspan x="783" dy="16.875">thành thị và đang tăng</tspan></text><rect x="14" y="154" width="430" height="150" rx="8" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.5"/><text x="30" y="191.5" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="30" dy="0">Phân bố dân cư CHƯA ĐỀU:</tspan><tspan x="30" dy="16.875">• Đồng bằng, ven biển: đông đúc</tspan><tspan x="30" dy="16.875">  (Đồng bằng sông Hồng mật độ cao nhất)</tspan><tspan x="30" dy="16.875">• Trung du, miền núi: thưa thớt</tspan><tspan x="30" dy="16.875">  (Tây Nguyên, Tây Bắc)</tspan><tspan x="30" dy="16.875">• Nông thôn vẫn chiếm phần lớn dân số</tspan></text><rect x="456" y="154" width="430" height="150" rx="8" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.5"/><text x="472" y="191.5" text-anchor="start" font-size="13.5" fill="#1f2937"><tspan x="472" dy="0">Cơ cấu dân số đang biến đổi:</tspan><tspan x="472" dy="16.875">• Đang trong thời kì "cơ cấu dân số vàng"</tspan><tspan x="472" dy="16.875">  (nhiều người trong độ tuổi lao động)</tspan><tspan x="472" dy="16.875">• Tỉ lệ trẻ em giảm, người cao tuổi tăng</tspan><tspan x="472" dy="16.875">  → xu hướng già hóa dân số</tspan><tspan x="472" dy="16.875">• Cơ hội: nguồn lao động dồi dào</tspan></text><text x="450" y="324" text-anchor="middle" font-size="12.5" fill="#6b7280"><tspan x="450" dy="0">Số liệu làm tròn để dễ nhớ; khi làm bài dùng số liệu trong SGK hoặc Atlat / đề cho</tspan></text>
</g>
</svg>
