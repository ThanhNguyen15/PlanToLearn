<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 382" width="900" height="382" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="382" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Câu tường thuật (Reported speech): lùi thì và đổi trạng từ</text>
<g transform="translate(0,44)">
<rect x="20" y="8" width="190" height="34" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="115" y="30" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="115" dy="0">Trực tiếp</tspan></text><rect x="210" y="8" width="40" height="34" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="230" y="30" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="230" dy="0">→</tspan></text><rect x="250" y="8" width="200" height="34" rx="0" fill="#dbeafe" stroke="#334155" stroke-width="1"/><text x="350" y="30" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="350" dy="0">Gián tiếp (lùi thì)</tspan></text><rect x="20" y="42" width="190" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="115" y="64" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="115" dy="0">V (hiện tại đơn)</tspan></text><rect x="210" y="42" width="40" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="230" y="64" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="230" dy="0">→</tspan></text><rect x="250" y="42" width="200" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="350" y="64" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="350" dy="0">V2/ed (quá khứ đơn)</tspan></text><rect x="20" y="76" width="190" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="115" y="98" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="115" dy="0">am/is/are + V-ing</tspan></text><rect x="210" y="76" width="40" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="230" y="98" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="230" dy="0">→</tspan></text><rect x="250" y="76" width="200" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="350" y="98" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="350" dy="0">was/were + V-ing</tspan></text><rect x="20" y="110" width="190" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="115" y="132" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="115" dy="0">V2/ed · have/has + V3</tspan></text><rect x="210" y="110" width="40" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="230" y="132" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="230" dy="0">→</tspan></text><rect x="250" y="110" width="200" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="350" y="132" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="350" dy="0">had + V3</tspan></text><rect x="20" y="144" width="190" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="115" y="166" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="115" dy="0">will / can / may</tspan></text><rect x="210" y="144" width="40" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="230" y="166" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="230" dy="0">→</tspan></text><rect x="250" y="144" width="200" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="350" y="166" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="350" dy="0">would / could / might</tspan></text><rect x="20" y="178" width="190" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="115" y="200" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="115" dy="0">must</tspan></text><rect x="210" y="178" width="40" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="230" y="200" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="230" dy="0">→</tspan></text><rect x="250" y="178" width="200" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="350" y="200" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="350" dy="0">had to</tspan></text><rect x="470" y="8" width="190" height="34" rx="0" fill="#fef3c7" stroke="#334155" stroke-width="1"/><text x="565" y="30" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="565" dy="0">Trực tiếp</tspan></text><rect x="660" y="8" width="220" height="34" rx="0" fill="#fef3c7" stroke="#334155" stroke-width="1"/><text x="770" y="30" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="770" dy="0">Gián tiếp</tspan></text><rect x="470" y="42" width="190" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="565" y="64" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="565" dy="0">now</tspan></text><rect x="660" y="42" width="220" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="770" y="64" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="770" dy="0">then</tspan></text><rect x="470" y="76" width="190" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="565" y="98" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="565" dy="0">today / tonight</tspan></text><rect x="660" y="76" width="220" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="770" y="98" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="770" dy="0">that day / that night</tspan></text><rect x="470" y="110" width="190" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="565" y="132" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="565" dy="0">tomorrow</tspan></text><rect x="660" y="110" width="220" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="770" y="132" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="770" dy="0">the next day</tspan></text><rect x="470" y="144" width="190" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="565" y="166" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="565" dy="0">yesterday</tspan></text><rect x="660" y="144" width="220" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="770" y="166" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="770" dy="0">the day before</tspan></text><rect x="470" y="178" width="190" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="565" y="200" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="565" dy="0">here / this / these</tspan></text><rect x="660" y="178" width="220" height="34" rx="0" fill="#ffffff" stroke="#334155" stroke-width="1"/><text x="770" y="200" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="770" dy="0">there / that / those</tspan></text><rect x="20" y="226" width="860" height="104" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="450" y="265.9" text-anchor="middle" font-size="13.5" fill="#1f2937"><tspan x="450" dy="0">Câu hỏi Yes/No:  "Do you like tea?" she asked me.  →  She asked me IF / WHETHER I liked tea.</tspan><tspan x="450" dy="16.875">Câu hỏi Wh-:  "Where do you live?" he asked.  →  He asked me WHERE I lived.   (KHÔNG đảo trợ động từ)</tspan><tspan x="450" dy="16.875">Đổi đại từ: I → he/she · my → his/her · we → they · you → I/me (tùy người nghe)</tspan></text>
</g>
</svg>
