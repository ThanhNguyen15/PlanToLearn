<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 349" width="900" height="349" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="349" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Năng lượng hóa thạch và năng lượng tái tạo</text>
<g transform="translate(0,44)">
<rect x="8" y="0" width="434" height="300" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><rect x="458" y="0" width="434" height="300" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="225" y="28" text-anchor="middle" font-size="16" fill="#e4572e" font-weight="700"><tspan x="225" dy="0">NĂNG LƯỢNG HÓA THẠCH</tspan></text><text x="675" y="28" text-anchor="middle" font-size="16" fill="#059669" font-weight="700"><tspan x="675" dy="0">NĂNG LƯỢNG TÁI TẠO</tspan></text><text x="225" y="54" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="225" dy="0">than đá · dầu mỏ · khí tự nhiên</tspan></text><rect x="24" y="70" width="402" height="210" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.5"/><text x="40" y="127.4" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="40" dy="0">+ Nhiều năng lượng, chủ động, công nghệ</tspan><tspan x="40" dy="17.5">   sẵn có</tspan><tspan x="40" dy="17.5">− Có hạn, hình thành hàng triệu năm</tspan><tspan x="40" dy="17.5">− Thải CO₂ → hiệu ứng nhà kính,</tspan><tspan x="40" dy="17.5">   biến đổi khí hậu</tspan><tspan x="40" dy="17.5">− Thải SO₂, NOₓ, bụi → mưa acid,</tspan><tspan x="40" dy="17.5">   ô nhiễm không khí</tspan></text><text x="675" y="54" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700"><tspan x="675" dy="0">Mặt Trời · gió · nước · sinh khối · địa nhiệt · sóng</tspan></text><rect x="474" y="70" width="402" height="210" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="490" y="127.4" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="490" dy="0">+ Gần như vô tận, có sẵn trong tự nhiên</tspan><tspan x="490" dy="17.5">+ Ít phát thải, thân thiện môi trường</tspan><tspan x="490" dy="17.5">− Phụ thuộc thời tiết (nắng, gió)</tspan><tspan x="490" dy="17.5">− Chi phí đầu tư ban đầu cao</tspan><tspan x="490" dy="17.5"> </tspan><tspan x="490" dy="17.5">Việt Nam: điện mặt trời (Ninh Thuận…),</tspan><tspan x="490" dy="17.5">điện gió, thủy điện (Hòa Bình, Sơn La…)</tspan></text>
</g>
</svg>
