<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" width="900" height="366" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="366" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Sự tán sắc ánh sáng qua lăng kính</text>
<g transform="translate(0,44)">
<polygon points="380,30 270,230 490,230" fill="#dbeafe" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/><line x1="60" y1="175" x2="330" y2="125" stroke="#1f2937" stroke-width="4" marker-end="url(#ah-ink)" stroke-linecap="round"/><text x="120" y="190" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="120" dy="0">Ánh sáng trắng</tspan></text><line x1="330" y1="125" x2="430" y2="120" stroke="#e11d48" stroke-width="2"/><line x1="430" y1="120" x2="820" y2="120" stroke="#e11d48" stroke-width="3"/><text x="830" y="125" text-anchor="start" font-size="13" fill="#e11d48" font-weight="700"><tspan x="830" dy="0">đỏ</tspan></text><line x1="330" y1="125" x2="432" y2="127" stroke="#f97316" stroke-width="2"/><line x1="432" y1="127" x2="820" y2="146" stroke="#f97316" stroke-width="3"/><text x="830" y="151" text-anchor="start" font-size="13" fill="#f97316" font-weight="700"><tspan x="830" dy="0">da cam</tspan></text><line x1="330" y1="125" x2="434" y2="134" stroke="#eab308" stroke-width="2"/><line x1="434" y1="134" x2="820" y2="172" stroke="#eab308" stroke-width="3"/><text x="830" y="177" text-anchor="start" font-size="13" fill="#eab308" font-weight="700"><tspan x="830" dy="0">vàng</tspan></text><line x1="330" y1="125" x2="436" y2="141" stroke="#16a34a" stroke-width="2"/><line x1="436" y1="141" x2="820" y2="198" stroke="#16a34a" stroke-width="3"/><text x="830" y="203" text-anchor="start" font-size="13" fill="#16a34a" font-weight="700"><tspan x="830" dy="0">lục</tspan></text><line x1="330" y1="125" x2="438" y2="148" stroke="#2563eb" stroke-width="2"/><line x1="438" y1="148" x2="820" y2="224" stroke="#2563eb" stroke-width="3"/><text x="830" y="229" text-anchor="start" font-size="13" fill="#2563eb" font-weight="700"><tspan x="830" dy="0">lam</tspan></text><line x1="330" y1="125" x2="440" y2="155" stroke="#4f46e5" stroke-width="2"/><line x1="440" y1="155" x2="820" y2="250" stroke="#4f46e5" stroke-width="3"/><text x="830" y="255" text-anchor="start" font-size="13" fill="#4f46e5" font-weight="700"><tspan x="830" dy="0">chàm</tspan></text><line x1="330" y1="125" x2="442" y2="162" stroke="#7c3aed" stroke-width="2"/><line x1="442" y1="162" x2="820" y2="276" stroke="#7c3aed" stroke-width="3"/><text x="830" y="281" text-anchor="start" font-size="13" fill="#7c3aed" font-weight="700"><tspan x="830" dy="0">tím</tspan></text><text x="380" y="260" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="700"><tspan x="380" dy="0">Lăng kính</tspan></text><text x="450" y="290" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="450" dy="0">Ánh sáng trắng là hỗn hợp nhiều ánh sáng màu · Lăng kính tách thành dải màu: đỏ lệch ÍT nhất, tím lệch NHIỀU nhất</tspan></text><text x="450" y="312" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="450" dy="0">Màu của vật: vật màu nào thì tán xạ (hắt lại) mạnh ánh sáng màu đó · vật trắng tán xạ mọi màu · vật đen không tán xạ</tspan></text>
</g>
</svg>
