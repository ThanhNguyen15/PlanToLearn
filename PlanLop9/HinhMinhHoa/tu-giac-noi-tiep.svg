<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="384" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Tứ giác nội tiếp đường tròn</text>
<g transform="translate(0,44)">
<circle cx="180" cy="175" r="120" fill="none" stroke="#2563eb" stroke-width="2"/><polygon points="111.2,76.7 71.2,225.7 264.9,259.9 271.9,97.9" fill="#dbeafe" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/><circle cx="180" cy="175" r="3.5" fill="#1f2937"/><text x="190" y="179" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="190" dy="0">O</tspan></text><path d="M111.2,76.7 L104.4,101.8 A26,26 0 0 0 136.9,80.1 Z" fill="#fde2da" stroke="#e4572e" stroke-width="2"/><path d="M264.9,259.9 L266,233.9 A26,26 0 0 0 239.2,255.3 Z" fill="#fde2da" stroke="#e4572e" stroke-width="2"/><path d="M71.2,225.7 L92.9,229.5 A22,22 0 0 0 76.9,204.5 Z" fill="#d1fae5" stroke="#059669" stroke-width="2"/><path d="M271.9,97.9 L250.1,95 A22,22 0 0 0 271,119.8 Z" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="101.2" y="68.7" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="101.2" dy="0">A</tspan></text><text x="57.2" y="233.7" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="57.2" dy="0">B</tspan></text><text x="274.9" y="275.9" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="274.9" dy="0">C</tspan></text><text x="285.9" y="95.9" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="285.9" dy="0">D</tspan></text><rect x="360" y="14" width="530" height="140" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="625" y="70.5" text-anchor="middle" font-size="15" fill="#1f2937"><tspan x="625" dy="0">Tính chất: tứ giác ABCD nội tiếp ⇒</tspan><tspan x="625" dy="18.75">  Â + Ĉ = 180°   và   B̂ + D̂ = 180°</tspan><tspan x="625" dy="18.75">(tổng hai góc đối bằng 180°)</tspan></text><rect x="360" y="166" width="530" height="160" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="376" y="215.9" text-anchor="start" font-size="14" fill="#1f2937"><tspan x="376" dy="0">Cách chứng minh tứ giác nội tiếp (hay dùng):</tspan><tspan x="376" dy="17.5">① Tổng hai góc đối bằng 180°</tspan><tspan x="376" dy="17.5">② Hai đỉnh kề cùng nhìn cạnh nối hai đỉnh còn lại</tspan><tspan x="376" dy="17.5">    dưới hai góc BẰNG NHAU (hay gặp: cùng bằng 90°)</tspan><tspan x="376" dy="17.5">③ Bốn đỉnh cách đều một điểm (tìm được tâm)</tspan></text><text x="180" y="330" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="180" dy="0">Hình chữ nhật, hình vuông, hình thang cân luôn nội tiếp</tspan></text>
</g>
</svg>
