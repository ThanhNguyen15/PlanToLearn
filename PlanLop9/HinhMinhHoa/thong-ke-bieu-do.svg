<svg xmlns="http://www.w3.org/2000/svg" width="840" height="490" viewBox="0 0 840 490">
<title>Biểu đồ tần số và tần số tương đối</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="420" y="30" font-size="17" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Khảo sát 40 học sinh: số giờ dùng điện thoại mỗi ngày (số liệu minh họa)</text><line x1="70" y1="330" x2="430" y2="330" stroke="#1f2937" stroke-width="2"/><line x1="70" y1="330" x2="70" y2="60" stroke="#1f2937" stroke-width="2"/><line x1="65" y1="330" x2="430" y2="330" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="335" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">0</text><line x1="65" y1="290" x2="430" y2="290" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="295" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2</text><line x1="65" y1="250" x2="430" y2="250" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="255" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">4</text><line x1="65" y1="210" x2="430" y2="210" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="215" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">6</text><line x1="65" y1="170" x2="430" y2="170" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="175" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">8</text><line x1="65" y1="130" x2="430" y2="130" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="135" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">10</text><line x1="65" y1="90" x2="430" y2="90" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="95" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">12</text><rect x="90" y="170" width="44" height="160" fill="#059669" rx="3"/><text x="112" y="164" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">8</text><text x="112" y="350" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">1 giờ</text><rect x="158" y="90" width="44" height="240" fill="#2563eb" rx="3"/><text x="180" y="84" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">12</text><text x="180" y="350" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2 giờ</text><rect x="226" y="130" width="44" height="200" fill="#f59e0b" rx="3"/><text x="248" y="124" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">10</text><text x="248" y="350" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">3 giờ</text><rect x="294" y="210" width="44" height="120" fill="#e4572e" rx="3"/><text x="316" y="204" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">6</text><text x="316" y="350" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">4 giờ</text><rect x="362" y="250" width="44" height="80" fill="#7c3aed" rx="3"/><text x="384" y="244" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">4</text><text x="384" y="350" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">5 giờ</text><text x="250" y="378" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Biểu đồ cột: TẦN SỐ</text><path d="M 640,200 L 640,80 A 120 120 0 0 1 754.1,162.9 Z" fill="#059669" stroke="#fff" stroke-width="2"/><text x="685.1" y="142.9" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">20%</text><path d="M 640,200 L 754.1,162.9 A 120 120 0 0 1 640,320 Z" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="702.1" y="250.1" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">30%</text><path d="M 640,200 L 640,320 A 120 120 0 0 1 520,200 Z" fill="#f59e0b" stroke="#fff" stroke-width="2"/><text x="585.7" y="259.3" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">25%</text><path d="M 640,200 L 520,200 A 120 120 0 0 1 569.5,102.9 Z" fill="#e4572e" stroke="#fff" stroke-width="2"/><text x="571.6" y="170.1" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">15%</text><path d="M 640,200 L 569.5,102.9 A 120 120 0 0 1 640,80 Z" fill="#7c3aed" stroke="#fff" stroke-width="2"/><text x="616.3" y="132" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">10%</text><text x="640" y="378" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Biểu đồ quạt: TẦN SỐ TƯƠNG ĐỐI</text><rect x="545" y="332" width="12" height="12" fill="#059669"/><text x="568" y="343" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">1h</text><rect x="585" y="332" width="12" height="12" fill="#2563eb"/><text x="608" y="343" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2h</text><rect x="625" y="332" width="12" height="12" fill="#f59e0b"/><text x="648" y="343" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">3h</text><rect x="665" y="332" width="12" height="12" fill="#e4572e"/><text x="688" y="343" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">4h</text><rect x="705" y="332" width="12" height="12" fill="#7c3aed"/><text x="728" y="343" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">5h</text><rect x="40" y="400" width="760" height="70" rx="10" fill="#fff7ed" stroke="#f59e0b"/><text x="420" y="428" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Chọn ngẫu nhiên 1 bạn.  P(“dùng đúng 3 giờ”) = 10/40 = 0,25</text><text x="420" y="455" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">P(“dùng không quá 3 giờ”) = (8 + 12 + 10)/40 = 30/40 = 0,75    ·    tần số tương đối = tần số / tổng × 100%</text>
</svg>
