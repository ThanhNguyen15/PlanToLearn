<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" width="900" height="366" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="366" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Truyện Kiều (Nguyễn Du) – truyện thơ Nôm viết bằng thể lục bát</text>
<g transform="translate(0,44)">
<rect x="20" y="8" width="260" height="52" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="150" y="29.9" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="150" dy="0">Gặp gỡ và</tspan><tspan x="150" dy="18.75">đính ước</tspan></text><rect x="20" y="64" width="260" height="70" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="150" y="95.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="150" dy="0">Kiều gặp Kim Trọng,</tspan><tspan x="150" dy="16.25">thề nguyền</tspan></text><line x1="282" y1="34" x2="308" y2="34" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="310" y="8" width="260" height="52" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="440" y="29.9" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="440" dy="0">Gia biến và</tspan><tspan x="440" dy="18.75">lưu lạc</tspan></text><rect x="310" y="64" width="260" height="70" rx="8" fill="#ffffff" stroke="#e4572e" stroke-width="1.5"/><text x="440" y="87.3" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="440" dy="0">15 năm đoạn trường:</tspan><tspan x="440" dy="16.25">bán mình chuộc cha,</tspan><tspan x="440" dy="16.25">lầu Ngưng Bích…</tspan></text><line x1="572" y1="34" x2="598" y2="34" stroke="#6b7280" stroke-width="2" marker-end="url(#ah-soft)" stroke-linecap="round"/><rect x="600" y="8" width="260" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="730" y="39.3" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="730" dy="0">Đoàn tụ</tspan></text><rect x="600" y="64" width="260" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="730" y="95.4" text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="730" dy="0">Kiều gặp lại gia đình,</tspan><tspan x="730" dy="16.25">"tái hợp" với Kim Trọng</tspan></text><text x="450" y="166" text-anchor="middle" font-size="15" fill="#1f2937" font-weight="700"><tspan x="450" dy="0">Thành công nghệ thuật của Nguyễn Du (dùng để phân tích đoạn trích)</tspan></text><rect x="14" y="180" width="208" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="118" y="203.2" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="118" dy="0">Bút pháp ước lệ,</tspan><tspan x="118" dy="17.5">tượng trưng</tspan></text><rect x="14" y="238" width="208" height="76" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="118" y="264.8" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="118" dy="0">Lấy vẻ đẹp thiên nhiên</tspan><tspan x="118" dy="15.625">để tả người: "mai cốt cách,</tspan><tspan x="118" dy="15.625">tuyết tinh thần"</tspan></text><rect x="234" y="180" width="208" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="338" y="211.9" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="338" dy="0">Tả cảnh ngụ tình</tspan></text><rect x="234" y="238" width="208" height="76" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="338" y="264.8" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="338" dy="0">Cảnh là tâm trạng:</tspan><tspan x="338" dy="15.625">"Buồn trông cửa bể chiều hôm…"</tspan><tspan x="338" dy="15.625">(lầu Ngưng Bích)</tspan></text><rect x="454" y="180" width="208" height="54" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="558" y="203.2" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="558" dy="0">Miêu tả nội tâm,</tspan><tspan x="558" dy="17.5">độc thoại</tspan></text><rect x="454" y="238" width="208" height="76" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/><text x="558" y="272.6" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="558" dy="0">Nhân vật tự nói với mình,</tspan><tspan x="558" dy="15.625">bộc lộ day dứt, nhớ thương</tspan></text><rect x="674" y="180" width="208" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="778" y="203.2" text-anchor="middle" font-size="14" fill="#1f2937" font-weight="700"><tspan x="778" dy="0">Ngôn ngữ</tspan><tspan x="778" dy="17.5">tinh tế, giàu nhạc</tspan></text><rect x="674" y="238" width="208" height="76" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="778" y="272.6" text-anchor="middle" font-size="12.5" fill="#1f2937"><tspan x="778" dy="0">Từ láy, điệp ngữ, điển cố,</tspan><tspan x="778" dy="15.625">thể lục bát mượt mà</tspan></text>
</g>
</svg>
