<svg xmlns="http://www.w3.org/2000/svg" width="1195" height="330" viewBox="0 0 1195 330">
<title>Cung, hình quạt, viên phân, vành khăn</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="15" y="15" width="280" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="15" y="15" width="280" height="34" rx="14" fill="#2563eb"/><rect x="15" y="35" width="280" height="14" fill="#2563eb"/><text x="155" y="38" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Độ dài cung n°</text><circle cx="155" cy="165" r="90" stroke="#6b7280" stroke-width="1.5" fill="none"/><path d="M 239.6,134.2 A 90 90 0 0 0 110,87.1" stroke="#2563eb" stroke-width="6" fill="none" stroke-linecap="round"/><line x1="155" y1="165" x2="239.6" y2="134.2" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="155" y1="165" x2="110" y2="87.1" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M 155,165 L 175.7,157.5 A 22 22 0 0 0 144,145.9 Z" fill="rgba(245,158,11,0.30)" stroke="#f59e0b" stroke-width="1.5"/><text x="159" y="137" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">n°</text><circle cx="155" cy="165" r="3.5" fill="#1f2937"/><text x="149" y="185" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">O</text><text x="201.3" y="167.6" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">R</text><text x="155" y="283" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">l = πRn / 180</text><text x="155" y="305" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Bánh xe lăn 1 vòng: 2πR</text><rect x="310" y="15" width="280" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="310" y="15" width="280" height="34" rx="14" fill="#f59e0b"/><rect x="310" y="35" width="280" height="14" fill="#f59e0b"/><text x="450" y="38" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Hình quạt n°</text><circle cx="450" cy="165" r="90" stroke="#6b7280" stroke-width="1.5" fill="none"/><path d="M 450,165 L 534.6,134.2 A 90 90 0 0 0 405,87.1 Z" fill="rgba(245,158,11,0.30)" stroke="#f59e0b" stroke-width="2.5"/><text x="454" y="143" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">n°</text><circle cx="450" cy="165" r="3.5" fill="#1f2937"/><text x="444" y="185" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">O</text><text x="496.3" y="167.6" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">R</text><text x="450" y="283" font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">S = πR²n / 360 = lR / 2</text><text x="450" y="305" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Miếng bánh pizza</text><rect x="605" y="15" width="280" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="605" y="15" width="280" height="34" rx="14" fill="#e4572e"/><rect x="605" y="35" width="280" height="14" fill="#e4572e"/><text x="745" y="38" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Hình viên phân</text><circle cx="745" cy="165" r="90" stroke="#6b7280" stroke-width="1.5" fill="none"/><path d="M 829.6,134.2 A 90 90 0 0 0 700,87.1 Z" fill="rgba(228,87,46,0.25)" stroke="#e4572e" stroke-width="2.5"/><polygon points="745,165 829.6,134.2 700,87.1" fill="rgba(100,116,139,0.15)" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="745" cy="165" r="3.5" fill="#1f2937"/><text x="739" y="185" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">O</text><text x="791.3" y="167.6" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">R</text><text x="745" y="283" font-size="15" fill="#e4572e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">S = S_quạt − S_tam giác</text><text x="745" y="305" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Phần "mặt trăng" bị cắt</text><rect x="900" y="15" width="280" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><rect x="900" y="15" width="280" height="34" rx="14" fill="#059669"/><rect x="900" y="35" width="280" height="14" fill="#059669"/><text x="1040" y="38" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Hình vành khăn</text><path d="M 950 165 A 90 90 0 1 0 1130 165 A 90 90 0 1 0 950 165 Z M 990 165 A 50 50 0 1 1 1090 165 A 50 50 0 1 1 990 165 Z" fill="rgba(5,150,105,0.22)" fill-rule="evenodd" stroke="#059669" stroke-width="2.5"/><line x1="1040" y1="165" x2="1117.9" y2="120" stroke="#e4572e" stroke-width="2"/><line x1="1040" y1="165" x2="993" y2="182.1" stroke="#2563eb" stroke-width="2"/><text x="1090" y="133" font-size="16" fill="#e4572e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">R</text><text x="1018" y="167" font-size="16" fill="#2563eb" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">r</text><circle cx="1040" cy="165" r="3.5" fill="#1f2937"/><text x="1040" y="283" font-size="15" fill="#059669" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">S = π(R² − r²)</text><text x="1040" y="305" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Lối đi quanh bồn hoa</text>
</svg>
