<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 284" width="900" height="284" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ah-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker><marker id="ah-brown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#92400e"/></marker></defs>
<rect x="0" y="0" width="900" height="284" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Các phép biến đổi căn thức bậc hai (học thuộc 8 thẻ)</text>
<g transform="translate(0,44)">
<rect x="14" y="8" width="208" height="104" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="118" y="52" text-anchor="middle" font-size="17" fill="#2563eb" font-weight="700"><tspan x="118" dy="0">√(A²) = |A|</tspan></text><text x="118" y="86" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="118" dy="0">A ≥ 0 → A ; A &lt; 0 → −A</tspan></text><rect x="234" y="8" width="208" height="104" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="338" y="52" text-anchor="middle" font-size="17" fill="#059669" font-weight="700"><tspan x="338" dy="0">√(A·B) = √A · √B</tspan></text><text x="338" y="86" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="338" dy="0">A ≥ 0, B ≥ 0</tspan></text><rect x="454" y="8" width="208" height="104" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="558" y="52" text-anchor="middle" font-size="17" fill="#059669" font-weight="700"><tspan x="558" dy="0">√(A/B) = √A / √B</tspan></text><text x="558" y="86" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="558" dy="0">A ≥ 0, B &gt; 0</tspan></text><rect x="674" y="8" width="208" height="104" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="778" y="52" text-anchor="middle" font-size="17" fill="#f59e0b" font-weight="700"><tspan x="778" dy="0">√(A²B) = |A|√B</tspan></text><text x="778" y="86" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="778" dy="0">đưa thừa số ra ngoài dấu căn (B ≥ 0)</tspan></text><rect x="14" y="124" width="208" height="104" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="118" y="168" text-anchor="middle" font-size="17" fill="#7c3aed" font-weight="700"><tspan x="118" dy="0">A/√B = A√B / B</tspan></text><text x="118" y="202" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="118" dy="0">trục căn thức ở mẫu (B &gt; 0)</tspan></text><rect x="234" y="124" width="208" height="104" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="338" y="168" text-anchor="middle" font-size="13.5" fill="#7c3aed" font-weight="700"><tspan x="338" dy="0">1/(√a + √b) = (√a − √b)/(a − b)</tspan></text><text x="338" y="202" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="338" dy="0">nhân liên hợp (a ≠ b)</tspan></text><rect x="454" y="124" width="208" height="104" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><text x="558" y="168" text-anchor="middle" font-size="17" fill="#0d9488" font-weight="700"><tspan x="558" dy="0">∛(a³) = a</tspan></text><text x="558" y="202" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="558" dy="0">căn bậc ba: mọi số đều có, ∛(−8) = −2</tspan></text><rect x="674" y="124" width="208" height="104" rx="8" fill="#fde2da" stroke="#e4572e" stroke-width="1.5"/><text x="778" y="168" text-anchor="middle" font-size="17" fill="#e4572e" font-weight="700"><tspan x="778" dy="0">√A có nghĩa ⇔ A ≥ 0</tspan></text><text x="778" y="202" text-anchor="middle" font-size="12" fill="#1f2937"><tspan x="778" dy="0">1/√A có nghĩa ⇔ A &gt; 0</tspan></text>
</g>
</svg>
