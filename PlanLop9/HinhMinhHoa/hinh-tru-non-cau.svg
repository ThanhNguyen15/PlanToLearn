<rect x="0" y="0" width="900" height="409" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Hình trụ – hình nón – hình cầu</text>
<g transform="translate(0,44)">
<rect x="6" y="0" width="288" height="360" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="150" y="24" text-anchor="middle" font-size="16" fill="#2563eb" font-weight="700"><tspan x="150" dy="0">Hình trụ</tspan></text><rect x="20" y="268" width="260" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="150" y="295.4" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="150" dy="0">Sxq = 2πrh</tspan><tspan x="150" dy="17.5">Stp = 2πrh + 2πr²</tspan><tspan x="150" dy="17.5">V = πr²h</tspan></text><rect x="80" y="70" width="140" height="150" fill="#dbeafe" stroke="none"/><ellipse cx="150" cy="220" rx="70" ry="18" fill="#dbeafe" stroke="none" stroke-width="0"/><ellipse cx="150" cy="70" rx="70" ry="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><line x1="80" y1="70" x2="80" y2="220" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><line x1="220" y1="70" x2="220" y2="220" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><path d="M80,220 A70,18 0 0 0 220,220" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M80,220 A70,18 0 0 1 220,220" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/><line x1="150" y1="70" x2="220" y2="70" stroke="#e4572e" stroke-width="1.5" stroke-linecap="round"/><text x="185" y="64" text-anchor="middle" font-size="14" fill="#e4572e" font-style="italic"><tspan x="185" dy="0">r</tspan></text><line x1="150" y1="70" x2="150" y2="220" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><text x="160" y="150" text-anchor="middle" font-size="14" fill="#1f2937" font-style="italic"><tspan x="160" dy="0">h</tspan></text><rect x="306" y="0" width="288" height="360" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="450" y="24" text-anchor="middle" font-size="16" fill="#f59e0b" font-weight="700"><tspan x="450" dy="0">Hình nón</tspan></text><rect x="320" y="268" width="260" height="80" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="450" y="295.4" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="450" dy="0">Sxq = πrl   (l² = r² + h²)</tspan><tspan x="450" dy="17.5">Stp = πrl + πr²</tspan><tspan x="450" dy="17.5">V = ⅓πr²h</tspan></text><polygon points="450,60 380,220 520,220" fill="#fef3c7" stroke="none" stroke-width="0" stroke-linejoin="round"/><ellipse cx="450" cy="220" rx="70" ry="18" fill="#fef3c7" stroke="none" stroke-width="0"/><line x1="450" y1="60" x2="380" y2="220" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><line x1="450" y1="60" x2="520" y2="220" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/><path d="M380,220 A70,18 0 0 0 520,220" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M380,220 A70,18 0 0 1 520,220" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/><line x1="450" y1="60" x2="450" y2="220" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round"/><line x1="450" y1="220" x2="520" y2="220" stroke="#e4572e" stroke-width="1.5" stroke-linecap="round"/><polyline points="459,220 459,211 450,211" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><text x="440" y="150" text-anchor="middle" font-size="14" fill="#1f2937" font-style="italic"><tspan x="440" dy="0">h</tspan></text><text x="485" y="214" text-anchor="middle" font-size="14" fill="#e4572e" font-style="italic"><tspan x="485" dy="0">r</tspan></text><text x="496" y="135" text-anchor="middle" font-size="16" fill="#7c3aed" font-weight="700" font-style="italic"><tspan x="496" dy="0">l</tspan></text><rect x="606" y="0" width="288" height="360" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.5"/><text x="750" y="24" text-anchor="middle" font-size="16" fill="#059669" font-weight="700"><tspan x="750" dy="0">Hình cầu</tspan></text><rect x="620" y="268" width="260" height="80" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/><text x="750" y="295.4" text-anchor="middle" font-size="14" fill="#1f2937"><tspan x="750" dy="0">S = 4πR²</tspan><tspan x="750" dy="17.5">V = ⁴⁄₃πR³</tspan><tspan x="750" dy="17.5">(mặt cầu = 4 hình tròn lớn)</tspan></text><circle cx="750" cy="150" r="85" fill="#d1fae5" stroke="#059669" stroke-width="2"/><path d="M665,150 A85,22 0 0 0 835,150" fill="none" stroke="#059669" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M665,150 A85,22 0 0 1 835,150" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="750" cy="150" r="3.5" fill="#1f2937"/><line x1="750" y1="150" x2="835" y2="150" stroke="#e4572e" stroke-width="1.8" stroke-linecap="round"/><text x="790" y="142" text-anchor="middle" font-size="14" fill="#e4572e" font-style="italic"><tspan x="790" dy="0">R</tspan></text>
